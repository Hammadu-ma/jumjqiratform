<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin | Manage Student Passwords</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-50 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <div class="glass-card p-6 mb-6">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-emerald-700">
                        <i class="fas fa-key mr-2"></i>Manage Student Passwords
                    </h1>
                    <p class="text-gray-500 mt-1">Create, edit, and manage student login credentials</p>
                </div>
                <button onclick="window.location.href='index.html'" class="px-4 py-2 bg-gray-200 rounded-xl hover:bg-gray-300 transition">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                </button>
            </div>
        </div>
        
        <!-- Create New Student Account -->
        <div class="glass-card p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4"><i class="fas fa-plus-circle text-emerald-500 mr-2"></i>Create New Student Account</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="newFirstName" placeholder="First Name" class="px-4 py-2 border rounded-xl focus:outline-none focus:border-emerald-500">
                <input type="text" id="newFullName" placeholder="Full Name" class="px-4 py-2 border rounded-xl focus:outline-none focus:border-emerald-500">
                <input type="email" id="newEmail" placeholder="Email (optional)" class="px-4 py-2 border rounded-xl focus:outline-none focus:border-emerald-500">
                <input type="text" id="newPassword" placeholder="Password" class="px-4 py-2 border rounded-xl focus:outline-none focus:border-emerald-500">
                <button onclick="createStudentAccount()" class="btn-primary px-6 py-2 rounded-xl text-white font-semibold">
                    <i class="fas fa-user-plus mr-2"></i>Create Account
                </button>
            </div>
        </div>
        
        <!-- Student List with Password Management -->
        <div class="glass-card p-6">
            <h2 class="text-xl font-semibold mb-4"><i class="fas fa-users text-emerald-500 mr-2"></i>Student Accounts</h2>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-3 text-left">First Name</th>
                            <th class="px-4 py-3 text-left">Full Name</th>
                            <th class="px-4 py-3 text-left">Email</th>
                            <th class="px-4 py-3 text-left">Student ID</th>
                            <th class="px-4 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="5" class="text-center py-8 text-gray-500">Loading students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { protectPage } from './auth.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        if (!protectPage('admin-login.html')) throw new Error('Redirecting');
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        async function loadStudents() {
            try {
                const snapshot = await getDocs(collection(db, "studentCredentials"));
                const students = [];
                snapshot.forEach(doc => {
                    students.push({ id: doc.id, ...doc.data() });
                });
                renderStudentsTable(students);
            } catch (error) {
                console.error(error);
                showToast('Error loading students', true);
            }
        }
        
        function renderStudentsTable(students) {
            const tbody = document.getElementById('studentsTableBody');
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">No student accounts found</td></tr>';
                return;
            }
            
            tbody.innerHTML = students.map(student => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-3">${escapeHtml(student.firstName)}</td>
                    <td class="px-4 py-3">${escapeHtml(student.fullName || '-')}</td>
                    <td class="px-4 py-3">${escapeHtml(student.email || '-')}</td>
                    <td class="px-4 py-3"><code class="text-xs bg-gray-100 px-2 py-1 rounded">${escapeHtml(student.id.slice(0, 8))}...</code></td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="resetPassword('${student.id}', '${escapeHtml(student.firstName)}')" class="px-3 py-1 bg-yellow-500 text-white rounded-lg text-sm mr-2 hover:bg-yellow-600">
                            <i class="fas fa-key"></i> Reset Password
                        </button>
                        <button onclick="deleteStudent('${student.id}', '${escapeHtml(student.firstName)}')" class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
        
        window.createStudentAccount = async () => {
            const firstName = document.getElementById('newFirstName').value.trim();
            const fullName = document.getElementById('newFullName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            
            if (!firstName || !password) {
                showToast('First name and password are required', true);
                return;
            }
            
            try {
                const studentId = `student_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
                await setDoc(doc(db, "studentCredentials", studentId), {
                    firstName: firstName,
                    fullName: fullName || firstName,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                });
                
                showToast(`Account created for ${firstName}`);
                document.getElementById('newFirstName').value = '';
                document.getElementById('newFullName').value = '';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPassword').value = '';
                loadStudents();
            } catch (error) {
                console.error(error);
                showToast('Error creating account', true);
            }
        };
        
        window.resetPassword = async (studentId, firstName) => {
            const newPassword = prompt(`Enter new password for ${firstName}:`);
            if (newPassword && newPassword.trim()) {
                try {
                    await setDoc(doc(db, "studentCredentials", studentId), {
                        password: newPassword.trim()
                    }, { merge: true });
                    showToast(`Password reset for ${firstName}`);
                } catch (error) {
                    showToast('Error resetting password', true);
                }
            }
        };
        
        window.deleteStudent = async (studentId, firstName) => {
            if (confirm(`Are you sure you want to delete ${firstName}'s account?`)) {
                try {
                    await deleteDoc(doc(db, "studentCredentials", studentId));
                    showToast(`Deleted account for ${firstName}`);
                    loadStudents();
                } catch (error) {
                    showToast('Error deleting account', true);
                }
            }
        };
        
        window.loadStudents = loadStudents;
        loadStudents();
    </script>
</body>
</html>
