<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Ustaz Portal | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ALIF Med">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .full-screen-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }
        
        .bg-shape {
            position: absolute;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .bg-shape-1 { width: 300px; height: 300px; top: -150px; right: -150px; }
        .bg-shape-2 { width: 500px; height: 500px; bottom: -250px; left: -250px; animation-delay: -5s; }
        .bg-shape-3 { width: 200px; height: 200px; top: 50%; right: 10%; animation-delay: -10s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            margin: 20px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            left: 30px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 400px;
            margin: 0 auto;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo-icon {
            animation: floatIcon 3s ease-in-out infinite;
        }
        
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="full-screen-container">
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>
        
        <div class="glass-card">
            <div class="p-8 md:p-10">
                <div class="text-center mb-8">
                    <div class="logo-icon inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl shadow-lg mb-4">
                        <i class="fas fa-chalkboard-user text-4xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800">Ustaz Portal</h1>
                    <p class="text-gray-500 mt-2">Manage your Qirat exams</p>
                </div>
                
                <form id="loginForm" onsubmit="event.preventDefault(); login();">
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user mr-2 text-indigo-500"></i>Ustaz Name
                        </label>
                        <input type="text" id="ustazName" placeholder="Enter your Ustaz name" 
                               class="input-field w-full px-4 py-3 rounded-xl text-gray-700 focus:outline-none">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-lock mr-2 text-indigo-500"></i>Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" 
                               class="input-field w-full px-4 py-3 rounded-xl text-gray-700 focus:outline-none">
                    </div>
                    
                    <button type="submit" id="loginBtn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login
                    </button>
                </form>
                
                <div class="mt-6 text-center text-sm text-gray-500">
                    <p>Contact administrator for login credentials</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        function setLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner mr-2"></span> Verifying...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
            }
        }
        
        window.login = async () => {
            const ustazName = document.getElementById('ustazName').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!ustazName || !password) {
                showToast('Please enter both Ustaz name and password', true);
                return;
            }
            
            setLoading(true);
            
            try {
                const q = query(collection(db, "ustazCredentials"), where("ustazName", "==", ustazName));
                const querySnapshot = await getDocs(q);
                
                let found = false;
                let ustazData = null;
                
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.password === password) {
                        found = true;
                        ustazData = { id: doc.id, ...data };
                    }
                });
                
                if (!found) {
                    setLoading(false);
                    showToast('Invalid Ustaz name or password', true);
                    return;
                }
                
                // Store session
                localStorage.setItem('ustazLoggedIn', 'true');
                localStorage.setItem('ustazId', ustazData.id);
                localStorage.setItem('ustazName', ustazData.ustazName);
                localStorage.setItem('ustazFullName', ustazData.fullName || ustazData.ustazName);
                localStorage.setItem('ustazQirats', JSON.stringify(ustazData.assignedQirats || []));
                
                showToast(`Welcome back, ${ustazData.fullName || ustazData.ustazName}!`);
                
                setTimeout(() => {
                    window.location.href = 'ustaz-dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error(error);
                setLoading(false);
                showToast('Login failed. Please try again.', true);
            }
        };
        
        // Check if already logged in
        if (localStorage.getItem('ustazLoggedIn') === 'true') {
            window.location.href = 'ustaz-dashboard.html';
        }
        
        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
