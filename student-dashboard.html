<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Student Dashboard | Academic Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --primary-glow: rgba(16, 185, 129, 0.2);
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        
        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        /* Glass Card - Same as exam modal */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        
        .glass-card:hover {
            box-shadow: var(--shadow-md);
        }
        
        /* Gradient Header */
        .gradient-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .gradient-header::before {
            content: "📚";
            position: absolute;
            bottom: -20px;
            right: 20px;
            font-size: 80px;
            opacity: 0.1;
            pointer-events: none;
        }
        
        /* Qirat List Card - Matching individual modal style */
        .qirat-list-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }
        
        .qirat-list-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        
        .qirat-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: #f8fafc;
            transition: all 0.2s;
            border-bottom: 1px solid transparent;
        }
        
        .qirat-list-header.active {
            background: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }
        
        .qirat-stat-item {
            background: rgba(16, 185, 129, 0.1);
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--primary-dark);
            font-weight: 500;
        }
        
        .qirat-dropdown-content {
            display: none;
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: white;
        }
        
        .qirat-dropdown-content.show {
            display: block;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .rotate-icon { transition: transform 0.3s ease; }
        .rotate-icon.rotated { transform: rotate(180deg); }
        
        /* Assessment Table - Same as exam modal */
        .assessment-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        
        .assessment-table th,
        .assessment-table td {
            padding: 0.75rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        
        .assessment-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .assessment-table tr:last-child td {
            border-bottom: none;
        }
        
        /* Status Badges */
        .status-badge {
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-passing { background: #d1fae5; color: #065f46; }
        .status-warning { background: #fed7aa; color: #9b3412; }
        .status-excellent { background: #c7d2fe; color: #3730a3; }
        
        /* Rank Badges */
        .rank-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #78350f;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .rank-badge.global {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
        }
        
        /* Stats Cards */
        .stat-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.25rem;
        }
        
        /* Button Styles */
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-outline:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-dark);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: var(--shadow-lg);
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Score Highlight */
        .score-highlight {
            font-weight: 700;
            color: var(--primary-dark);
        }
        
        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            transition: width 0.5s;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .assessment-table th,
            .assessment-table td { padding: 0.5rem; font-size: 0.7rem; }
            .qirat-list-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
            .stat-value { font-size: 1.3rem; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header - Matching exam modal style -->
        <div class="gradient-header p-6 mb-6 text-white">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">
                        <i class="fas fa-user-graduate mr-3"></i>My Academic Dashboard
                    </h1>
                    <p class="text-white/80 mt-1 text-sm" id="studentInfo">Loading your information...</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="refreshDashboard()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl transition text-sm font-medium">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                    <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl transition text-sm font-medium">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Stats Cards - Matching exam modal KPI style -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="totalQirats">0</div>
                <div class="stat-label">Total Qirats</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgScore">0%</div>
                <div class="stat-label">Average Score</div>
                <div class="progress-bar mt-2"><div class="progress-fill" id="avgProgressBar" style="width: 0%"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="globalRank">-</div>
                <div class="stat-label">Global Rank</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="deptRank">-</div>
                <div class="stat-label">Department Rank</div>
            </div>
        </div>
        
        <!-- Performance Chart - Glass card style -->
        <div class="glass-card p-6 mb-6">
            <h3 class="text-lg font-semibold mb-4 text-slate-700">
                <i class="fas fa-chart-line text-emerald-500 mr-2"></i>Performance Trend
            </h3>
            <canvas id="performanceChart" height="200"></canvas>
        </div>
        
        <!-- Qirat Performance Section -->
        <div class="glass-card p-6">
            <h3 class="text-lg font-semibold mb-4 text-slate-700">
                <i class="fas fa-book-quran text-emerald-500 mr-2"></i>Qirat Performance Details
            </h3>
            <div id="qiratListContainer" class="space-y-3">
                <div class="text-center py-8 text-slate-500">Loading your data...</div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let studentData = null;
        let examScores = new Map();
        let allStudents = [];
        let qiratAssessmentConfigs = new Map();
        let chart = null;
        
        const defaultAssessments = [
            { name: "Quiz 1", outOf: 30 },
            { name: "Mid Exam", outOf: 50 },
            { name: "Assignment", outOf: 20 },
            { name: "Final Exam", outOf: 100 }
        ];
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }
        
        function getQiratNames(student) {
            return (student.schedules || []).map(s => s.qirat_name).filter(Boolean);
        }
        
        function getAssessmentsForQirat(qiratName) {
            const config = qiratAssessmentConfigs.get(qiratName);
            return config?.assessments || defaultAssessments;
        }
        
        function calculatePercentage(score, outOf) {
            if (score === null || score === '' || !outOf) return null;
            return Math.round((parseFloat(score) / outOf) * 100);
        }
        
        function calculateTotalPoints(scores, assessments) {
            let total = 0;
            for (let i = 0; i < assessments.length; i++) {
                const score = scores[`assessment${i + 1}`];
                if (score !== null && score !== '' && !isNaN(score)) {
                    total += parseFloat(score);
                }
            }
            return total;
        }
        
        function calculateTotalPossible(assessments) {
            return assessments.reduce((sum, a) => sum + a.outOf, 0);
        }
        
        function calculateAverage(scores, assessments) {
            let totalPercent = 0, count = 0;
            for (let i = 0; i < assessments.length; i++) {
                const score = scores[`assessment${i + 1}`];
                if (score !== null && score !== '' && !isNaN(score)) {
                    const percent = calculatePercentage(parseFloat(score), assessments[i].outOf);
                    if (percent !== null) {
                        totalPercent += percent;
                        count++;
                    }
                }
            }
            return count > 0 ? Math.round(totalPercent / count) : null;
        }
        
        function calculateStudentOverallAvg(studentId) {
            let total = 0, count = 0;
            const student = allStudents.find(s => s.id === studentId);
            if (student) {
                getQiratNames(student).forEach(q => {
                    const scores = examScores.get(studentId)?.[q] || {};
                    const assessments = getAssessmentsForQirat(q);
                    const avg = calculateAverage(scores, assessments);
                    if (avg !== null) {
                        total += avg;
                        count++;
                    }
                });
            }
            return count > 0 ? Math.round(total / count) : null;
        }
        
        function calculateGlobalRank(studentId) {
            const allAvgs = allStudents.map(s => ({
                id: s.id,
                avg: calculateStudentOverallAvg(s.id)
            })).filter(a => a.avg !== null).sort((a, b) => (b.avg || 0) - (a.avg || 0));
            const rank = allAvgs.findIndex(s => s.id === studentId) + 1;
            return rank > 0 ? rank : allAvgs.length;
        }
        
        function calculateDepartmentRank(studentId) {
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return null;
            const deptStudents = allStudents.filter(s => s.department === student.department);
            const deptAvgs = deptStudents.map(s => ({
                id: s.id,
                avg: calculateStudentOverallAvg(s.id)
            })).filter(a => a.avg !== null).sort((a, b) => (b.avg || 0) - (a.avg || 0));
            const rank = deptAvgs.findIndex(s => s.id === studentId) + 1;
            return rank > 0 ? rank : deptAvgs.length;
        }
        
        function calculateQiratGlobalRank(studentId, qiratName) {
            const studentsInQirat = allStudents.filter(s => getQiratNames(s).includes(qiratName));
            const assessments = getAssessmentsForQirat(qiratName);
            const ranked = studentsInQirat.map(s => ({
                id: s.id,
                avg: calculateAverage(examScores.get(s.id)?.[qiratName] || {}, assessments)
            })).filter(a => a.avg !== null).sort((a, b) => (b.avg || 0) - (a.avg || 0));
            const rank = ranked.findIndex(s => s.id === studentId) + 1;
            return rank > 0 ? rank : studentsInQirat.length;
        }
        
        function calculateQiratDepartmentRank(studentId, qiratName) {
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return null;
            const deptStudents = allStudents.filter(s =>
                s.department === student.department && getQiratNames(s).includes(qiratName)
            );
            const assessments = getAssessmentsForQirat(qiratName);
            const ranked = deptStudents.map(s => ({
                id: s.id,
                avg: calculateAverage(examScores.get(s.id)?.[qiratName] || {}, assessments)
            })).filter(a => a.avg !== null).sort((a, b) => (b.avg || 0) - (a.avg || 0));
            const rank = ranked.findIndex(s => s.id === studentId) + 1;
            return rank > 0 ? rank : deptStudents.length;
        }
        
        async function loadQiratAssessmentConfigs() {
            try {
                const configSnapshot = await getDocs(collection(db, "qiratAssessmentConfigs"));
                qiratAssessmentConfigs.clear();
                configSnapshot.forEach(doc => {
                    qiratAssessmentConfigs.set(doc.id, doc.data());
                });
            } catch (e) { console.warn(e); }
        }
        
        async function loadExamScores() {
            try {
                const snapshot = await getDocs(collection(db, "examScores"));
                examScores.clear();
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.scores) {
                        examScores.set(docSnap.id, data.scores);
                    }
                });
            } catch (e) { console.warn(e); }
        }
        
        async function loadAllStudents() {
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                allStudents = [];
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    allStudents.push({
                        id: docSnap.id,
                        full_name: data.full_name || 'N/A',
                        gender: data.gender || 'Not Specified',
                        phone: data.phone || '',
                        department: data.department || 'Other',
                        batch: data.batch || 'General',
                        schedules: data.schedules || []
                    });
                });
            } catch (e) { console.error(e); }
        }
        
        async function loadStudentData() {
            const studentId = localStorage.getItem('studentId');
            if (!studentId) {
                window.location.href = 'student-login.html';
                return false;
            }
            
            try {
                const studentDoc = await getDoc(doc(db, "registrations", studentId));
                
                if (studentDoc.exists()) {
                    studentData = { id: studentDoc.id, ...studentDoc.data() };
                } else {
                    const storedName = localStorage.getItem('studentFullName');
                    for (const student of allStudents) {
                        if (student.full_name === storedName || student.full_name.toLowerCase().includes(storedName?.toLowerCase())) {
                            studentData = student;
                            localStorage.setItem('studentId', student.id);
                            break;
                        }
                    }
                    
                    if (!studentData) {
                        showToast('Student record not found', true);
                        return false;
                    }
                }
                
                const fullName = localStorage.getItem('studentFullName') || studentData.full_name;
                const department = studentData.department || localStorage.getItem('studentDepartment');
                const batch = studentData.batch || localStorage.getItem('studentBatch');
                
                document.getElementById('studentInfo').innerHTML = `<i class="fas fa-building mr-1"></i>${department} | <i class="fas fa-calendar mr-1"></i>${batch} | <i class="fas fa-user mr-1"></i>${fullName}`;
                
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        }
        
        function updateStats() {
            const studentId = localStorage.getItem('studentId');
            if (!studentData) return;
            
            const qirats = getQiratNames(studentData);
            const overallAvg = calculateStudentOverallAvg(studentId);
            const globalRank = calculateGlobalRank(studentId);
            const deptRank = calculateDepartmentRank(studentId);
            
            document.getElementById('totalQirats').textContent = qirats.length;
            document.getElementById('avgScore').textContent = (overallAvg !== null ? overallAvg : 0) + '%';
            document.getElementById('globalRank').textContent = globalRank > 0 ? `#${globalRank}` : '-';
            document.getElementById('deptRank').textContent = deptRank > 0 ? `#${deptRank}` : '-';
            document.getElementById('avgProgressBar').style.width = (overallAvg !== null ? overallAvg : 0) + '%';
        }
        
        function renderPerformanceChart() {
            const studentId = localStorage.getItem('studentId');
            if (!studentData) return;
            
            const qirats = getQiratNames(studentData);
            const labels = [];
            const scores = [];
            
            for (const q of qirats) {
                const scoresData = examScores.get(studentId)?.[q] || {};
                const assessments = getAssessmentsForQirat(q);
                const avg = calculateAverage(scoresData, assessments);
                labels.push(q.length > 15 ? q.substring(0, 12) + '...' : q);
                scores.push(avg !== null ? avg : 0);
            }
            
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chart) chart.destroy();
            
            if (labels.length > 0) {
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Average Score (%)',
                            data: scores,
                            backgroundColor: 'rgba(16, 185, 129, 0.6)',
                            borderColor: '#10b981',
                            borderWidth: 1,
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,0,0,0.05)' } },
                            x: { ticks: { rotation: labels.length > 4 ? 45 : 0 } }
                        },
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }
        }
        
        window.toggleQiratDropdown = (index) => {
            const content = document.getElementById(`qirat-dropdown-${index}`);
            const icon = document.getElementById(`qirat-icon-${index}`);
            const header = document.getElementById(`qirat-header-${index}`);
            
            if (content?.classList.contains('show')) {
                content.classList.remove('show');
                icon?.classList.remove('rotated');
                header?.classList.remove('active');
            } else {
                content?.classList.add('show');
                icon?.classList.add('rotated');
                header?.classList.add('active');
            }
        };
        
        function renderQiratList() {
            const studentId = localStorage.getItem('studentId');
            if (!studentData) return;
            
            const qirats = getQiratNames(studentData);
            const container = document.getElementById('qiratListContainer');
            
            if (qirats.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-500">No Qirats enrolled yet</div>';
                return;
            }
            
            let html = '';
            for (let i = 0; i < qirats.length; i++) {
                const q = qirats[i];
                const scores = examScores.get(studentId)?.[q] || {};
                const assessments = getAssessmentsForQirat(q);
                const avg = calculateAverage(scores, assessments);
                const totalPoints = calculateTotalPoints(scores, assessments);
                const totalPossible = calculateTotalPossible(assessments);
                const totalPercent = totalPossible > 0 ? Math.round((totalPoints / totalPossible) * 100) : 0;
                const qiratGlobalRank = calculateQiratGlobalRank(studentId, q);
                const qiratDeptRank = calculateQiratDepartmentRank(studentId, q);
                const studentsInQirat = allStudents.filter(s => getQiratNames(s).includes(q));
                const studentsInDeptQirat = studentsInQirat.filter(s => s.department === studentData.department);
                
                let assessmentRows = '';
                for (let a = 0; a < assessments.length; a++) {
                    const ass = assessments[a];
                    const score = scores[`assessment${a + 1}`];
                    const percent = calculatePercentage(score, ass.outOf);
                    const statusClass = percent !== null ? (percent >= 70 ? 'text-emerald-600' : (percent >= 50 ? 'text-orange-600' : 'text-gray-500')) : '';
                    assessmentRows += `
                        <tr>
                            <td class="py-2 text-left">${escapeHtml(ass.name)}</td>
                            <td class="py-2 text-center"><span class="font-semibold ${statusClass}">${score !== null ? score : '-'}</span></td>
                            <td class="py-2 text-center text-slate-500">/${ass.outOf}</td>
                            <td class="py-2 text-center ${percent !== null && percent >= 70 ? 'text-emerald-600 font-bold' : (percent !== null && percent >= 50 ? 'text-orange-600' : 'text-gray-500')}">
                                ${percent !== null ? percent + '%' : '-'}
                            </td>
                        </tr>
                    `;
                }
                
                html += `
                    <div class="qirat-list-card">
                        <div id="qirat-header-${i}" class="qirat-list-header" onclick="toggleQiratDropdown(${i})">
                            <div class="flex-1">
                                <div class="flex flex-wrap justify-between items-center gap-2">
                                    <h4 class="font-semibold text-emerald-700 text-base">
                                        <i class="fas fa-book-quran mr-2"></i> ${escapeHtml(q)}
                                    </h4>
                                    <div class="flex gap-2 flex-wrap">
                                        <span class="qirat-stat-item"><i class="fas fa-globe mr-1"></i> #${qiratGlobalRank}/${studentsInQirat.length}</span>
                                        <span class="qirat-stat-item"><i class="fas fa-building mr-1"></i> #${qiratDeptRank}/${studentsInDeptQirat.length}</span>
                                        <span class="qirat-stat-item"><i class="fas fa-chart-line mr-1"></i> ${avg !== null ? avg + '%' : '-'}</span>
                                        <span class="qirat-stat-item"><i class="fas fa-tasks mr-1"></i> ${totalPoints}/${totalPossible}</span>
                                    </div>
                                    <i id="qirat-icon-${i}" class="fas fa-chevron-down text-slate-400 transition-transform rotate-icon"></i>
                                </div>
                            </div>
                        </div>
                        <div id="qirat-dropdown-${i}" class="qirat-dropdown-content">
                            <div class="overflow-x-auto">
                                <table class="assessment-table">
                                    <thead>
                                        <tr>
                                            <th class="text-left">Assessment</th>
                                            <th class="text-center">Your Score</th>
                                            <th class="text-center">Out Of</th>
                                            <th class="text-center">Percentage</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${assessmentRows}
                                        <tr class="bg-emerald-50">
                                            <td class="py-2 font-semibold text-left">Summary</td>
                                            <td class="py-2 text-center font-bold text-emerald-600">${totalPoints}/${totalPossible} (${totalPercent}%)</td>
                                            <td class="py-2 text-center"></td>
                                            <td class="py-2 text-center font-bold text-emerald-600">${avg !== null ? avg + '%' : '-'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-3 text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
                                <i class="fas fa-chart-line mr-1 text-emerald-500"></i> 
                                ${avg !== null ? (avg >= 85 ? 'Excellent performance! Keep up the great work! 🎉' : (avg >= 70 ? 'Good job! You\'re doing well! 👍' : (avg >= 50 ? 'Keep pushing! You can improve! 📚' : 'Need more focus. Don\'t give up! 💪'))) : 'No assessment data available'}
                            </div>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        window.refreshDashboard = async () => {
            showToast('Refreshing your data...');
            await loadAllStudents();
            await loadQiratAssessmentConfigs();
            await loadExamScores();
            const success = await loadStudentData();
            if (success && studentData) {
                updateStats();
                renderQiratList();
                renderPerformanceChart();
                showToast('Dashboard refreshed!');
            } else {
                showToast('Error refreshing data', true);
            }
        };
        
        window.logout = () => {
            localStorage.clear();
            window.location.href = 'student-login.html';
        };
        
        async function init() {
            if (localStorage.getItem('studentLoggedIn') !== 'true') {
                window.location.href = 'student-login.html';
                return;
            }
            
            await loadAllStudents();
            await loadQiratAssessmentConfigs();
            await loadExamScores();
            
            const success = await loadStudentData();
            
            if (success && studentData) {
                updateStats();
                renderQiratList();
                renderPerformanceChart();
            }
        }
        
        window.toggleQiratDropdown = toggleQiratDropdown;
        init();
    </script>
</body>
</html>
