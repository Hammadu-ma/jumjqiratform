<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #10b981, #059669, #047857);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo i {
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-group label i {
            color: var(--primary);
            margin-right: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            z-index: 1;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 50px 14px 48px;
            border: 2px solid var(--border);
            border-radius: 28px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input.error {
            border-color: var(--danger);
        }

        .toggle-visibility {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
            z-index: 1;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-visibility:hover {
            color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.7rem;
            margin-top: 6px;
            display: block;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .login-card { padding: 28px 20px; }
            .logo h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1><i class="fas fa-user-shield"></i> Admin Login</h1>
            <p>Access the Qirat Management Dashboard</p>
        </div>

        <div id="messageContainer"></div>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email">
                </div>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password">
                    <button type="button" class="toggle-visibility" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login to Dashboard</span>
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="admin-register.html">Register as Admin</a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // DOM Elements
    const adminEmail = document.getElementById('adminEmail');
    const adminPassword = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');
    const messageContainer = document.getElementById('messageContainer');
    const togglePasswordBtn = document.getElementById('togglePassword');
    
    // Toggle password visibility
    let isPasswordVisible = false;
    togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isPasswordVisible = !isPasswordVisible;
        adminPassword.type = isPasswordVisible ? 'text' : 'password';
        togglePasswordBtn.innerHTML = isPasswordVisible ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    });
    
    function showMessage(message, type = 'info') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        let icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : 
                   (type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-info-circle"></i>');
        messageDiv.innerHTML = `${icon} ${message}`;
        messageContainer.innerHTML = '';
        messageContainer.appendChild(messageDiv);
        
        setTimeout(() => {
            if (messageDiv.parentNode === messageContainer) {
                messageDiv.style.opacity = '0';
                setTimeout(() => {
                    if (messageDiv.parentNode === messageContainer) messageContainer.innerHTML = '';
                }, 300);
            }
        }, 5000);
    }
    
    function clearErrors() {
        document.getElementById('emailError').textContent = '';
        document.getElementById('passwordError').textContent = '';
        adminEmail.classList.remove('error');
        adminPassword.classList.remove('error');
    }
    
    function showFieldError(field, message) {
        const errorSpan = document.getElementById(`${field}Error`);
        const inputMap = { email: adminEmail, password: adminPassword };
        if (errorSpan) errorSpan.textContent = message;
        if (inputMap[field]) inputMap[field].classList.add('error');
    }
    
    function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || email.trim() === '') {
            return { valid: false, message: 'Email address is required' };
        }
        if (!emailRegex.test(email)) {
            return { valid: false, message: 'Please enter a valid email address' };
        }
        return { valid: true, message: '' };
    }
    
    function validatePassword(password) {
        if (!password || password.trim() === '') {
            return { valid: false, message: 'Password is required' };
        }
        return { valid: true, message: '' };
    }
    
    // Create session after successful login
    function createSession(user, adminData) {
        const sessionData = {
            adminId: user.uid,
            name: adminData.name,
            email: adminData.email,
            role: adminData.role || 'admin',
            loginTime: new Date().toISOString()
        };
        
        localStorage.setItem('adminSession', JSON.stringify(sessionData));
        sessionStorage.setItem('adminLoggedIn', 'true');
        
        return sessionData;
    }
    
    // Check if already logged in
    function checkExistingSession() {
        const session = localStorage.getItem('adminSession');
        if (session) {
            try {
                const sessionData = JSON.parse(session);
                const loginTime = new Date(sessionData.loginTime);
                const now = new Date();
                const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
                
                if (hoursDiff < 24) {
                    window.location.href = 'index.html';
                    return true;
                } else {
                    localStorage.removeItem('adminSession');
                    sessionStorage.removeItem('adminLoggedIn');
                }
            } catch (e) {
                localStorage.removeItem('adminSession');
            }
        }
        return false;
    }
    
    async function loginAdmin(event) {
        event.preventDefault();
        clearErrors();
        
        const email = adminEmail.value;
        const password = adminPassword.value;
        
        const emailValidation = validateEmail(email);
        const passwordValidation = validatePassword(password);
        
        let isValid = true;
        
        if (!emailValidation.valid) {
            showFieldError('email', emailValidation.message);
            isValid = false;
        }
        
        if (!passwordValidation.valid) {
            showFieldError('password', passwordValidation.message);
            isValid = false;
        }
        
        if (!isValid) return;
        
        loginBtn.disabled = true;
        const originalBtnText = loginBtn.innerHTML;
        loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';
        
        try {
            // Sign in with Firebase Auth
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            // Get admin data from Firestore
            const adminDoc = await getDoc(doc(db, "admins", user.uid));
            
            if (!adminDoc.exists()) {
                await signOut(auth);
                showMessage('❌ Admin account not found. Please contact support.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalBtnText;
                return;
            }
            
            const adminData = adminDoc.data();
            
            // Create session
            createSession(user, adminData);
            
            showMessage('✅ Login successful! Redirecting to dashboard...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
            
        } catch (error) {
            console.error("Login error:", error);
            
            let errorMessage = 'Login failed';
            if (error.code === 'auth/user-not-found') {
                errorMessage = 'No account found with this email';
            } else if (error.code === 'auth/wrong-password') {
                errorMessage = 'Incorrect password';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = 'Invalid email format';
            } else if (error.code === 'auth/too-many-requests') {
                errorMessage = 'Too many failed attempts. Try again later';
            } else if (error.code === 'auth/network-request-failed') {
                errorMessage = 'Network error. Check your internet connection.';
            }
            
            showMessage('❌ ' + errorMessage, 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = originalBtnText;
        }
    }
    
    // Add enter key support
    adminPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            loginAdmin(e);
        }
    });
    
    adminEmail.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            loginAdmin(e);
        }
    });
    
    // Real-time validation
    adminEmail.addEventListener('input', () => {
        const validation = validateEmail(adminEmail.value);
        if (!validation.valid) {
            showFieldError('email', validation.message);
        } else {
            document.getElementById('emailError').textContent = '';
            adminEmail.classList.remove('error');
        }
    });
    
    adminPassword.addEventListener('input', () => {
        if (adminPassword.value === '') {
            showFieldError('password', 'Password is required');
        } else {
            document.getElementById('passwordError').textContent = '';
            adminPassword.classList.remove('error');
        }
    });
    
    loginForm.addEventListener('submit', loginAdmin);
    
    // Check for existing session on page load
    checkExistingSession();
</script>
</body>
</html>
