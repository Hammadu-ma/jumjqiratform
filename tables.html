<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Advanced Student Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: var(--primary-light);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--primary); color: white; }

        .main-container { max-width: 1600px; margin: 0 auto; padding: 24px; }

        /* Student Category Tabs */
        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 60px;
            border: 1px solid var(--border);
        }
        .category-tab {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-tab:hover { background: var(--primary-light); color: var(--primary-dark); }
        .category-tab.active { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .category-count { background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 30px; font-size: 0.7rem; }
        .category-tab.active .category-count { background: rgba(255,255,255,0.2); }

        /* Student Table */
        .student-table-container {
            background: var(--card-bg);
            border-radius: 24px;
            overflow-x: auto;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 800px;
        }
        .student-table th, .student-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .student-table th {
            background: #f8fafc;
            font-weight: 700;
            color: var(--text-primary);
            position: sticky;
            top: 0;
        }
        .student-table tr:hover { background: #f8fafc; }
        .badge {
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }
        .badge-qirat { background: #d1fae5; color: #065f46; margin: 2px; display: inline-block; }
        .badge-no-qirat { background: #fee2e2; color: #991b1b; }
        .badge-single-qirat { background: #fef3c7; color: #92400e; }
        .action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-btn {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            font-size: 0.7rem;
        }
        .action-btn.edit-qirat:hover { background: #d1fae5; color: var(--primary); }
        .action-btn.delete-qirat-student:hover { background: #fee2e2; color: var(--danger); }
        .action-btn.delete-student:hover { background: #fee2e2; color: var(--danger); }

        /* Edit Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 28px;
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 1.3rem; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; }
        .qirat-list { background: #f8fafc; padding: 12px; border-radius: 16px; margin: 12px 0; }
        .qirat-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 30px;
            margin: 4px;
        }
        .remove-qirat-tag { cursor: pointer; color: var(--danger); font-size: 0.7rem; }
        .add-qirat-input { display: flex; gap: 8px; margin-top: 8px; }
        .add-qirat-input input { flex: 1; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; }

        /* Filters */
        .filters-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            border: 1px solid var(--border);
        }
        .filter-group { flex: 1; min-width: 140px; }
        .filter-group label { font-size: 0.7rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 6px; }
        .filter-group input, .filter-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; }
        .btn-clear { background: #64748b; color: white; border: none; padding: 10px 24px; border-radius: 16px; font-weight: 600; cursor: pointer; }
        .btn-export { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 16px; font-weight: 600; cursor: pointer; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

        @media (max-width: 768px) {
            .main-container { padding: 16px; }
            .category-tabs { border-radius: 20px; }
            .category-tab { padding: 8px 16px; font-size: 0.8rem; }
            .filters-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-users-gear"></i> Student Manager</h1></div>
        <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to Home</button>
    </div>
</div>

<div class="main-container">
    <!-- Category Tabs -->
    <div class="category-tabs" id="categoryTabs">
        <button class="category-tab active" data-category="all"><i class="fas fa-users"></i> All Students <span id="countAll" class="category-count">0</span></button>
        <button class="category-tab" data-category="no-qirat"><i class="fas fa-ban"></i> No Qirat <span id="countNoQirat" class="category-count">0</span></button>
        <button class="category-tab" data-category="single-qirat"><i class="fas fa-book"></i> Single Qirat <span id="countSingleQirat" class="category-count">0</span></button>
        <button class="category-tab" data-category="multi-qirat"><i class="fas fa-layer-group"></i> Multi Qirat <span id="countMultiQirat" class="category-count">0</span></button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group"><label><i class="fas fa-search"></i> Search</label><input type="text" id="searchInput" placeholder="Name / Phone"></div>
        <div class="filter-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="filter-group"><label><i class="fas fa-building"></i> Department</label><select id="deptFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-calendar"></i> Batch</label><select id="batchFilter"><option value="">All</option></select></div>
        <button class="btn-clear" id="clearFiltersBtn"><i class="fas fa-eraser"></i> Clear</button>
        <button class="btn-export" id="exportCSVBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
        <button class="btn-export" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Export Excel</button>
    </div>

    <!-- Student Table -->
    <div class="student-table-container">
        <table class="student-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Batch</th>
                    <th>Qirats</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr><td colspan="8" class="empty-state">Loading students...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Student Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-user-edit"></i> Edit Student</h3>
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
        </div>
        <div id="editFormContent"></div>
    </div>
</div>

<!-- Edit Qirat (Global) Modal -->
<div id="editQiratGlobalModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-edit"></i> Edit Qirat Name (Global)</h3>
            <button class="close-modal" onclick="closeEditQiratGlobalModal()">&times;</button>
        </div>
        <div id="editQiratGlobalForm"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout, getCurrentAdminSync } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting to login');
    const admin = initAuthUI();
    setupAutoLogout(60);
    initNavigation();
    if (admin?.role === 'super-admin') refreshNavigation();
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allStudents = [];
    let filteredStudents = [];
    let currentCategory = 'all';
    
    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const genderFilter = document.getElementById('genderFilter');
    const deptFilter = document.getElementById('deptFilter');
    const batchFilter = document.getElementById('batchFilter');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const exportCSVBtn = document.getElementById('exportCSVBtn');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const studentTableBody = document.getElementById('studentTableBody');
    const toast = document.getElementById('toast');
    
    let currentEditStudentId = null;
    let currentEditQiratGlobalName = null;
    
    function showToast(msg, isErr = false) { 
        toast.textContent = msg; 
        toast.style.background = isErr ? '#ef4444' : '#10b981'; 
        toast.style.display = 'block'; 
        setTimeout(() => toast.style.display = 'none', 3000); 
    }
    
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
    
    function getStudentCategory(student) {
        const qirats = getQiratNames(student);
        if (qirats.length === 0) return 'no-qirat';
        if (qirats.length === 1) return 'single-qirat';
        return 'multi-qirat';
    }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allStudents = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp?.toDate?.() || new Date(data.timestamp) || new Date();
                allStudents.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || '',
                    telegram: data.telegram || '',
                    department: data.department || 'Other',
                    batch: data.batch || 'General',
                    schedules: data.schedules || [],
                    timestamp: timestamp
                });
            });
            populateFilters();
            updateCategoryCounts();
            applyFilters();
        } catch (error) { showToast("Error loading: " + error.message, true); }
    }
    
    function updateCategoryCounts() {
        const counts = { all: allStudents.length, 'no-qirat': 0, 'single-qirat': 0, 'multi-qirat': 0 };
        allStudents.forEach(s => { const cat = getStudentCategory(s); if (cat !== 'all') counts[cat]++; });
        document.getElementById('countAll').textContent = counts.all;
        document.getElementById('countNoQirat').textContent = counts['no-qirat'];
        document.getElementById('countSingleQirat').textContent = counts['single-qirat'];
        document.getElementById('countMultiQirat').textContent = counts['multi-qirat'];
    }
    
    function populateFilters() {
        const departments = [...new Set(allStudents.map(s => s.department))];
        const batches = [...new Set(allStudents.map(s => s.batch))];
        deptFilter.innerHTML = '<option value="">All</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        batchFilter.innerHTML = '<option value="">All</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
    }
    
    function applyFilters() {
        const search = searchInput.value.toLowerCase();
        const gender = genderFilter.value;
        const department = deptFilter.value;
        const batch = batchFilter.value;
        
        let filtered = allStudents.filter(s => {
            const matchCategory = currentCategory === 'all' || getStudentCategory(s) === currentCategory;
            const matchSearch = s.full_name.toLowerCase().includes(search) || s.phone.includes(search);
            const matchGender = !gender || s.gender === gender;
            const matchDept = !department || s.department === department;
            const matchBatch = !batch || s.batch === batch;
            return matchCategory && matchSearch && matchGender && matchDept && matchBatch;
        });
        
        filteredStudents = filtered;
        renderTable();
    }
    
    function renderTable() {
        if (filteredStudents.length === 0) {
            studentTableBody.innerHTML = `<tr><td colspan="8" class="empty-state">No students found</td></tr>`;
            return;
        }
        
        studentTableBody.innerHTML = filteredStudents.map((s, idx) => {
            const qirats = getQiratNames(s);
            const qiratBadges = qirats.length === 0 ? '<span class="badge badge-no-qirat">No Qirat</span>' : 
                qirats.map(q => `<span class="badge badge-qirat">${escapeHtml(q)}</span>`).join(' ');
            const catClass = qirats.length === 0 ? 'badge-no-qirat' : (qirats.length === 1 ? 'badge-single-qirat' : 'badge-qirat');
            
            return `
                <tr>
                    <td>${idx + 1}</td>
                    <td><strong>${escapeHtml(s.full_name)}</strong></td>
                    <td><span class="badge ${s.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(s.gender)}</span></td>
                    <td>${escapeHtml(s.phone)}</td>
                    <td>${escapeHtml(s.department)}</td>
                    <td>${escapeHtml(s.batch)}</td>
                    <td>${qiratBadges}</td>
                    <td class="action-buttons">
                        <button class="action-btn edit-qirat" onclick="openEditStudent('${s.id}')" title="Edit Student & Qirats"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete-student" onclick="deleteStudent('${s.id}')" title="Delete Student"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `;
        }).join('');
    }
    
    // Open Edit Student Modal
    window.openEditStudent = async (studentId) => {
        const student = allStudents.find(s => s.id === studentId);
        if (!student) return;
        currentEditStudentId = studentId;
        const qirats = getQiratNames(student);
        
        const modal = document.getElementById('editModal');
        const formContent = document.getElementById('editFormContent');
        
        formContent.innerHTML = `
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName" value="${escapeHtml(student.full_name)}">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="editGender">
                    <option value="Male" ${student.gender === 'Male' ? 'selected' : ''}>Male</option>
                    <option value="Female" ${student.gender === 'Female' ? 'selected' : ''}>Female</option>
                    <option value="Not Specified" ${student.gender === 'Not Specified' ? 'selected' : ''}>Not Specified</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="editPhone" value="${escapeHtml(student.phone)}">
            </div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" id="editDepartment" value="${escapeHtml(student.department)}">
            </div>
            <div class="form-group">
                <label>Batch</label>
                <input type="text" id="editBatch" value="${escapeHtml(student.batch)}">
            </div>
            <div class="form-group">
                <label>Qirats (Click ✖ to remove)</label>
                <div class="qirat-list" id="editQiratList">
                    ${qirats.length === 0 ? '<span style="color:#941;">No Qirats assigned</span>' : 
                      qirats.map(q => `<span class="qirat-tag">${escapeHtml(q)} <span class="remove-qirat-tag" onclick="removeQiratFromEdit('${escapeHtml(q)}')">✖</span></span>`).join('')}
                </div>
                <div class="add-qirat-input">
                    <input type="text" id="newQiratName" placeholder="Enter Qirat name">
                    <button class="btn-primary" onclick="addQiratToEdit()" style="padding:8px 16px;">Add</button>
                </div>
                <div style="margin-top: 8px;">
                    <button class="btn-secondary" onclick="showGlobalQiratSelector()" style="width:100%;">+ Add from Existing Qirats</button>
                </div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn-primary" onclick="saveStudentEdit()">Save Changes</button>
                <button class="btn-danger" onclick="deleteStudentOnlyQirats()">Delete All Qirats Only</button>
                <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            </div>
        `;
        modal.classList.add('active');
    };
    
    window.removeQiratFromEdit = (qiratName) => {
        const student = allStudents.find(s => s.id === currentEditStudentId);
        if (!student) return;
        const newSchedules = (student.schedules || []).filter(s => s.qirat_name !== qiratName);
        updateDoc(doc(db, "registrations", currentEditStudentId), { schedules: newSchedules })
            .then(() => { loadData(); showToast(`Removed "${qiratName}"`); closeEditModal(); })
            .catch(err => showToast(err.message, true));
    };
    
    window.addQiratToEdit = () => {
        const newQirat = document.getElementById('newQiratName').value.trim();
        if (!newQirat) return showToast("Enter Qirat name", true);
        const student = allStudents.find(s => s.id === currentEditStudentId);
        if (!student) return;
        const currentQirats = getQiratNames(student);
        if (currentQirats.includes(newQirat)) return showToast("Qirat already exists", true);
        const newSchedules = [...(student.schedules || []), { qirat_name: newQirat, enrolled_date: new Date().toISOString() }];
        updateDoc(doc(db, "registrations", currentEditStudentId), { schedules: newSchedules })
            .then(() => { loadData(); showToast(`Added "${newQirat}"`); closeEditModal(); })
            .catch(err => showToast(err.message, true));
    };
    
    window.showGlobalQiratSelector = () => {
        const allQirats = [...new Set(allStudents.flatMap(s => getQiratNames(s)))];
        if (allQirats.length === 0) return showToast("No existing Qirats found", true);
        const selector = prompt(`Select Qirat to add:\n${allQirats.join('\n')}\n\nType the exact name:`);
        if (selector && allQirats.includes(selector)) {
            document.getElementById('newQiratName').value = selector;
        } else if (selector) { showToast("Qirat not found", true); }
    };
    
    window.saveStudentEdit = async () => {
        const newName = document.getElementById('editName').value;
        const newGender = document.getElementById('editGender').value;
        const newPhone = document.getElementById('editPhone').value;
        const newDept = document.getElementById('editDepartment').value;
        const newBatch = document.getElementById('editBatch').value;
        
        await updateDoc(doc(db, "registrations", currentEditStudentId), {
            full_name: newName, gender: newGender, phone: newPhone, department: newDept, batch: newBatch
        });
        showToast("Student updated");
        loadData();
        closeEditModal();
    };
    
    window.deleteStudentOnlyQirats = async () => {
        if (confirm("Delete ALL Qirats from this student only?")) {
            await updateDoc(doc(db, "registrations", currentEditStudentId), { schedules: [] });
            showToast("All Qirats removed from student");
            loadData();
            closeEditModal();
        }
    };
    
    window.deleteStudent = async (studentId) => {
        if (confirm("Delete this student permanently?")) {
            await deleteDoc(doc(db, "registrations", studentId));
            showToast("Student deleted");
            loadData();
        }
    };
    
    window.closeEditModal = () => {
        document.getElementById('editModal').classList.remove('active');
        currentEditStudentId = null;
    };
    
    // Global Qirat Edit Feature
    window.openEditQiratGlobal = (qiratName) => {
        currentEditQiratGlobalName = qiratName;
        const modal = document.getElementById('editQiratGlobalModal');
        const form = document.getElementById('editQiratGlobalForm');
        form.innerHTML = `
            <div class="form-group">
                <label>Current Qirat Name: <strong>${escapeHtml(qiratName)}</strong></label>
                <label>New Qirat Name</label>
                <input type="text" id="newGlobalQiratName" class="form-control" placeholder="Enter new name">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn-primary" onclick="saveGlobalQiratEdit()">Update for All Students</button>
                <button class="btn-danger" onclick="deleteGlobalQirat()">Delete This Qirat from ALL Students</button>
                <button class="btn-secondary" onclick="closeEditQiratGlobalModal()">Cancel</button>
            </div>
            <div style="margin-top: 16px; padding: 12px; background: #fef3c7; border-radius: 16px; font-size: 0.8rem;">
                <i class="fas fa-info-circle"></i> This will update the Qirat name for EVERY student who has it.
            </div>
        `;
        modal.classList.add('active');
    };
    
    window.saveGlobalQiratEdit = async () => {
        const newName = document.getElementById('newGlobalQiratName').value.trim();
        if (!newName) return showToast("Enter new Qirat name", true);
        if (newName === currentEditQiratGlobalName) return closeEditQiratGlobalModal();
        
        let updatedCount = 0;
        for (const student of allStudents) {
            const hasQirat = (student.schedules || []).some(s => s.qirat_name === currentEditQiratGlobalName);
            if (hasQirat) {
                const newSchedules = (student.schedules || []).map(s => 
                    s.qirat_name === currentEditQiratGlobalName ? { ...s, qirat_name: newName } : s
                );
                await updateDoc(doc(db, "registrations", student.id), { schedules: newSchedules });
                updatedCount++;
            }
        }
        showToast(`✅ Renamed "${currentEditQiratGlobalName}" → "${newName}" for ${updatedCount} students`);
        loadData();
        closeEditQiratGlobalModal();
    };
    
    window.deleteGlobalQirat = async () => {
        if (confirm(`⚠️ Remove "${currentEditQiratGlobalName}" from ALL students? This cannot be undone!`)) {
            let updatedCount = 0;
            for (const student of allStudents) {
                const hasQirat = (student.schedules || []).some(s => s.qirat_name === currentEditQiratGlobalName);
                if (hasQirat) {
                    const newSchedules = (student.schedules || []).filter(s => s.qirat_name !== currentEditQiratGlobalName);
                    await updateDoc(doc(db, "registrations", student.id), { schedules: newSchedules });
                    updatedCount++;
                }
            }
            showToast(`✅ Removed "${currentEditQiratGlobalName}" from ${updatedCount} students`);
            loadData();
            closeEditQiratGlobalModal();
        }
    };
    
    window.closeEditQiratGlobalModal = () => {
        document.getElementById('editQiratGlobalModal').classList.remove('active');
        currentEditQiratGlobalName = null;
    };
    
    // Add inline edit option in table for Qirats
    function addQiratActionButtons() {
        // Add global edit buttons next to each qirat badge in the table
        const qiratSpans = document.querySelectorAll('.badge-qirat');
        qiratSpans.forEach(span => {
            const qiratName = span.textContent;
            if (!span.parentElement.querySelector('.edit-qirat-global')) {
                const editBtn = document.createElement('span');
                editBtn.innerHTML = `<i class="fas fa-pen" style="cursor:pointer; margin-left:4px; font-size:0.6rem; color:#10b981;" onclick="openEditQiratGlobal('${escapeHtml(qiratName)}')" title="Edit Qirat globally"></i>`;
                span.appendChild(editBtn);
            }
        });
    }
    
    // Export functions
    function exportToCSV() {
        const data = filteredStudents.map(s => ({
            Name: s.full_name, Gender: s.gender, Phone: s.phone, Department: s.department,
            Batch: s.batch, Qirats: getQiratNames(s).join(', '), RegistrationDate: s.timestamp.toLocaleDateString()
        }));
        if (!data.length) return alert('No data to export');
        const headers = ['Name', 'Gender', 'Phone', 'Department', 'Batch', 'Qirats', 'RegistrationDate'];
        const rows = data.map(r => headers.map(h => `"${String(r[h] || '').replace(/"/g, '""')}"`).join(','));
        const blob = new Blob(["\uFEFF" + [headers.join(','), ...rows].join('\n')], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `students_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
        showToast('CSV exported');
    }
    
    function exportToExcel() {
        const data = filteredStudents.map(s => ({
            Name: s.full_name, Gender: s.gender, Phone: s.phone, Department: s.department,
            Batch: s.batch, Qirats: getQiratNames(s).join(', '), RegistrationDate: s.timestamp.toLocaleDateString()
        }));
        if (!data.length) return alert('No data to export');
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Students');
        XLSX.writeFile(wb, `students_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast('Excel exported');
    }
    
    // Event Listeners
    searchInput.addEventListener('input', applyFilters);
    genderFilter.addEventListener('change', applyFilters);
    deptFilter.addEventListener('change', applyFilters);
    batchFilter.addEventListener('change', applyFilters);
    clearFiltersBtn.addEventListener('click', () => {
        searchInput.value = ''; genderFilter.value = ''; deptFilter.value = ''; batchFilter.value = '';
        applyFilters();
    });
    exportCSVBtn.addEventListener('click', exportToCSV);
    exportExcelBtn.addEventListener('click', exportToExcel);
    
    document.querySelectorAll('.category-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentCategory = tab.dataset.category;
            applyFilters();
        });
    });
    
    // Close modals when clicking outside
    window.onclick = (e) => {
        if (e.target === document.getElementById('editModal')) closeEditModal();
        if (e.target === document.getElementById('editQiratGlobalModal')) closeEditQiratGlobalModal();
    };
    
    loadData();
</script>
</body>
</html>
