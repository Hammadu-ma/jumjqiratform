<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Groups View - Advanced Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .filters-bar {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .filter-group {
            flex: 1;
            min-width: 140px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.85rem;
            background: white;
            transition: all 0.2s;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .btn-clear {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover { background: #475569; transform: translateY(-1px); }

        .group-mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .group-mode-btn {
            padding: 12px 28px;
            border: none;
            background: var(--card-bg);
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .group-mode-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .export-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border);
        }

        .export-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .export-all-excel { background: #6366f1; color: white; }
        .export-all-word { background: #2b5797; color: white; }
        .export-all-pdf { background: #d32f2f; color: white; }
        .export-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }

        .groups-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .group-header {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            padding: 20px 28px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .group-title {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .group-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .group-count {
            background: var(--primary-light);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .group-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255,255,240,0.5);
            padding: 6px 16px;
            border-radius: 48px;
            align-items: center;
        }
        .stat-item {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 4px 12px;
            border-radius: 32px;
            box-shadow: var(--shadow-sm);
        }
        .stat-item i { color: var(--primary); font-size: 0.75rem; }

        .group-export-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-export-item, .edit-student-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .edit-student-btn { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        .edit-student-btn:hover { background: #f59e0b; color: white; border-color: #f59e0b; }
        .group-export-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .toggle-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .group-content {
            display: none;
            background: white;
        }

        .group-content.show {
            display: block;
        }

        .group-table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .student-table th, .student-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .student-table th {
            background: #f8fafc;
            font-weight: 700;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-container {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
        }
        .modal-header h3 { font-size: 1.3rem; color: var(--primary-dark); }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; }
        .qirat-list { background: #f8fafc; padding: 12px; border-radius: 20px; margin: 12px 0; }
        .qirat-tag { display: inline-block; background: var(--primary-light); padding: 4px 12px; border-radius: 20px; margin: 4px; font-size: 0.8rem; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-save:hover { background: var(--primary-dark); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .main-container { padding: 16px; padding-bottom: 80px; }
            .group-header { flex-direction: column; align-items: flex-start; }
            .group-export-buttons { width: 100%; justify-content: flex-start; }
            .filters-bar { flex-direction: column; }
            .filter-group { width: 100%; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-layer-group"></i> Groups View + Editor</h1></div>
    </div>
</div>

<div class="main-container">
    <div class="filters-bar">
        <div class="filter-group"><label><i class="fas fa-search"></i> Search</label><input type="text" id="searchInput" placeholder="Name, Phone, or Telegram..."></div>
        <div class="filter-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="filter-group"><label><i class="fas fa-building"></i> Department</label><select id="deptFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-calendar"></i> Batch</label><select id="batchFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-book-quran"></i> Qirat</label><select id="qiratFilter"><option value="">All Qirats</option></select></div>
        <button class="btn-clear" id="clearFiltersBtn"><i class="fas fa-eraser"></i> Clear</button>
    </div>

    <div class="group-mode-selector">
        <button class="group-mode-btn active" data-mode="qirat"><i class="fas fa-book-quran"></i> By Qirat</button>
        <button class="group-mode-btn" data-mode="department"><i class="fas fa-building"></i> By Department</button>
        <button class="group-mode-btn" data-mode="batch"><i class="fas fa-graduation-cap"></i> By Batch</button>
        <button class="group-mode-btn" data-mode="gender"><i class="fas fa-venus-mars"></i> By Gender</button>
    </div>

    <div class="export-bar">
        <div class="export-buttons">
            <button class="export-btn export-all-excel" id="exportAllExcelBtn"><i class="fas fa-file-excel"></i> All Groups (Excel)</button>
            <button class="export-btn export-all-word" id="exportAllWordBtn"><i class="fas fa-file-word"></i> All Groups (Word)</button>
            <button class="export-btn export-all-pdf" id="exportAllPdfBtn"><i class="fas fa-file-pdf"></i> All Groups (PDF)</button>
        </div>
        <div class="result-count" id="resultCount">0 students</div>
    </div>

    <div class="groups-container" id="groupsContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading groups...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<!-- Edit Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fas fa-user-edit"></i> Edit Student</h3>
            <button class="close-modal" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
        </div>
        <form id="editForm">
            <input type="hidden" id="editStudentId">
            <div class="form-group"><label>Full Name</label><input type="text" id="editName" required></div>
            <div class="form-group"><label>Gender</label><select id="editGender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
            <div class="form-group"><label>Phone</label><input type="text" id="editPhone"></div>
            <div class="form-group"><label>Telegram</label><input type="text" id="editTelegram"></div>
            <div class="form-group"><label>Department</label><input type="text" id="editDepartment"></div>
            <div class="form-group"><label>Batch</label><input type="text" id="editBatch"></div>
            <div class="form-group"><label>Qirats (comma separated, e.g., Hafs, Warsh)</label><input type="text" id="editQirats" placeholder="Hafs, Warsh, Qalun..."></div>
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Changes</button>
        </form>
    </div>
</div>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting');
    const admin = initAuthUI();
    setupAutoLogout(60);
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allRegistrations = [];
    let filteredRegistrations = [];
    let currentGroupMode = 'qirat';
    let currentGroups = [];
    let allUniqueQirats = [];
    
    const searchInput = document.getElementById('searchInput');
    const genderFilter = document.getElementById('genderFilter');
    const deptFilter = document.getElementById('deptFilter');
    const batchFilter = document.getElementById('batchFilter');
    const qiratFilter = document.getElementById('qiratFilter');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const groupsContainer = document.getElementById('groupsContainer');
    const resultCountSpan = document.getElementById('resultCount');
    const exportAllExcelBtn = document.getElementById('exportAllExcelBtn');
    const exportAllWordBtn = document.getElementById('exportAllWordBtn');
    const exportAllPdfBtn = document.getElementById('exportAllPdfBtn');
    const toast = document.getElementById('toast');
    
    function showToast(message, isError = false) {
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function getQiratNames(student) {
        return (student.schedules || []).map(s => s.qirat_name).filter(Boolean);
    }
    
    function formatStudentForExport(student, index) {
        return {
            'No.': index,
            'Name': student.full_name,
            'Gender': student.gender,
            'Phone': student.phone,
            'Telegram': student.telegram,
            'Department': student.department,
            'Batch': student.batch,
            'Qirats Enrolled': getQiratNames(student).join(', ') || '-'
        };
    }
    
    function computeGroupStats(members) {
        const maleCount = members.filter(m => m.gender === 'Male').length;
        const femaleCount = members.filter(m => m.gender === 'Female').length;
        const uniqueDepts = new Set(members.map(m => m.department)).size;
        const multiQiratCount = members.filter(m => getQiratNames(m).length > 1).length;
        const recentWeek = members.filter(m => {
            const regDate = m.timestamp instanceof Date ? m.timestamp : new Date(m.timestamp);
            return (new Date() - regDate) / (1000 * 3600 * 24) <= 30;
        }).length;
        return { maleCount, femaleCount, uniqueDepts, multiQiratCount, recentWeek };
    }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allRegistrations = [];
            const qiratSet = new Set();
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp;
                if (timestamp && typeof timestamp.toDate === 'function') timestamp = timestamp.toDate();
                else timestamp = new Date();
                const schedules = data.schedules || [];
                const student = {
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || 'N/A',
                    telegram: data.telegram || 'N/A',
                    department: data.department || 'N/A',
                    batch: data.batch || 'N/A',
                    schedules: schedules,
                    timestamp: timestamp
                };
                allRegistrations.push(student);
                schedules.forEach(s => { if(s.qirat_name) qiratSet.add(s.qirat_name); });
            });
            allUniqueQirats = Array.from(qiratSet).sort();
            populateFilters();
            applyFilters();
        } catch (error) {
            groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</div>`;
        }
    }
    
    function populateFilters() {
        const departments = [...new Set(allRegistrations.map(r => r.department))];
        const batches = [...new Set(allRegistrations.map(r => r.batch))];
        deptFilter.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        batchFilter.innerHTML = '<option value="">All Batches</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
        qiratFilter.innerHTML = '<option value="">All Qirats</option>' + allUniqueQirats.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');
    }
    
    function applyFilters() {
        const search = searchInput.value.toLowerCase().trim();
        const gender = genderFilter.value;
        const department = deptFilter.value;
        const batch = batchFilter.value;
        const selectedQirat = qiratFilter.value;
        
        filteredRegistrations = allRegistrations.filter(r => {
            const matchSearch = r.full_name.toLowerCase().includes(search) || 
                               r.phone.toLowerCase().includes(search) || 
                               r.telegram.toLowerCase().includes(search);
            const matchGender = !gender || r.gender === gender;
            const matchDept = !department || r.department === department;
            const matchBatch = !batch || r.batch === batch;
            const matchQirat = !selectedQirat || getQiratNames(r).includes(selectedQirat);
            return matchSearch && matchGender && matchDept && matchBatch && matchQirat;
        });
        
        resultCountSpan.textContent = `${filteredRegistrations.length} students`;
        buildGroups();
    }
    
    function buildGroups() {
        const groups = new Map();
        if (currentGroupMode === 'qirat') {
            filteredRegistrations.forEach(student => {
                getQiratNames(student).forEach(qirat => {
                    if (!groups.has(qirat)) groups.set(qirat, []);
                    groups.get(qirat).push(student);
                });
            });
        } else if (currentGroupMode === 'department') {
            filteredRegistrations.forEach(student => {
                const key = student.department;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else if (currentGroupMode === 'batch') {
            filteredRegistrations.forEach(student => {
                const key = student.batch;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else {
            filteredRegistrations.forEach(student => {
                const key = student.gender;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        }
        currentGroups = Array.from(groups.entries())
            .map(([name, members]) => ({ name, members, memberCount: members.length, stats: computeGroupStats(members) }))
            .sort((a, b) => b.memberCount - a.memberCount);
        renderGroups();
    }
    
    function renderGroups() {
        if (currentGroups.length === 0) {
            groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i> No groups found</div>`;
            return;
        }
        
        groupsContainer.innerHTML = currentGroups.map((group, idx) => {
            const s = group.stats;
            return `
            <div class="group-card" data-group-idx="${idx}">
                <div class="group-header" onclick="window.toggleGroup(${idx})">
                    <div class="group-title">
                        <i class="fas ${getGroupIcon()}"></i>
                        <span class="group-name">${escapeHtml(group.name)}</span>
                        <span class="group-count">${group.memberCount} student${group.memberCount !== 1 ? 's' : ''}</span>
                        <div class="group-stats">
                            <span class="stat-item"><i class="fas fa-venus-mars"></i> M:${s.maleCount} / F:${s.femaleCount}</span>
                            <span class="stat-item"><i class="fas fa-building"></i> Depts: ${s.uniqueDepts}</span>
                            <span class="stat-item"><i class="fas fa-chalkboard-user"></i> Multi-Q: ${s.multiQiratCount}</span>
                            <span class="stat-item"><i class="fas fa-calendar-week"></i> New: ${s.recentWeek}</span>
                        </div>
                    </div>
                    <div class="group-export-buttons" onclick="event.stopPropagation()">
                        <button class="group-export-item" data-group-idx="${idx}" data-format="csv"><i class="fas fa-file-csv"></i> CSV</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="excel"><i class="fas fa-file-excel"></i> Excel</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="word"><i class="fas fa-file-word"></i> Word</button>
                    </div>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div class="group-content" id="groupContent-${idx}">
                    <div class="group-table-wrapper">
                        <table class="student-table">
                            <thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${group.members.map(m => `
                                    <tr>
                                        <td><strong>${escapeHtml(m.full_name)}</strong></td>
                                        <td><span class="badge ${m.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(m.gender)}</span></td>
                                        <td>${escapeHtml(m.phone)}</td>
                                        <td>${escapeHtml(m.department)}</td>
                                        <td>${escapeHtml(m.batch)}</td>
                                        <td>${escapeHtml(getQiratNames(m).join(', ') || '-')}</td>
                                        <td><button class="edit-student-btn" data-student='${JSON.stringify({id:m.id, name:m.full_name, gender:m.gender, phone:m.phone, telegram:m.telegram, dept:m.department, batch:m.batch, qirats:getQiratNames(m)})}'><i class="fas fa-pen"></i> Edit</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.group-export-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-group-idx'));
                const format = btn.getAttribute('data-format');
                exportSingleGroup(currentGroups[idx], format);
            });
        });
        
        document.querySelectorAll('.edit-student-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const studentData = JSON.parse(btn.getAttribute('data-student'));
                openEditModal(studentData);
            });
        });
    }
    
    function getGroupIcon() {
        const icons = { qirat: 'fa-book-quran', department: 'fa-building', batch: 'fa-graduation-cap', gender: 'fa-venus-mars' };
        return icons[currentGroupMode] || 'fa-folder';
    }
    
    // ========== EDIT MODAL ==========
    window.openEditModal = function(student) {
        document.getElementById('editStudentId').value = student.id;
        document.getElementById('editName').value = student.name;
        document.getElementById('editGender').value = student.gender;
        document.getElementById('editPhone').value = student.phone;
        document.getElementById('editTelegram').value = student.telegram || '';
        document.getElementById('editDepartment').value = student.dept;
        document.getElementById('editBatch').value = student.batch;
        document.getElementById('editQirats').value = (student.qirats || []).join(', ');
        document.getElementById('editModal').classList.add('active');
    };
    
    window.closeEditModal = function() {
        document.getElementById('editModal').classList.remove('active');
    };
    
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editStudentId').value;
        const newName = document.getElementById('editName').value;
        const newGender = document.getElementById('editGender').value;
        const newPhone = document.getElementById('editPhone').value;
        const newTelegram = document.getElementById('editTelegram').value;
        const newDept = document.getElementById('editDepartment').value;
        const newBatch = document.getElementById('editBatch').value;
        const qiratsStr = document.getElementById('editQirats').value;
        const qiratNames = qiratsStr.split(',').map(s => s.trim()).filter(s => s);
        const newSchedules = qiratNames.map(q => ({ qirat_name: q }));
        
        try {
            const studentRef = doc(db, "registrations", id);
            await updateDoc(studentRef, {
                full_name: newName,
                gender: newGender,
                phone: newPhone,
                telegram: newTelegram,
                department: newDept,
                batch: newBatch,
                schedules: newSchedules
            });
            showToast('Student updated successfully!');
            closeEditModal();
            await loadData();
        } catch (error) {
            showToast('Update failed: ' + error.message, true);
        }
    });
    
    // Export functions (simplified but complete)
    function exportSingleGroup(group, format) {
        if (!group || group.members.length === 0) { showToast('No students', true); return; }
        const exportData = group.members.map((m, idx) => formatStudentForExport(m, idx + 1));
        const groupName = group.name.replace(/[^a-z0-9]/gi, '_').slice(0, 30);
        if (format === 'csv') downloadCSV(exportData, groupName);
        else if (format === 'excel') exportExcel(exportData, groupName);
        else if (format === 'pdf') exportPDF(exportData, group.name, group.members.length, group.stats);
        else if (format === 'word') exportWord(exportData, group.name, group.members.length, group.stats);
        showToast(`Exported "${group.name}"`);
    }
    
    function downloadCSV(data, filename) {
        const headers = ['No.', 'Name', 'Gender', 'Phone', 'Telegram', 'Department', 'Batch', 'Qirats Enrolled'];
        const rows = data.map(row => headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`).join(','));
        const blob = new Blob(["\uFEFF" + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv' });
        downloadBlob(blob, `${filename}.csv`);
    }
    function exportExcel(data, sheetName) {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
        XLSX.writeFile(wb, `${sheetName}.xlsx`);
    }
    async function exportPDF(data, groupName, total, stats) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.text(`JUMJ - ${groupName}`, 14, 20);
        doc.text(`Total: ${total} | M:${stats.maleCount} F:${stats.femaleCount}`, 14, 30);
        doc.autoTable({ head: [['No.','Name','Gender','Phone','Dept','Batch','Qirats']], body: data.map(r => [r['No.'], r.Name, r.Gender, r.Phone, r.Department, r.Batch, r['Qirats Enrolled']]), startY: 38, headStyles: { fillColor: [16,185,129] } });
        doc.save(`${groupName.replace(/[^a-z0-9]/gi, '_')}.pdf`);
    }
    function exportWord(data, groupName, total, stats) {
        let html = `<html><body><h2>${groupName} (${total})</h2><table border="1"><thead><tr><th>No.</th><th>Name</th><th>Gender</th><th>Phone</th><th>Dept</th><th>Batch</th><th>Qirats</th></tr></thead><tbody>${data.map(r => `<tr><td>${r['No.']}</td><td>${r.Name}</td><td>${r.Gender}</td><td>${r.Phone}</td><td>${r.Department}</td><td>${r.Batch}</td><td>${r['Qirats Enrolled']}</td></tr>`).join('')}</tbody></table></body></html>`;
        downloadBlob(new Blob([html], { type: 'application/msword' }), `${groupName.replace(/[^a-z0-9]/gi, '_')}.doc`);
    }
    function exportAllGroupsToExcel() {
        const wb = XLSX.utils.book_new();
        currentGroups.forEach(g => { const ws = XLSX.utils.json_to_sheet(g.members.map((m,i)=>formatStudentForExport(m,i+1))); XLSX.utils.book_append_sheet(wb, ws, g.name.slice(0,31)); });
        XLSX.writeFile(wb, `AllGroups_${currentGroupMode}.xlsx`);
        showToast(`Exported ${currentGroups.length} groups`);
    }
    async function exportAllGroupsToPdf() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        let y=20;
        for(let g of currentGroups){
            if(y>180){ doc.addPage(); y=20; }
            doc.text(`${g.name} (${g.memberCount})`,14,y); y+=7;
            const data = g.members.map((m,i)=>[i+1, m.full_name, m.gender, m.phone, m.department, m.batch, getQiratNames(m).join(',')]);
            const res = doc.autoTable({ head:[['#','Name','Gender','Phone','Dept','Batch','Qirats']], body:data, startY:y, headStyles:{fillColor:[16,185,129]}, styles:{fontSize:7} });
            y = res.finalY+10;
        }
        doc.save(`AllGroups_${currentGroupMode}.pdf`);
        showToast('PDF exported');
    }
    function exportAllGroupsToWord() {
        let html = `<html><body><h1>All Groups (${currentGroupMode})</h1>`;
        currentGroups.forEach(g => {
            html += `<h2>${g.name} (${g.memberCount})</h2><table border="1"><thead><tr><th>#</th><th>Name</th><th>Gender</th><th>Phone</th><th>Dept</th><th>Batch</th><th>Qirats</th></tr></thead><tbody>`;
            g.members.forEach((m,i) => { html += `<tr><td>${i+1}</td><td>${m.full_name}</td><td>${m.gender}</td><td>${m.phone}</td><td>${m.department}</td><td>${m.batch}</td><td>${getQiratNames(m).join(',')}</td></tr>`; });
            html += `</tbody></table><br>`;
        });
        html += `</body></html>`;
        downloadBlob(new Blob([html], { type: 'application/msword' }), `AllGroups_${currentGroupMode}.doc`);
        showToast('Word exported');
    }
    function downloadBlob(blob, filename) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href); }
    
    window.toggleGroup = function(idx) {
        const content = document.getElementById(`groupContent-${idx}`);
        const card = document.querySelector(`.group-card[data-group-idx="${idx}"]`);
        const icon = card?.querySelector('.toggle-icon');
        if (content) { content.classList.toggle('show'); if(icon) { icon.classList.toggle('fa-chevron-down'); icon.classList.toggle('fa-chevron-up'); } }
    };
    
    searchInput.addEventListener('input', applyFilters);
    genderFilter.addEventListener('change', applyFilters);
    deptFilter.addEventListener('change', applyFilters);
    batchFilter.addEventListener('change', applyFilters);
    qiratFilter.addEventListener('change', applyFilters);
    clearFiltersBtn.addEventListener('click', () => { searchInput.value = ''; genderFilter.value = ''; deptFilter.value = ''; batchFilter.value = ''; qiratFilter.value = ''; applyFilters(); showToast('Filters cleared'); });
    exportAllExcelBtn.addEventListener('click', exportAllGroupsToExcel);
    exportAllWordBtn.addEventListener('click', exportAllGroupsToWord);
    exportAllPdfBtn.addEventListener('click', exportAllGroupsToPdf);
    
    document.querySelectorAll('.group-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.group-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGroupMode = btn.dataset.mode;
            buildGroups();
        });
    });
    
    initNavigation();
    if (admin?.role === 'super-admin') setTimeout(() => refreshNavigation(), 100);
    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
