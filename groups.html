<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Smart Groups - Refresh-Aware Cache</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-badge {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .manual-refresh {
            background: white;
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .manual-refresh:hover { background: var(--primary-light); border-color: var(--primary); }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .filters-bar {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .filter-group {
            flex: 1;
            min-width: 140px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.85rem;
            background: white;
            transition: all 0.2s;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }

        .btn-clear {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear:hover { background: #475569; transform: translateY(-1px); }

        .group-mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .group-mode-btn {
            padding: 12px 28px;
            border: none;
            background: var(--card-bg);
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .group-mode-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .export-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border);
        }

        .export-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .export-all-excel { background: #6366f1; color: white; }
        .export-all-word { background: #2b5797; color: white; }
        .export-all-pdf { background: #d32f2f; color: white; }
        .export-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }

        .groups-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .group-header {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            padding: 20px 28px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .group-title {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .group-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .group-count {
            background: var(--primary-light);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .group-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255,255,240,0.5);
            padding: 6px 16px;
            border-radius: 48px;
            align-items: center;
        }
        .stat-item {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 4px 12px;
            border-radius: 32px;
            box-shadow: var(--shadow-sm);
        }
        .stat-item i { color: var(--primary); font-size: 0.75rem; }

        .group-export-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-export-item, .edit-student-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .edit-student-btn { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        .edit-student-btn:hover { background: #f59e0b; color: white; border-color: #f59e0b; }
        .group-export-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .toggle-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .group-content {
            display: none;
            background: white;
        }

        .group-content.show {
            display: block;
        }

        .group-table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .student-table th, .student-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .student-table th {
            background: #f8fafc;
            font-weight: 700;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-container {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
        }
        .modal-header h3 { font-size: 1.3rem; color: var(--primary-dark); }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-save:hover { background: var(--primary-dark); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .main-container { padding: 16px; padding-bottom: 80px; }
            .group-header { flex-direction: column; align-items: flex-start; }
            .group-export-buttons { width: 100%; justify-content: flex-start; }
            .filters-bar { flex-direction: column; }
            .filter-group { width: 100%; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-layer-group"></i> Groups View + Editor</h1></div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div class="refresh-badge" id="cacheStatus"><i class="fas fa-database"></i> Loading...</div>
            <button class="manual-refresh" id="forceRefreshBtn"><i class="fas fa-sync-alt"></i> Refresh Cloud</button>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="filters-bar">
        <div class="filter-group"><label><i class="fas fa-search"></i> Search</label><input type="text" id="searchInput" placeholder="Name, Phone, or Telegram..."></div>
        <div class="filter-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="filter-group"><label><i class="fas fa-building"></i> Department</label><select id="deptFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-calendar"></i> Batch</label><select id="batchFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-book-quran"></i> Qirat</label><select id="qiratFilter"><option value="">All Qirats</option></select></div>
        <button class="btn-clear" id="clearFiltersBtn"><i class="fas fa-eraser"></i> Clear</button>
    </div>

    <div class="group-mode-selector">
        <button class="group-mode-btn active" data-mode="qirat"><i class="fas fa-book-quran"></i> By Qirat</button>
        <button class="group-mode-btn" data-mode="department"><i class="fas fa-building"></i> By Department</button>
        <button class="group-mode-btn" data-mode="batch"><i class="fas fa-graduation-cap"></i> By Batch</button>
        <button class="group-mode-btn" data-mode="gender"><i class="fas fa-venus-mars"></i> By Gender</button>
    </div>

    <div class="export-bar">
        <div class="export-buttons">
            <button class="export-btn export-all-excel" id="exportAllExcelBtn"><i class="fas fa-file-excel"></i> All Groups (Excel)</button>
            <button class="export-btn export-all-word" id="exportAllWordBtn"><i class="fas fa-file-word"></i> All Groups (Word)</button>
            <button class="export-btn export-all-pdf" id="exportAllPdfBtn"><i class="fas fa-file-pdf"></i> All Groups (PDF)</button>
        </div>
        <div class="result-count" id="resultCount">0 students</div>
    </div>

    <div class="groups-container" id="groupsContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading groups...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<div id="editModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3><i class="fas fa-user-edit"></i> Edit Student</h3>
            <button class="close-modal" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
        </div>
        <form id="editForm">
            <input type="hidden" id="editStudentId">
            <div class="form-group"><label>Full Name</label><input type="text" id="editName" required></div>
            <div class="form-group"><label>Gender</label><select id="editGender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
            <div class="form-group"><label>Phone</label><input type="text" id="editPhone"></div>
            <div class="form-group"><label>Telegram</label><input type="text" id="editTelegram"></div>
            <div class="form-group"><label>Department</label><input type="text" id="editDepartment"></div>
            <div class="form-group"><label>Batch</label><input type="text" id="editBatch"></div>
            <div class="form-group"><label>Qirats (comma separated)</label><input type="text" id="editQirats" placeholder="Hafs, Warsh, Qalun..."></div>
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Changes</button>
        </form>
    </div>
</div>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting');
    const admin = initAuthUI();
    setupAutoLogout(60);
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // ========== DETECT PAGE REFRESH ==========
    let isPageRefresh = false;
    
    // Method 1: Check navigation type
    if (performance.navigation && performance.navigation.type === 1) {
        isPageRefresh = true;
    }
    
    // Method 2: Using pageshow event for modern browsers
    window.addEventListener('pageshow', (event) => {
        if (event.persisted || performance.getEntriesByType('navigation')[0]?.type === 'reload') {
            isPageRefresh = true;
            console.log('Page refresh detected - will fetch fresh data');
            // Force fresh load on refresh
            sessionStorage.setItem('page_refreshed', 'true');
        }
    });
    
    // Check session storage for refresh flag
    if (sessionStorage.getItem('page_refreshed') === 'true') {
        isPageRefresh = true;
        sessionStorage.removeItem('page_refreshed');
    }
    
    let allRegistrations = [];
    let filteredRegistrations = [];
    let currentGroupMode = 'qirat';
    let currentGroups = [];
    let allUniqueQirats = [];
    let dataLoaded = false;
    let isLoading = false;
    
    // Sticky filter state
    let stickyFilters = {
        search: '',
        gender: '',
        department: '',
        batch: '',
        qirat: ''
    };
    
    const searchInput = document.getElementById('searchInput');
    const genderFilter = document.getElementById('genderFilter');
    const deptFilter = document.getElementById('deptFilter');
    const batchFilter = document.getElementById('batchFilter');
    const qiratFilter = document.getElementById('qiratFilter');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const groupsContainer = document.getElementById('groupsContainer');
    const resultCountSpan = document.getElementById('resultCount');
    const exportAllExcelBtn = document.getElementById('exportAllExcelBtn');
    const exportAllWordBtn = document.getElementById('exportAllWordBtn');
    const exportAllPdfBtn = document.getElementById('exportAllPdfBtn');
    const toast = document.getElementById('toast');
    const forceRefreshBtn = document.getElementById('forceRefreshBtn');
    const cacheStatusSpan = document.getElementById('cacheStatus');
    
    function showToast(message, isError = false) {
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
    
    function saveStickyFilters() {
        const filtersToStore = {
            search: searchInput.value,
            gender: genderFilter.value,
            department: deptFilter.value,
            batch: batchFilter.value,
            qirat: qiratFilter.value
        };
        localStorage.setItem('groups_sticky_filters', JSON.stringify(filtersToStore));
    }
    
    function loadStickyFilters() {
        const saved = localStorage.getItem('groups_sticky_filters');
        if (saved) {
            try {
                const filters = JSON.parse(saved);
                stickyFilters = filters;
                searchInput.value = filters.search || '';
                genderFilter.value = filters.gender || '';
                deptFilter.value = filters.department || '';
                batchFilter.value = filters.batch || '';
                qiratFilter.value = filters.qirat || '';
            } catch(e) {}
        }
    }
    
    function saveGroupMode() {
        localStorage.setItem('groups_mode_pref', currentGroupMode);
    }
    
    function loadGroupMode() {
        const saved = localStorage.getItem('groups_mode_pref');
        if (saved && ['qirat', 'department', 'batch', 'gender'].includes(saved)) {
            currentGroupMode = saved;
            document.querySelectorAll('.group-mode-btn').forEach(btn => {
                if (btn.dataset.mode === saved) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
    }
    
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
    
    function formatStudentForExport(student, index) {
        return {
            'No.': index,
            'Name': student.full_name,
            'Gender': student.gender,
            'Phone': student.phone,
            'Telegram': student.telegram,
            'Department': student.department,
            'Batch': student.batch,
            'Qirats Enrolled': getQiratNames(student).join(', ') || '-'
        };
    }
    
    function computeGroupStats(members) {
        const maleCount = members.filter(m => m.gender === 'Male').length;
        const femaleCount = members.filter(m => m.gender === 'Female').length;
        const uniqueDepts = new Set(members.map(m => m.department)).size;
        const multiQiratCount = members.filter(m => getQiratNames(m).length > 1).length;
        const recentWeek = members.filter(m => {
            const regDate = m.timestamp instanceof Date ? m.timestamp : new Date(m.timestamp);
            return (new Date() - regDate) / (1000 * 3600 * 24) <= 30;
        }).length;
        return { maleCount, femaleCount, uniqueDepts, multiQiratCount, recentWeek };
    }
    
    function saveToCache() {
        try {
            const cacheData = {
                registrations: allRegistrations,
                allQirats: allUniqueQirats,
                timestamp: new Date().toISOString(),
                version: '2.0'
            };
            localStorage.setItem('groups_v2_cache', JSON.stringify(cacheData));
            cacheStatusSpan.innerHTML = '<i class="fas fa-check-circle"></i> Cached';
        } catch (e) { console.warn('Cache save failed:', e); }
    }
    
    function loadFromCache() {
        try {
            const cached = localStorage.getItem('groups_v2_cache');
            if (cached) {
                const data = JSON.parse(cached);
                if (data.registrations && data.registrations.length > 0) {
                    allRegistrations = data.registrations;
                    allUniqueQirats = data.allQirats || [];
                    dataLoaded = true;
                    cacheStatusSpan.innerHTML = '<i class="fas fa-database"></i> Cached (from previous session)';
                    console.log('Loaded from cache:', allRegistrations.length);
                    return true;
                }
            }
        } catch (e) { console.warn('Cache load error:', e); }
        return false;
    }
    
    async function loadDataFromFirestore(force = false) {
        if (isLoading) return;
        
        // On page refresh, ALWAYS fetch fresh data
        if (isPageRefresh && !force) {
            console.log('Page refresh detected - fetching fresh data from cloud');
            force = true;
            isPageRefresh = false; // Reset after handling
        }
        
        if (dataLoaded && !force) {
            console.log('Using loaded data, skipping Firestore fetch');
            return;
        }
        
        isLoading = true;
        showToast(force ? 'Fetching fresh data from cloud...' : 'Loading data...');
        
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allRegistrations = [];
            const qiratSet = new Set();
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp;
                if (timestamp && typeof timestamp.toDate === 'function') timestamp = timestamp.toDate();
                else timestamp = new Date();
                const schedules = data.schedules || [];
                allRegistrations.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || 'N/A',
                    telegram: data.telegram || 'N/A',
                    department: data.department || 'N/A',
                    batch: data.batch || 'N/A',
                    schedules: schedules,
                    timestamp: timestamp
                });
                schedules.forEach(s => { if(s.qirat_name) qiratSet.add(s.qirat_name); });
            });
            allUniqueQirats = Array.from(qiratSet).sort();
            dataLoaded = true;
            saveToCache();
            showToast(`✅ Loaded ${allRegistrations.length} students from cloud`);
            cacheStatusSpan.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Fresh from Cloud';
            setTimeout(() => {
                cacheStatusSpan.innerHTML = '<i class="fas fa-check-circle"></i> Cached';
            }, 2000);
            return true;
        } catch (error) {
            console.error("Firestore error:", error);
            if (!loadFromCache()) {
                groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</div>`;
                showToast('Failed to load data', true);
            } else {
                showToast('Using cached data (offline mode)', false);
            }
            return false;
        } finally {
            isLoading = false;
            populateFilters();
            applyFilters();
        }
    }
    
    async function refreshFromCloud() {
        dataLoaded = false; // force fresh load
        await loadDataFromFirestore(true);
        showToast('Data refreshed from cloud');
    }
    
    function populateFilters() {
        const departments = [...new Set(allRegistrations.map(r => r.department))];
        const batches = [...new Set(allRegistrations.map(r => r.batch))];
        deptFilter.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        batchFilter.innerHTML = '<option value="">All Batches</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
        qiratFilter.innerHTML = '<option value="">All Qirats</option>' + allUniqueQirats.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');
        
        // Restore sticky filters
        genderFilter.value = stickyFilters.gender || '';
        deptFilter.value = stickyFilters.department || '';
        batchFilter.value = stickyFilters.batch || '';
        qiratFilter.value = stickyFilters.qirat || '';
        searchInput.value = stickyFilters.search || '';
    }
    
    function applyFilters() {
        const search = searchInput.value.toLowerCase().trim();
        const gender = genderFilter.value;
        const department = deptFilter.value;
        const batch = batchFilter.value;
        const selectedQirat = qiratFilter.value;
        
        stickyFilters = { search, gender, department, batch, qirat: selectedQirat };
        saveStickyFilters();
        
        filteredRegistrations = allRegistrations.filter(r => {
            const matchSearch = r.full_name.toLowerCase().includes(search) || 
                               r.phone.toLowerCase().includes(search) || 
                               r.telegram.toLowerCase().includes(search);
            const matchGender = !gender || r.gender === gender;
            const matchDept = !department || r.department === department;
            const matchBatch = !batch || r.batch === batch;
            const matchQirat = !selectedQirat || getQiratNames(r).includes(selectedQirat);
            return matchSearch && matchGender && matchDept && matchBatch && matchQirat;
        });
        
        resultCountSpan.textContent = `${filteredRegistrations.length} students`;
        buildGroups();
    }
    
    function buildGroups() {
        const groups = new Map();
        if (currentGroupMode === 'qirat') {
            filteredRegistrations.forEach(student => {
                getQiratNames(student).forEach(qirat => {
                    if (!groups.has(qirat)) groups.set(qirat, []);
                    groups.get(qirat).push(student);
                });
            });
        } else if (currentGroupMode === 'department') {
            filteredRegistrations.forEach(student => {
                const key = student.department;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else if (currentGroupMode === 'batch') {
            filteredRegistrations.forEach(student => {
                const key = student.batch;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else {
            filteredRegistrations.forEach(student => {
                const key = student.gender;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        }
        currentGroups = Array.from(groups.entries())
            .map(([name, members]) => ({ name, members, memberCount: members.length, stats: computeGroupStats(members) }))
            .sort((a, b) => b.memberCount - a.memberCount);
        renderGroups();
    }
    
    function getGroupIcon() {
        const icons = { qirat: 'fa-book-quran', department: 'fa-building', batch: 'fa-graduation-cap', gender: 'fa-venus-mars' };
        return icons[currentGroupMode] || 'fa-folder';
    }
    
    window.toggleGroup = function(idx) {
        const content = document.getElementById(`groupContent-${idx}`);
        const card = document.querySelector(`.group-card[data-group-idx="${idx}"]`);
        const icon = card?.querySelector('.toggle-icon');
        if (content) { content.classList.toggle('show'); if(icon) { icon.classList.toggle('fa-chevron-down'); icon.classList.toggle('fa-chevron-up'); } }
    };
    
    function renderGroups() {
        if (currentGroups.length === 0) {
            groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i> No groups found</div>`;
            return;
        }
        
        groupsContainer.innerHTML = currentGroups.map((group, idx) => {
            const s = group.stats;
            return `
            <div class="group-card" data-group-idx="${idx}">
                <div class="group-header" onclick="window.toggleGroup(${idx})">
                    <div class="group-title">
                        <i class="fas ${getGroupIcon()}"></i>
                        <span class="group-name">${escapeHtml(group.name)}</span>
                        <span class="group-count">${group.memberCount} student${group.memberCount !== 1 ? 's' : ''}</span>
                        <div class="group-stats">
                            <span class="stat-item"><i class="fas fa-venus-mars"></i> M:${s.maleCount} / F:${s.femaleCount}</span>
                            <span class="stat-item"><i class="fas fa-building"></i> Depts: ${s.uniqueDepts}</span>
                            <span class="stat-item"><i class="fas fa-chalkboard-user"></i> Multi-Q: ${s.multiQiratCount}</span>
                            <span class="stat-item"><i class="fas fa-calendar-week"></i> New: ${s.recentWeek}</span>
                        </div>
                    </div>
                    <div class="group-export-buttons" onclick="event.stopPropagation()">
                        <button class="group-export-item" data-group-idx="${idx}" data-format="csv"><i class="fas fa-file-csv"></i> CSV</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="excel"><i class="fas fa-file-excel"></i> Excel</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="word"><i class="fas fa-file-word"></i> Word</button>
                    </div>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div class="group-content" id="groupContent-${idx}">
                    <div class="group-table-wrapper">
                        <table class="student-table">
                            <thead><tr><th>No.</th><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${group.members.map((m, studentIdx) => `
                                    <tr>
                                        <td>${studentIdx + 1}</td>
                                        <td><strong>${escapeHtml(m.full_name)}</strong></td>
                                        <td><span class="badge ${m.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(m.gender)}</span></td>
                                        <td>${escapeHtml(m.phone)}</td>
                                        <td>${escapeHtml(m.department)}</td>
                                        <td>${escapeHtml(m.batch)}</td>
                                        <td>${escapeHtml(getQiratNames(m).join(', ') || '-')}</td>
                                        <td><button class="edit-student-btn" data-student='${JSON.stringify({id:m.id, name:m.full_name, gender:m.gender, phone:m.phone, telegram:m.telegram, dept:m.department, batch:m.batch, qirats:getQiratNames(m)})}'><i class="fas fa-pen"></i> Edit</button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }).join('');
        
        document.querySelectorAll('.group-export-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-group-idx'));
                const format = btn.getAttribute('data-format');
                exportSingleGroup(currentGroups[idx], format);
            });
        });
        
        document.querySelectorAll('.edit-student-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const studentData = JSON.parse(btn.getAttribute('data-student'));
                openEditModal(studentData);
            });
        });
    }
    
    window.openEditModal = function(student) {
        document.getElementById('editStudentId').value = student.id;
        document.getElementById('editName').value = student.name;
        document.getElementById('editGender').value = student.gender;
        document.getElementById('editPhone').value = student.phone;
        document.getElementById('editTelegram').value = student.telegram || '';
        document.getElementById('editDepartment').value = student.dept;
        document.getElementById('editBatch').value = student.batch;
        document.getElementById('editQirats').value = (student.qirats || []).join(', ');
        document.getElementById('editModal').classList.add('active');
    };
    
    window.closeEditModal = function() {
        document.getElementById('editModal').classList.remove('active');
    };
    
    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editStudentId').value;
        const newName = document.getElementById('editName').value;
        const newGender = document.getElementById('editGender').value;
        const newPhone = document.getElementById('editPhone').value;
        const newTelegram = document.getElementById('editTelegram').value;
        const newDept = document.getElementById('editDepartment').value;
        const newBatch = document.getElementById('editBatch').value;
        const qiratsStr = document.getElementById('editQirats').value;
        const qiratNames = qiratsStr.split(',').map(s => s.trim()).filter(s => s);
        const newSchedules = qiratNames.map(q => ({ qirat_name: q }));
        
        try {
            const studentRef = doc(db, "registrations", id);
            await updateDoc(studentRef, {
                full_name: newName,
                gender: newGender,
                phone: newPhone,
                telegram: newTelegram,
                department: newDept,
                batch: newBatch,
                schedules: newSchedules
            });
            showToast('Student updated successfully!');
            closeEditModal();
            await refreshFromCloud();
        } catch (error) {
            showToast('Update failed: ' + error.message, true);
        }
    });
    
    // Export functions (same as before)
    function exportSingleGroup(group, format) {
        if (!group || group.members.length === 0) { showToast('No students', true); return; }
        const exportData = group.members.map((m, idx) => formatStudentForExport(m, idx + 1));
        const groupName = group.name.replace(/[^a-z0-9]/gi, '_').slice(0, 30);
        
        if (format === 'csv') exportToCSV(exportData, groupName);
        else if (format === 'excel') exportToExcel(exportData, groupName);
        else if (format === 'pdf') exportToPDF(exportData, group.name, group.members.length, group.stats);
        else if (format === 'word') exportToWord(exportData, group.name, group.members.length, group.stats);
        showToast(`Exported "${group.name}" as ${format.toUpperCase()}`);
    }
    
    function exportToCSV(data, filename) {
        const headers = ['No.', 'Name', 'Gender', 'Phone', 'Telegram', 'Department', 'Batch', 'Qirats Enrolled'];
        const rows = data.map(row => headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`).join(','));
        const csvContent = [headers.join(','), ...rows].join('\n');
        downloadBlob(new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }), `${filename}.csv`);
    }
    
    function exportToExcel(data, sheetName) {
        const ws = XLSX.utils.json_to_sheet(data);
        ws['!cols'] = [{wch:6},{wch:25},{wch:10},{wch:15},{wch:18},{wch:20},{wch:15},{wch:35}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
        XLSX.writeFile(wb, `${sheetName}.xlsx`);
    }
    
    async function exportToPDF(data, groupName, totalCount, stats) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.setFontSize(18);
        doc.setTextColor(16, 185, 129);
        doc.text(`JUMJ Irshad - Group Report`, 14, 20);
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text(`Group: ${groupName}`, 14, 32);
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text(`Generated: ${new Date().toLocaleString()} | Total Students: ${totalCount}`, 14, 40);
        const tableData = data.map(row => [row['No.'], row.Name, row.Gender, row.Phone, row.Department, row.Batch, row['Qirats Enrolled']]);
        doc.autoTable({
            head: [['No.', 'Name', 'Gender', 'Phone', 'Department', 'Batch', 'Qirats']],
            body: tableData,
            startY: 50,
            theme: 'striped',
            headStyles: { fillColor: [16, 185, 129], textColor: [255, 255, 255], fontStyle: 'bold' },
            styles: { fontSize: 8, cellPadding: 3 }
        });
        doc.save(`${groupName.replace(/[^a-z0-9]/gi, '_')}_report.pdf`);
    }
    
    function exportToWord(data, groupName, totalCount, stats) {
        let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${groupName} - Report</title>
        <style>body{font-family:Arial;margin:40px}h1{color:#10b981}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:10px}th{background:#10b981;color:white}</style>
        </head><body><h1>JUMJ Irshad - ${groupName}</h1><p>Generated: ${new Date().toLocaleString()} | Students: ${totalCount}</p>
        <table><thead><tr><th>No.</th><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th></tr></thead><tbody>
        ${data.map(row => `<tr><td>${row['No.']}</td><td>${row.Name}</td><td>${row.Gender}</td><td>${row.Phone}</td><td>${row.Department}</td><td>${row.Batch}</td><td>${row['Qirats Enrolled']}</td></tr>`).join('')}
        </tbody></table></body></html>`;
        downloadBlob(new Blob([html], { type: 'application/msword' }), `${groupName.replace(/[^a-z0-9]/gi, '_')}_report.doc`);
    }
    
    function exportAllGroupsToExcel() {
        if (currentGroups.length === 0) { showToast('No groups to export', true); return; }
        const wb = XLSX.utils.book_new();
        currentGroups.forEach(group => {
            const sheetData = group.members.map((m, idx) => formatStudentForExport(m, idx + 1));
            const ws = XLSX.utils.json_to_sheet(sheetData);
            let sheetName = group.name.replace(/[\\/*?:[\]]/g, '').slice(0, 31);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });
        XLSX.writeFile(wb, `All_Groups_${currentGroupMode}_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
        showToast(`Exported all ${currentGroups.length} groups to Excel`);
    }
    
    function exportAllGroupsToWord() {
        if (currentGroups.length === 0) { showToast('No groups', true); return; }
        let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>All Groups</title>
        <style>body{font-family:Arial;margin:40px}h1{color:#10b981}h2{background:#f1f5f9;padding:10px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px}th{background:#10b981;color:white}</style>
        </head><body><h1>JUMJ Irshad - All Groups</h1><p>Mode: ${currentGroupMode} | Generated: ${new Date().toLocaleString()}</p>`;
        currentGroups.forEach(group => {
            html += `<h2>${group.name} (${group.memberCount} students)</h2><table><thead><tr><th>No.</th><th>Name</th><th>Gender</th><th>Phone</th><th>Dept</th><th>Batch</th><th>Qirats</th></tr></thead><tbody>`;
            group.members.forEach((m, idx) => {
                html += `<tr><td>${idx+1}</td><td>${m.full_name}</td><td>${m.gender}</td><td>${m.phone}</td><td>${m.department}</td><td>${m.batch}</td><td>${getQiratNames(m).join(', ')}</td></tr>`;
            });
            html += `</tbody></table><br>`;
        });
        html += `</body></html>`;
        downloadBlob(new Blob([html], { type: 'application/msword' }), `All_Groups_${currentGroupMode}.doc`);
        showToast(`Exported all ${currentGroups.length} groups to Word`);
    }
    
    async function exportAllGroupsToPdf() {
        if (currentGroups.length === 0) { showToast('No groups', true); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        let yPos = 20;
        doc.setFontSize(18); doc.setTextColor(16, 185, 129);
        doc.text(`JUMJ Irshad - All Groups`, 14, yPos); yPos += 10;
        doc.setFontSize(10); doc.setTextColor(0,0,0);
        doc.text(`Mode: ${currentGroupMode} | Generated: ${new Date().toLocaleString()}`, 14, yPos); yPos += 10;
        
        for (let i = 0; i < currentGroups.length; i++) {
            const group = currentGroups[i];
            if (yPos > 180) { doc.addPage(); yPos = 20; }
            doc.setFontSize(12); doc.setTextColor(16, 185, 129);
            doc.text(`${group.name} (${group.memberCount} students)`, 14, yPos); yPos += 7;
            const tableData = group.members.map((m, idx) => [idx+1, m.full_name, m.gender, m.phone, m.department, m.batch, getQiratNames(m).join(', ').substring(0, 25)]);
            const result = doc.autoTable({
                head: [['No.', 'Name', 'Gender', 'Phone', 'Dept', 'Batch', 'Qirats']],
                body: tableData,
                startY: yPos,
                theme: 'striped',
                headStyles: { fillColor: [16, 185, 129] },
                styles: { fontSize: 7, cellPadding: 2 }
            });
            yPos = result.finalY + 8;
        }
        doc.save(`All_Groups_${currentGroupMode}.pdf`);
        showToast(`Exported all ${currentGroups.length} groups to PDF`);
    }
    
    function downloadBlob(blob, filename) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    searchInput.addEventListener('input', applyFilters);
    genderFilter.addEventListener('change', applyFilters);
    deptFilter.addEventListener('change', applyFilters);
    batchFilter.addEventListener('change', applyFilters);
    qiratFilter.addEventListener('change', applyFilters);
    clearFiltersBtn.addEventListener('click', () => { 
        searchInput.value = ''; genderFilter.value = ''; deptFilter.value = ''; batchFilter.value = ''; qiratFilter.value = '';
        applyFilters(); 
        showToast('Filters cleared');
    });
    exportAllExcelBtn.addEventListener('click', exportAllGroupsToExcel);
    exportAllWordBtn.addEventListener('click', exportAllGroupsToWord);
    exportAllPdfBtn.addEventListener('click', exportAllGroupsToPdf);
    forceRefreshBtn.addEventListener('click', refreshFromCloud);
    
    document.querySelectorAll('.group-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.group-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGroupMode = btn.dataset.mode;
            saveGroupMode();
            buildGroups();
        });
    });
    
    initNavigation();
    if (admin?.role === 'super-admin') setTimeout(() => refreshNavigation(), 100);
    
    // Initialize: load sticky filters, group mode, then load data
    loadStickyFilters();
    loadGroupMode();
    
    // Try cache first, but on refresh we'll fetch fresh
    if (!isPageRefresh && loadFromCache()) {
        populateFilters();
        applyFilters();
        // silently update in background
        setTimeout(() => loadDataFromFirestore(false), 500);
    } else {
        loadDataFromFirestore(true);
    }
</script>
</body>
</html>
