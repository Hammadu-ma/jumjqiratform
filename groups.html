<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Noor Academy | Groups View with 4-Export System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: var(--primary-light);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Filters */
        .filters-bar {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.85rem;
            background: white;
        }

        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-clear {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Group Mode Selector */
        .group-mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .group-mode-btn {
            padding: 12px 28px;
            border: none;
            background: var(--card-bg);
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-mode-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        /* Export Bar */
        .export-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border);
        }

        .export-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .export-excel { background: #10b981; color: white; }
        .export-all { background: #6366f1; color: white; }
        .export-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }

        /* Group Cards */
        .groups-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .group-header {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            padding: 20px 28px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .group-title {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .group-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .group-count {
            background: var(--primary-light);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .group-export-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-export-item {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .group-export-item:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toggle-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .group-content {
            display: none;
            background: white;
        }

        .group-content.show {
            display: block;
        }

        .group-table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .student-table th, .student-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .student-table th {
            background: #f8fafc;
            font-weight: 700;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-muted);
        }

        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }

        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            .bottom-nav { display: none; }
        }

        @media (max-width: 768px) {
            .main-container { padding: 16px; padding-bottom: 80px; }
            .group-header { flex-direction: column; align-items: flex-start; }
            .group-export-buttons { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-layer-group"></i> Groups View</h1></div>
        <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
</div>

<div class="main-container">
    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group"><label><i class="fas fa-search"></i> Search</label><input type="text" id="searchInput" placeholder="Name or Phone..."></div>
        <div class="filter-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="filter-group"><label><i class="fas fa-building"></i> Department</label><select id="deptFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-calendar"></i> Batch</label><select id="batchFilter"><option value="">All</option></select></div>
        <button class="btn-clear" id="clearFiltersBtn"><i class="fas fa-eraser"></i> Clear</button>
    </div>

    <!-- Group Mode Selector -->
    <div class="group-mode-selector">
        <button class="group-mode-btn active" data-mode="qirat"><i class="fas fa-book-quran"></i> By Qirat</button>
        <button class="group-mode-btn" data-mode="department"><i class="fas fa-building"></i> By Department</button>
        <button class="group-mode-btn" data-mode="batch"><i class="fas fa-graduation-cap"></i> By Batch</button>
        <button class="group-mode-btn" data-mode="gender"><i class="fas fa-venus-mars"></i> By Gender</button>
    </div>

    <!-- Export Bar -->
    <div class="export-bar">
        <div class="export-buttons">
            <button class="export-btn export-all" id="exportAllGroupsBtn"><i class="fas fa-file-excel"></i> Export All Groups (Excel)</button>
        </div>
        <div class="result-count" id="resultCount">0 students</div>
    </div>

    <!-- Groups Container -->
    <div class="groups-container" id="groupsContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading groups...</div>
    </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='home.html'"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nav-item active" onclick="window.location.href='groups.html'"><i class="fas fa-layer-group"></i><span>Groups</span></button>
    <button class="nav-item" onclick="window.location.href='tables.html'"><i class="fas fa-table"></i><span>Tables</span></button>
    <button class="nav-item" onclick="window.location.href='analytics.html'"><i class="fas fa-chart-line"></i><span>Analytics</span></button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allRegistrations = [];
    let filteredRegistrations = [];
    let currentGroupMode = 'qirat';
    let currentGroups = [];
    
    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const genderFilter = document.getElementById('genderFilter');
    const deptFilter = document.getElementById('deptFilter');
    const batchFilter = document.getElementById('batchFilter');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const groupsContainer = document.getElementById('groupsContainer');
    const resultCountSpan = document.getElementById('resultCount');
    const exportAllBtn = document.getElementById('exportAllGroupsBtn');
    const toast = document.getElementById('toast');
    
    function showToast(message, isError = false) {
        toast.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function getQiratNames(student) {
        return (student.schedules || []).map(s => s.qirat_name).filter(Boolean);
    }
    
    function formatStudentForExport(student) {
        return {
            'Name': student.full_name,
            'Gender': student.gender,
            'Phone': student.phone,
            'Telegram': student.telegram,
            'Department': student.department,
            'Batch': student.batch,
            'Qirats Enrolled': getQiratNames(student).join(', ') || '-',
            'Registration Date': student.timestamp instanceof Date ? student.timestamp.toLocaleDateString() : new Date(student.timestamp).toLocaleDateString()
        };
    }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allRegistrations = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp;
                if (timestamp && typeof timestamp.toDate === 'function') timestamp = timestamp.toDate();
                else timestamp = new Date();
                
                allRegistrations.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || 'N/A',
                    telegram: data.telegram || 'N/A',
                    department: data.department || 'N/A',
                    batch: data.batch || 'N/A',
                    schedules: data.schedules || [],
                    timestamp: timestamp
                });
            });
            populateFilters();
            applyFilters();
        } catch (error) {
            groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</div>`;
        }
    }
    
    function populateFilters() {
        const departments = [...new Set(allRegistrations.map(r => r.department))];
        const batches = [...new Set(allRegistrations.map(r => r.batch))];
        deptFilter.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        batchFilter.innerHTML = '<option value="">All Batches</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
    }
    
    function applyFilters() {
        const search = searchInput.value.toLowerCase();
        const gender = genderFilter.value;
        const department = deptFilter.value;
        const batch = batchFilter.value;
        
        filteredRegistrations = allRegistrations.filter(r => {
            const matchSearch = r.full_name.toLowerCase().includes(search) || r.phone.includes(search);
            const matchGender = !gender || r.gender === gender;
            const matchDept = !department || r.department === department;
            const matchBatch = !batch || r.batch === batch;
            return matchSearch && matchGender && matchDept && matchBatch;
        });
        
        resultCountSpan.textContent = `${filteredRegistrations.length} students`;
        buildGroups();
    }
    
    function buildGroups() {
        const groups = new Map();
        
        if (currentGroupMode === 'qirat') {
            filteredRegistrations.forEach(student => {
                getQiratNames(student).forEach(qirat => {
                    if (!groups.has(qirat)) groups.set(qirat, []);
                    groups.get(qirat).push(student);
                });
            });
        } else if (currentGroupMode === 'department') {
            filteredRegistrations.forEach(student => {
                const key = student.department;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else if (currentGroupMode === 'batch') {
            filteredRegistrations.forEach(student => {
                const key = student.batch;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } else if (currentGroupMode === 'gender') {
            filteredRegistrations.forEach(student => {
                const key = student.gender;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        }
        
        currentGroups = Array.from(groups.entries())
            .map(([name, members]) => ({ name, members, memberCount: members.length }))
            .sort((a, b) => b.memberCount - a.memberCount);
        
        renderGroups();
    }
    
    function renderGroups() {
        if (currentGroups.length === 0) {
            groupsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i> No groups found</div>`;
            return;
        }
        
        groupsContainer.innerHTML = currentGroups.map((group, idx) => `
            <div class="group-card" data-group-idx="${idx}">
                <div class="group-header" onclick="window.toggleGroup(${idx})">
                    <div class="group-title">
                        <i class="fas ${getGroupIcon()}"></i>
                        <span class="group-name">${escapeHtml(group.name)}</span>
                        <span class="group-count">${group.memberCount} student${group.memberCount !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="group-export-buttons" onclick="event.stopPropagation()">
                        <button class="group-export-item" data-group-idx="${idx}" data-format="csv"><i class="fas fa-file-csv"></i> CSV</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="excel"><i class="fas fa-file-excel"></i> Excel</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                        <button class="group-export-item" data-group-idx="${idx}" data-format="word"><i class="fas fa-file-word"></i> Word</button>
                    </div>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div class="group-content" id="groupContent-${idx}">
                    <div class="group-table-wrapper">
                        <table class="student-table">
                            <thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Registered</th></tr></thead>
                            <tbody>
                                ${group.members.map(m => `
                                    <tr>
                                        <td><strong>${escapeHtml(m.full_name)}</strong></td>
                                        <td><span class="badge ${m.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(m.gender)}</span></td>
                                        <td>${escapeHtml(m.phone)}</td>
                                        <td>${escapeHtml(m.department)}</td>
                                        <td>${escapeHtml(m.batch)}</td>
                                        <td>${escapeHtml(getQiratNames(m).slice(0, 3).join(', ') || '-')}</td>
                                        <td>${m.timestamp.toLocaleDateString()}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `).join('');
        
        // Attach export event listeners
        document.querySelectorAll('.group-export-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-group-idx'));
                const format = btn.getAttribute('data-format');
                exportGroup(currentGroups[idx], format);
            });
        });
    }
    
    function getGroupIcon() {
        const icons = { qirat: 'fa-book-quran', department: 'fa-building', batch: 'fa-graduation-cap', gender: 'fa-venus-mars' };
        return icons[currentGroupMode] || 'fa-folder';
    }
    
    // ==================== 4 EXPORT FUNCTIONS ====================
    
    function exportGroup(group, format) {
        if (!group || group.members.length === 0) {
            showToast('No students in this group to export', true);
            return;
        }
        
        const exportData = group.members.map(m => formatStudentForExport(m));
        const groupName = group.name.replace(/[^a-z0-9]/gi, '_').slice(0, 30);
        const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
        
        switch(format) {
            case 'csv':
                exportToCSV(exportData, `${groupName}_${timestamp}`);
                showToast(`Exported "${group.name}" as CSV (${group.members.length} records)`);
                break;
            case 'excel':
                exportToExcel(exportData, groupName);
                showToast(`Exported "${group.name}" as Excel (${group.members.length} records)`);
                break;
            case 'pdf':
                exportToPDF(exportData, group.name, group.members.length);
                showToast(`Exported "${group.name}" as PDF Report`);
                break;
            case 'word':
                exportToWord(exportData, group.name, group.members.length);
                showToast(`Exported "${group.name}" as Word Document`);
                break;
        }
    }
    
    function exportToCSV(data, filename) {
        const headers = ['Name', 'Gender', 'Phone', 'Telegram', 'Department', 'Batch', 'Qirats Enrolled', 'Registration Date'];
        const rows = data.map(row => headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`).join(','));
        const csvContent = [headers.join(','), ...rows].join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        downloadBlob(blob, `${filename}.csv`);
    }
    
    function exportToExcel(data, sheetName) {
        const ws = XLSX.utils.json_to_sheet(data);
        ws['!cols'] = [{wch:25},{wch:10},{wch:15},{wch:18},{wch:20},{wch:15},{wch:35},{wch:15}];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
        XLSX.writeFile(wb, `${sheetName}.xlsx`);
    }
    
    async function exportToPDF(data, groupName, totalCount) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        
        // Title Section
        doc.setFontSize(18);
        doc.setTextColor(16, 185, 129);
        doc.text(`Noor Academy - Group Report`, 14, 20);
        
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text(`Group: ${groupName}`, 14, 32);
        
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text(`Generated: ${new Date().toLocaleString()} | Total Students: ${totalCount}`, 14, 40);
        
        // KPIs Summary
        const maleCount = data.filter(d => d.Gender === 'Male').length;
        const femaleCount = data.filter(d => d.Gender === 'Female').length;
        const uniqueDepts = [...new Set(data.map(d => d.Department))].length;
        
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.text(`Summary KPIs:`, 14, 52);
        doc.setFontSize(9);
        doc.text(`• Gender Split: Male ${maleCount} | Female ${femaleCount}`, 14, 60);
        doc.text(`• Departments Represented: ${uniqueDepts}`, 14, 67);
        doc.text(`• Multi-Qirat Students: ${data.filter(d => d['Qirats Enrolled'] && d['Qirats Enrolled'].split(',').length > 1).length}`, 14, 74);
        
        // Student Table
        const tableData = data.map(row => [
            row.Name, row.Gender, row.Phone, row.Department, row.Batch, 
            (row['Qirats Enrolled'] || '').substring(0, 30), row['Registration Date']
        ]);
        
        doc.autoTable({
            head: [['Name', 'Gender', 'Phone', 'Department', 'Batch', 'Qirats', 'Reg Date']],
            body: tableData,
            startY: 82,
            theme: 'striped',
            headStyles: { fillColor: [16, 185, 129], textColor: [255, 255, 255], fontStyle: 'bold' },
            styles: { fontSize: 8, cellPadding: 3 }
        });
        
        doc.save(`${groupName.replace(/[^a-z0-9]/gi, '_')}_report.pdf`);
    }
    
    function exportToWord(data, groupName, totalCount) {
        const maleCount = data.filter(d => d.Gender === 'Male').length;
        const femaleCount = data.filter(d => d.Gender === 'Female').length;
        
        let html = `<!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>${groupName} - Group Report</title>
            <style>
                body { font-family: 'Arial', sans-serif; margin: 40px; }
                h1 { color: #10b981; border-bottom: 2px solid #10b981; padding-bottom: 10px; }
                .subtitle { color: #059669; margin: 10px 0; }
                .kpi-box { background: #f0fdf4; padding: 15px; border-radius: 12px; margin: 20px 0; }
                table { border-collapse: collapse; width: 100%; margin-top: 20px; }
                th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                th { background: #10b981; color: white; }
                tr:nth-child(even) { background: #f9fafb; }
            </style>
        </head>
        <body>
            <h1>📊 Noor Academy - Group Report</h1>
            <div class="subtitle">Group: ${escapeHtml(groupName)}</div>
            <p>Generated: ${new Date().toLocaleString()} | Total Students: ${totalCount}</p>
            
            <div class="kpi-box">
                <h3>Summary KPIs</h3>
                <p><strong>Gender Split:</strong> Male ${maleCount} | Female ${femaleCount}</p>
                <p><strong>Departments:</strong> ${[...new Set(data.map(d => d.Department))].join(', ')}</p>
                <p><strong>Multi-Qirat Students:</strong> ${data.filter(d => d['Qirats Enrolled'] && d['Qirats Enrolled'].split(',').length > 1).length}</p>
            </div>
            
            <h3>Student List</h3>
            <table>
                <thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Reg Date</th></tr></thead>
                <tbody>
                    ${data.map(row => `
                        <tr>
                            <td>${escapeHtml(row.Name)}</td>
                            <td>${escapeHtml(row.Gender)}</td>
                            <td>${escapeHtml(row.Phone)}</td>
                            <td>${escapeHtml(row.Department)}</td>
                            <td>${escapeHtml(row.Batch)}</td>
                            <td>${escapeHtml(row['Qirats Enrolled'])}</td>
                            <td>${escapeHtml(row['Registration Date'])}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </body>
        </html>`;
        
        const blob = new Blob([html], { type: 'application/msword' });
        downloadBlob(blob, `${groupName.replace(/[^a-z0-9]/gi, '_')}_report.doc`);
    }
    
    function downloadBlob(blob, filename) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
    }
    
    function exportAllGroupsToExcel() {
        if (currentGroups.length === 0) {
            showToast('No groups to export', true);
            return;
        }
        
        const wb = XLSX.utils.book_new();
        currentGroups.forEach(group => {
            const sheetData = group.members.map(m => formatStudentForExport(m));
            const ws = XLSX.utils.json_to_sheet(sheetData);
            let sheetName = group.name.replace(/[\\/*?:[\]]/g, '').slice(0, 31);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });
        
        XLSX.writeFile(wb, `All_Groups_${currentGroupMode}_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.xlsx`);
        showToast(`Exported all ${currentGroups.length} groups to Excel`);
    }
    
    window.toggleGroup = function(idx) {
        const content = document.getElementById(`groupContent-${idx}`);
        const card = document.querySelector(`.group-card[data-group-idx="${idx}"]`);
        const icon = card?.querySelector('.toggle-icon');
        if (content) {
            content.classList.toggle('show');
            if (icon) {
                icon.classList.toggle('fa-chevron-down');
                icon.classList.toggle('fa-chevron-up');
            }
        }
    };
    
    // Event Listeners
    searchInput.addEventListener('input', applyFilters);
    genderFilter.addEventListener('change', applyFilters);
    deptFilter.addEventListener('change', applyFilters);
    batchFilter.addEventListener('change', applyFilters);
    clearFiltersBtn.addEventListener('click', () => {
        searchInput.value = '';
        genderFilter.value = '';
        deptFilter.value = '';
        batchFilter.value = '';
        applyFilters();
    });
    exportAllBtn.addEventListener('click', exportAllGroupsToExcel);
    
    document.querySelectorAll('.group-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.group-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGroupMode = btn.dataset.mode;
            buildGroups();
        });
    });
    
    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
