    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {

            padding: 0;

        :root {
            --gradient-1: linear-gradient(135deg, #1e3c2c 0%, #2a6b4e 50%, #c9a03d 100%);
            --gradient-2: linear-gradient(135deg, #f9e0a0 0%, #f4c542 50%, #e6b422 100%);

            --text-secondary: #6b4e2e;
            --text-light: #9b7b4c;
            --border-glow: rgba(201, 160, 61, 0.5);
            --primary-gold: #d4af37;
            --primary-gold-dark: #b88d2e;
            --primary-emerald: #2d6a4f;
            --primary-emerald-light: #40916c;
            --accent-rose: #c97e5a;
            --accent-saffron: #ff8c42;
            --shadow-gold: 0 8px 32px rgba(201, 160, 61, 0.25);
            --shadow-emerald: 0 8px 32px rgba(45, 106, 79, 0.2);
            --transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body.dark {
            --card-bg: rgba(20, 28, 24, 0.94);
            --text-primary: #faf3e0;
            --text-secondary: #e6d5b8;
            --text-light: #c9b07c;

        body {
            font-family: 'Poppins', 'Amiri', 'Segoe UI', serif;
            min-height: 100vh;
            padding: 1rem;
            position: relative;
            background: linear-gradient(135deg, #0a2a1f 0%, #1a4a35 50%, #2d5a3e 100%);
            overflow-x: hidden;
        }

        /* Mobile-first base styles */
        .form-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(212, 175, 55, 0.3);
            padding: 1.5rem;
            transition: var(--transition);
            animation: containerGlow 3s ease-in-out infinite;
        }

        @keyframes containerGlow {
            0%, 100% { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 25px 50px -12px rgba(212, 175, 55, 0.4), 0 0 0 2px rgba(212, 175, 55, 0.5); }
        }

        /* Tablet and desktop improvements */
        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
            .form-container {
                max-width: 800px;
                padding: 2rem;
                border-radius: 2rem;
            }
        }

        @media (min-width: 1024px) {
            .form-container {
                max-width: 1000px;
                padding: 2.5rem;
                border-radius: 3rem;
            }
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.08"><path fill="none" stroke="%23f4c542" stroke-width="1.2" d="M50 10 L58 30 L78 32 L63 48 L68 70 L50 58 L32 70 L37 48 L22 32 L42 30 L50 10z"/><circle cx="50" cy="50" r="12" stroke="%23f4c542" fill="none" stroke-width="1"/></svg>');

<body>
    <div class="bg-pattern"></div>
    <div class="mosque-silhouette"></div>
    
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i> Dark Mode
    </button>

    <div class="form-container">
        <div class="header">
            <div class="logo-container">
    <img src="logo.png" alt="JUMJ Logo" class="logo-img" id="logoImage">
</div>
            <h2>
                <i class="fas fa-quran"></i>
                JUMJ - Qirat Registration
                <i class="fas "></i>
            </h2>
            <div class="subhead">
                <i class="fas fa-quran"></i>
                Recite & Reflect | Join the Blessed Circle
                <i class="fas fa-mosque"></i>
            </div>
        </div>

        <form id="qiratForm">
            <div class="form-row">
                <div class="form-group">
                    <label class="required"><i class="fas fa-user-circle"></i> Full Name</label>
                    <input type="text" id="full_name" placeholder="Enter your full name" required maxlength="50">
                    <div class="char-counter"><span id="nameCount">0</span>/50 characters</div>
                </div>
                <div class="form-group">
                    <label class="required"><i class="fas fa-venus-mars"></i> Gender</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="required"><i class="fas fa-phone-alt"></i> Phone Number</label>
                    <input type="tel" id="phone" placeholder="+1234567890" required>
                </div>
                <div class="form-group">
                    <label class="required"><i class="fas fa-building"></i> Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Pharmacy">Pharmacy</option>
                        <option value="Nursing">Nursing</option>
                        <option value="Dentistry">Dentistry</option>
                        <option value="Public Health">Public Health</option>
                        <option value="Medical Laboratory">Medical Laboratory</option>
                        <option value="Radiology">Radiology</option>
                        <option value="Physiotherapy">Physiotherapy</option>
                        <option value="Health Informatics">Health Informatics</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="required"><i class="fas fa-graduation-cap"></i> Batch / Year</label>
                <select id="batch" required>
                    <option value="">Select Batch / Year</option>
                </select>
            </div>

            <div class="form-group">
                <label class="required"><i class="fab fa-telegram"></i> Telegram Username</label>
                <input type="text" id="telegram" placeholder="@username" required>
            </div>

            <div style="margin: 1rem 0 0.8rem;">
                <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem;">
                    <i class="fas fa-calendar-alt"></i>
                    Qirat Schedules
                </h3>
                <p style="color: var(--text-secondary); font-size: 0.75rem; margin-top: 0.3rem;">
                    <i class="fas fa-hand-peace"></i> Select available days, Qirat name & preferred time
                </p>
            </div>

            <div id="schedules">
                <div class="schedule-group" data-id="0">
                    <div class="schedule-header">
                        <span class="schedule-badge"><i class="fas fa-star-of-life"></i> Schedule 1</span>
                        <button type="button" class="btn-remove" onclick="removeSchedule(this)"><i class="fas fa-trash-alt"></i> Remove</button>
                    </div>
                    <div class="days-selector">
                        <label><input type="checkbox" class="day-check" value="Monday"><span>Mon</span></label>
                        <label><input type="checkbox" class="day-check" value="Tuesday"><span>Tue</span></label>
                        <label><input type="checkbox" class="day-check" value="Wednesday"><span>Wed</span></label>
                        <label><input type="checkbox" class="day-check" value="Thursday"><span>Thu</span></label>
                        <label><input type="checkbox" class="day-check" value="Friday"><span>Fri</span></label>
                        <label><input type="checkbox" class="day-check" value="Saturday"><span>Sat</span></label>
                        <label><input type="checkbox" class="day-check" value="Sunday"><span>Sun</span></label>
                    </div>
                    <div class="schedule-row">
                        <div>
                            <label class="required"><i class="fas fa-music"></i> Qirat Name</label>
                            <input type="text" class="qirat_name" placeholder="e.g., Surah Al-Fatiha, Tajweed" required>
                        </div>
                        <div>
                            <label class="required"><i class="fas fa-clock"></i> Time Preference</label>
                            <input type="text" class="time_preference" placeholder="Maghrib - Isha, 7:30 PM" required>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="add-schedule" class="btn-secondary">
                <i class="fas fa-plus-circle"></i> Add Another Schedule
            </button>

            <button type="submit" class="btn-primary" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Submit Registration
            </button>
        </form>

        <div id="status"></div>
        
        <div class="islamic-quote">
            <i class="fas fa-quote-right"></i> 
            "And recite the Qur'an with measured recitation."
            <i class="fas fa-quote-left"></i>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const BOT_TOKEN = '8471368946:AAHXFpFGC5ob5ptDivokYDVpEVBqM0c5iKQ';
        const ADMIN_IDS = ['7897840965'];
        
        // Try to load actual logo if exists
        const logoImg = document.getElementById('logoImage');
        // If you have an actual logo.png in your project, uncomment the line below
        // logoImg.src = 'logo.png';
        
        // Theme
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i> Light Mode' : '<i class="fas fa-moon"></i> Dark Mode';
        });
        
        // Character counter
        const nameInput = document.getElementById('full_name');
        const nameCount = document.getElementById('nameCount');
        nameInput.addEventListener('input', () => {
            nameCount.textContent = nameInput.value.length;
            if (nameInput.value.length > 50) nameInput.value = nameInput.value.slice(0, 50);
        });
        
        // Batch options
        const medicineBatchOptions = [
            "Pre-Med", "New PC1", "Old PC1", "New PC2", "Old CPC2", "New C1", "Old C1", "New C2", "Old C2", "Intern"
        ];
        const otherYearOptions = ["1st Year", "2nd Year", "3rd Year", "4th Year", "5th Year", "6th Year"];
        
        function updateBatchOptions() {
            const deptSelect = document.getElementById('department');
            const batchSelect = document.getElementById('batch');
            const selectedDept = deptSelect.value;
            batchSelect.innerHTML = '<option value="">Select Batch / Year</option>';
            
            if (selectedDept === "Medicine") {
                medicineBatchOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    batchSelect.appendChild(option);
                });
            } else if (selectedDept && selectedDept !== "") {
                otherYearOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    batchSelect.appendChild(option);
                });
            }
        }
        
        document.getElementById('department').addEventListener('change', updateBatchOptions);
        updateBatchOptions();
        
        // Schedule management
        let scheduleCounter = 1;
        window.removeSchedule = function(btn) {
            const groups = document.querySelectorAll('.schedule-group');
            if (groups.length > 1) {
                btn.closest('.schedule-group').remove();
                updateScheduleBadges();
            } else {
                showStatus('At least one schedule is required!', 'error');
            }
        };
        
        function updateScheduleBadges() {
            const groups = document.querySelectorAll('.schedule-group');
            groups.forEach((group, idx) => {
                const badge = group.querySelector('.schedule-badge');
                if (badge) badge.innerHTML = `<i class="fas fa-star-of-life"></i> Schedule ${idx + 1}`;
            });
        }
        
        document.getElementById('add-schedule').addEventListener('click', () => {
            const container = document.getElementById('schedules');
            const newGroup = document.createElement('div');
            newGroup.className = 'schedule-group';
            newGroup.setAttribute('data-id', scheduleCounter++);
            newGroup.innerHTML = `
                <div class="schedule-header">
                    <span class="schedule-badge"><i class="fas fa-star-of-life"></i> Schedule ${document.querySelectorAll('.schedule-group').length + 1}</span>
                    <button type="button" class="btn-remove" onclick="removeSchedule(this)"><i class="fas fa-trash-alt"></i> Remove</button>
                </div>
                <div class="days-selector">
                    <label><input type="checkbox" class="day-check" value="Monday"><span>Mon</span></label>
                    <label><input type="checkbox" class="day-check" value="Tuesday"><span>Tue</span></label>
                    <label><input type="checkbox" class="day-check" value="Wednesday"><span>Wed</span></label>
                    <label><input type="checkbox" class="day-check" value="Thursday"><span>Thu</span></label>
                    <label><input type="checkbox" class="day-check" value="Friday"><span>Fri</span></label>
                    <label><input type="checkbox" class="day-check" value="Saturday"><span>Sat</span></label>
                    <label><input type="checkbox" class="day-check" value="Sunday"><span>Sun</span></label>
                </div>
                <div class="schedule-row">
                    <div><label class="required"><i class="fas fa-music"></i> Qirat Name</label><input type="text" class="qirat_name" placeholder="e.g., Surah Al-Fatiha" required></div>
                    <div><label class="required"><i class="fas fa-clock"></i> Time Preference</label><input type="text" class="time_preference" placeholder="Maghrib - Isha" required></div>
                </div>
            `;
            container.appendChild(newGroup);
            updateScheduleBadges();
            newGroup.style.animation = 'fadeInUp 0.4s ease-out';
        });
        
        async function sendToTelegram(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML', disable_web_page_preview: true })
                });
            } catch (err) { console.error(err); }
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = type;
            setTimeout(() => { if (statusDiv.className === type) statusDiv.className = ''; }, 5000);
        }
        
        document.getElementById('qiratForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            submitBtn.disabled = true;
            
            const full_name = document.getElementById('full_name').value.trim();
            const gender = document.getElementById('gender').value;
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value;
            const batch = document.getElementById('batch').value;
            const telegram = document.getElementById('telegram').value.trim();
            
            if (!full_name || !gender || !phone || !department || !batch || !telegram) {
                showStatus('Please fill all required fields', 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                return;
            }
            
            const scheduleGroups = document.querySelectorAll('.schedule-group');
            const schedules = Array.from(scheduleGroups).map(group => ({
                days: Array.from(group.querySelectorAll('.day-check:checked')).map(cb => cb.value),
                qirat_name: group.querySelector('.qirat_name').value.trim(),
                time_preference: group.querySelector('.time_preference').value.trim()
            }));
            
            for (let i = 0; i < schedules.length; i++) {
                const s = schedules[i];
                if (s.days.length === 0 || !s.qirat_name || !s.time_preference) {
                    showStatus(`Schedule ${i+1}: days, Qirat name and time required`, 'error');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }
            }
            
            try {
                const docRef = await addDoc(collection(db, 'registrations'), {
                    full_name, gender, phone, department, batch, telegram, schedules, timestamp: serverTimestamp()
                });
                
                const schedulesText = schedules.map((s, idx) => `📖 Schedule ${idx+1}: ${s.qirat_name} at ${s.time_preference} on ${s.days.join(', ')}`).join('\n');
                const msg = `🌟 <b>NEW QIRAT REGISTRATION</b> 🌟\n━━━━━━━━━━━━━━━━\n👤 Name: ${full_name}\n⚧ Gender: ${gender}\n📞 Phone: ${phone}\n🏛 Dept: ${department}\n📚 Batch: ${batch}\n💬 Telegram: ${telegram}\n━━━━━━━━━━━━━━━━\n<b>📅 Schedules:</b>\n${schedulesText}\n🆔 ID: ${docRef.id}`;
                for (const adminId of ADMIN_IDS) await sendToTelegram(adminId, msg);
                
                showStatus('Registration successful!', 'success');
                document.getElementById('qiratForm').reset();
                document.getElementById('nameCount').textContent = '0';
                const container = document.getElementById('schedules');
                const firstGroup = container.querySelector('.schedule-group').cloneNode(true);
                firstGroup.querySelectorAll('.day-check').forEach(cb => cb.checked = false);
                firstGroup.querySelectorAll('.qirat_name, .time_preference').forEach(inp => inp.value = '');
                container.innerHTML = '';
                container.appendChild(firstGroup);
                scheduleCounter = 1;
                updateScheduleBadges();
                updateBatchOptions();
            } catch (error) {
                console.error(error);
                showStatus('Error submitting. Check connection.', 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        updateScheduleBadges();
    </script>
</body>
</html>
