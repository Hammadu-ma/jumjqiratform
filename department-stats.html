<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Department Analytics Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .desktop-nav {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .nav-link {
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover { background: var(--primary-light); color: var(--primary-dark); }
        .nav-link.active { background: linear-gradient(135deg, #10b981, #059669); color: white; }

        .main-container { max-width: 1600px; margin: 0 auto; padding: 24px; }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Advanced Export Section */
        .advanced-export-section {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--primary-light);
        }
        .advanced-export-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-dark);
        }
        .qirat-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .qirat-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .qirat-checkbox:hover { background: var(--primary-light); border-color: var(--primary); }
        .qirat-checkbox.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .qirat-checkbox input { margin-right: 6px; cursor: pointer; }
        .select-all-btn { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }

        /* Department Grid */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .dept-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }
        .dept-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--primary); }
        .dept-card.selected { border: 2px solid var(--primary); background: var(--primary-light); }
        .dept-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .dept-name { font-weight: 800; font-size: 1rem; color: var(--primary-dark); }
        .dept-count { background: var(--primary-light); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
        .progress-bar { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 10px; }

        /* Filters Bar */
        .filters-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            border: 1px solid var(--border);
        }
        .filter-group { flex: 1; min-width: 140px; }
        .filter-group label { font-size: 0.7rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 6px; }
        .filter-group input, .filter-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; background: white; }
        .btn-clear { background: #64748b; color: white; border: none; padding: 10px 24px; border-radius: 16px; font-weight: 600; cursor: pointer; }

        /* Export Bar */
        .export-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border);
        }
        .export-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .export-btn { padding: 8px 20px; border: none; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .export-csv { background: #10b981; color: white; }
        .export-excel { background: #059669; color: white; }
        .export-pdf { background: #ef4444; color: white; }
        .export-word { background: #3b82f6; color: white; }
        .export-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }

        /* Qirat Insights Grid */
        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .insight-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .insight-card:hover { box-shadow: var(--shadow-md); }
        .insight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .insight-title { font-weight: 800; font-size: 0.9rem; color: var(--primary-dark); }
        .insight-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .insight-stats { font-size: 0.7rem; color: var(--text-muted); margin: 8px 0; }
        .insight-btn { background: var(--border); border: none; padding: 6px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; cursor: pointer; margin-top: 8px; width: 100%; }

        /* Student Table */
        .table-container {
            background: var(--card-bg);
            border-radius: 28px;
            overflow: auto;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            max-height: 500px;
            overflow-y: auto;
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { background: #f8fafc; position: sticky; top: 0; font-weight: 700; }
        .badge { padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }

        .section-title { font-size: 1.2rem; font-weight: 700; margin: 32px 0 20px 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            z-index: 200;
            display: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-muted);
        }
        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }

        @media (min-width: 768px) { body { padding-bottom: 0; } .bottom-nav { display: none; } }
        @media (max-width: 768px) { .desktop-nav { display: none; } .bottom-nav { display: flex; } .main-container { padding: 16px; padding-bottom: 80px; } .filters-bar { flex-direction: column; } }
    </style>
</head>

            <button class="select-all-btn" id="selectAllQirats">Select All</button>
            <button class="select-all-btn" id="deselectAllQirats" style="background:#64748b;">Deselect All</button>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;">

            <button class="export-btn export-word" id="advancedExportWord"><i class="fas fa-file-word"></i> Export Selected Qirats (Word - Multi-Table)</button>

            <thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Registration Date</th></tr></thead>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout, getCurrentAdminSync } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting to login');
    const admin = initAuthUI();
    setupAutoLogout(60);
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allStudents = [];
    let departments = [];
    let selectedDept = null;
    let currentFilteredStudents = [];
    let allQiratsList = [];
    let selectedQirats = new Set();
    
    const toast = document.getElementById('toast');
    
    function showToast(msg, isErr = false) { toast.textContent = msg; toast.style.background = isErr ? '#ef4444' : '#10b981'; toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 3000); }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allStudents = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp?.toDate?.() || new Date(data.timestamp) || new Date();
                allStudents.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || '',
                    telegram: data.telegram || '',
                    department: data.department || 'Other',
                    batch: data.batch || 'General',
                    schedules: data.schedules || [],
                    timestamp: timestamp
                });
            });
            calculateDepartmentStats();
            renderDepartments();
            buildQiratSelector();
        } catch (error) { showToast("Error: " + error.message, true); }
    }
    
    function buildQiratSelector() {
        const allQiratsSet = new Set();
        allStudents.forEach(s => getQiratNames(s).forEach(q => allQiratsSet.add(q)));
        allQiratsList = Array.from(allQiratsSet).sort();
        
        const container = document.getElementById('qiratSelector');
        const existingElements = container.querySelectorAll('.qirat-checkbox');
        existingElements.forEach(el => el.remove());
        
        allQiratsList.forEach(q => {
            const label = document.createElement('label');
            label.className = 'qirat-checkbox';
            label.innerHTML = `<input type="checkbox" value="${escapeHtml(q)}"> ${escapeHtml(q)}`;
            container.appendChild(label);
        });
        
        // Populate advanced department filter
        const deptFilter = document.getElementById('advancedDeptFilter');
        deptFilter.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)} (${d.total})</option>`).join('');
    }
    
    function calculateDepartmentStats() {
        const deptMap = new Map();
        allStudents.forEach(s => {
            const dept = s.department;
            if (!deptMap.has(dept)) deptMap.set(dept, { students: [], male: 0, female: 0, batches: new Set(), qirats: new Set() });
            const stat = deptMap.get(dept);
            stat.students.push(s);
            if (s.gender === 'Male') stat.male++;
            if (s.gender === 'Female') stat.female++;
            stat.batches.add(s.batch);
            getQiratNames(s).forEach(q => stat.qirats.add(q));
        });
        departments = Array.from(deptMap.entries()).map(([name, data]) => ({
            name, total: data.students.length, male: data.male, female: data.female,
            batchCount: data.batches.size, qiratCount: data.qirats.size, students: data.students
        })).sort((a, b) => b.total - a.total);
        
        const totalStudents = allStudents.length;
        const totalDepartments = departments.length;
        const avgPerDept = totalDepartments ? Math.round(totalStudents / totalDepartments) : 0;
        const multiEnrolled = allStudents.filter(s => getQiratNames(s).length > 1).length;
        
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-value">${totalStudents}</div><div class="stat-label">Total Students</div></div>
            <div class="stat-card"><div class="stat-value">${totalDepartments}</div><div class="stat-label">Departments</div></div>
            <div class="stat-card"><div class="stat-value">${avgPerDept}</div><div class="stat-label">Avg Students/Dept</div></div>
            <div class="stat-card"><div class="stat-value">${multiEnrolled}</div><div class="stat-label">Multi-Qirat Students</div></div>
        `;
    }
    
    function renderDepartments() {
        const container = document.getElementById('deptGrid');
        const maxTotal = Math.max(...departments.map(d => d.total), 1);
        container.innerHTML = departments.map(dept => `
            <div class="dept-card" onclick="selectDepartment('${escapeHtml(dept.name)}')">
                <div class="dept-header">
                    <span class="dept-name">🏛️ ${escapeHtml(dept.name)}</span>

    function applyStudentFilters() {
        const search = document.getElementById('studentSearch').value.toLowerCase();
        const gender = document.getElementById('studentGender').value;
        const batch = document.getElementById('studentBatch').value;
        const qirat = document.getElementById('studentQirat').value;
        
        currentFilteredStudents = selectedDept.students.filter(s => {
            const matchSearch = s.full_name.toLowerCase().includes(search) || s.phone.includes(search);
            const matchGender = !gender || s.gender === gender;
            const matchBatch = !batch || s.batch === batch;
            const matchQirat = !qirat || getQiratNames(s).includes(qirat);
            return matchSearch && matchGender && matchBatch && matchQirat;
        });
        
        document.getElementById('resultCount').textContent = `${currentFilteredStudents.length} students`;
        renderStudentTable();
    }
    
    function renderStudentTable() {
        const tbody = document.getElementById('studentTableBody');
        if (currentFilteredStudents.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No students found</td></tr>`; return; }
        tbody.innerHTML = currentFilteredStudents.map(s => `
            <tr>
                <td><strong>${escapeHtml(s.full_name)}</strong></td>
                <td><span class="badge ${s.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(s.gender)}</span></td>

                <td>${escapeHtml(s.batch)}</td>
                <td>${escapeHtml(getQiratNames(s).join(', ') || '-')}</td>
                <td>${s.timestamp.toLocaleDateString()}</td>
            </tr>
        `).join('');
    }
    
    function renderQiratInsights() {
        const qiratMap = new Map();
        selectedDept.students.forEach(s => {
            getQiratNames(s).forEach(q => {
                if (!qiratMap.has(q)) qiratMap.set(q, { students: [], count: 0 });
                qiratMap.get(q).students.push(s);
                qiratMap.get(q).count++;
            });
        });
        
        const insights = Array.from(qiratMap.entries()).map(([name, data]) => ({ name, count: data.count, students: data.students })).sort((a,b) => b.count - a.count);
        const container = document.getElementById('insightsGrid');
        if (insights.length === 0) { container.innerHTML = '<div class="empty-state">No Qirats in this department</div>'; return; }
        
        document.getElementById('insightDeptName').innerHTML = `for ${escapeHtml(selectedDept.name)}`;
        container.innerHTML = insights.map(insight => `
            <div class="insight-card">
                <div class="insight-header">

                    <span class="insight-value">${insight.count}</span>

    function getSelectedQirats() {
        const selected = [];
        document.querySelectorAll('.qirat-checkbox input:checked').forEach(cb => selected.push(cb.value));

    function getDepartmentFilter() { return document.getElementById('advancedDeptFilter').value; }
    
    function getDataForExport() {
        const selectedQirats = getSelectedQirats();
        const deptFilter = getDepartmentFilter();
        if (selectedQirats.length === 0) { showToast('Please select at least one Qirat', true); return null; }
        
        const result = {};
        selectedQirats.forEach(qirat => { result[qirat] = {}; });
        
        const targetDepartments = deptFilter ? departments.filter(d => d.name === deptFilter) : departments;
        
        targetDepartments.forEach(dept => {
            const deptStudents = dept.students;
            selectedQirats.forEach(qirat => {
                const studentsInQirat = deptStudents.filter(s => getQiratNames(s).includes(qirat));
                if (studentsInQirat.length > 0) {
                    result[qirat][dept.name] = studentsInQirat.map(s => ({
                        Name: s.full_name,
                        Gender: s.gender,
                        Phone: s.phone,
                        Department: s.department,
                        Batch: s.batch,
                        Qirats: getQiratNames(s).join(', '),
                        RegistrationDate: s.timestamp.toLocaleDateString()
                    }));
                }
            });
        });
        
        return result;
    }
    
    function formatWordWithTables(data, title, selectedQirats) {
        let html = `<!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>${title}</title>
            <style>
                body { font-family: 'Arial', sans-serif; margin: 40px; }

                .footer { margin-top: 40px; text-align: center; font-size: 10px; color: #64748b; border-top: 1px solid #ddd; padding-top: 20px; }
            </style>
        </head>
        <body>
            <h1>📊 JUMJ Irshad - Multi-Department Qirat Report</h1>
            <div class="header-info">
                <p><strong>Generated:</strong> ${new Date().toLocaleString()}</p>
                <p><strong>Selected Qirats:</strong> ${selectedQirats.join(', ')}</p>
                <p><strong>Departments Included:</strong> ${Object.keys(data[selectedQirats[0]] || {}).join(', ')}</p>
            </div>
        `;
        
        for (const qirat of selectedQirats) {
            const deptData = data[qirat];
            const deptNames = Object.keys(deptData);
            if (deptNames.length === 0) continue;
            
            let totalForQirat = 0;
            deptNames.forEach(d => { totalForQirat += deptData[d].length; });
            
            html += `<h2>📖 ${escapeHtml(qirat)}</h2>`;
            html += `<p style="margin-bottom: 15px;"><strong>Total Students:</strong> ${totalForQirat}</p>`;
            
            for (const deptName of deptNames) {
                const students = deptData[deptName];
                html += `<h3>🏛️ ${escapeHtml(deptName)} (${students.length} students)</h3>`;
                html += `<table><thead><tr><th>#</th><th>Name</th><th>Gender</th><th>Phone</th><th>Batch</th><th>Registration Date</th></tr></thead><tbody>`;
                students.forEach((s, idx) => {
                    html += `<tr><td>${idx + 1}</td><td>${escapeHtml(s.Name)}</td><td>${escapeHtml(s.Gender)}</td><td>${escapeHtml(s.Phone)}</td><td>${escapeHtml(s.Batch)}</td><td>${escapeHtml(s.RegistrationDate)}</td></tr>`;
                });
                html += `</tbody></table>`;
            }
        }
        
        html += `<div class="footer"><p>JUMJ Irshad Qirat Management System | Report Generated on ${new Date().toLocaleString()}</p></div></body></html>`;
        return html;
    }
    
    async function formatPDFWithTables(data, title, selectedQirats) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        
        doc.setFontSize(20);
        doc.setTextColor(16, 185, 129);
        doc.text("JUMJ Irshad - Multi-Department Qirat Report", 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 30);
        doc.text(`Selected Qirats: ${selectedQirats.join(', ')}`, 14, 37);
        
        let yPos = 50;
        
        for (const qirat of selectedQirats) {
            const deptData = data[qirat];
            const deptNames = Object.keys(deptData);
            if (deptNames.length === 0) continue;
            
            let totalForQirat = 0;
            deptNames.forEach(d => { totalForQirat += deptData[d].length; });
            
            if (yPos > 250) { doc.addPage(); yPos = 20; }
            
            doc.setFontSize(14);
            doc.setTextColor(5, 150, 105);
            doc.text(`📖 ${qirat} (Total: ${totalForQirat} students)`, 14, yPos);
            yPos += 8;
            
            for (const deptName of deptNames) {
                const students = deptData[deptName];
                if (students.length === 0) continue;
                
                if (yPos > 250) { doc.addPage(); yPos = 20; }
                
                doc.setFontSize(11);
                doc.setTextColor(0, 0, 0);
                doc.text(`🏛️ ${deptName} (${students.length} students)`, 14, yPos);
                yPos += 5;
                
                const tableData = students.map((s, idx) => [idx + 1, s.Name, s.Gender, s.Phone, s.Batch, s.RegistrationDate]);
                const result = doc.autoTable({
                    head: [['#', 'Name', 'Gender', 'Phone', 'Batch', 'Reg Date']],
                    body: tableData,
                    startY: yPos,
                    theme: 'striped',
                    headStyles: { fillColor: [16, 185, 129], textColor: [255, 255, 255] },
                    styles: { fontSize: 8, cellPadding: 2 },
                    margin: { left: 14, right: 14 }
                });
                yPos = result.lastAutoTable.finalY + 8;
            }
            yPos += 5;
        }
        
        return doc;
    }

    // Basic Export Functions
    function exportDataToCSV(data, filename) {
        const headers = ['Name', 'Gender', 'Phone', 'Department', 'Batch', 'Qirats', 'Date'];
        const rows = data.map(r => headers.map(h => `"${String(r[h] || '').replace(/"/g, '""')}"`).join(','));
        const blob = new Blob(["\uFEFF" + [headers.join(','), ...rows].join('\n')], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${filename}.csv`; a.click(); URL.revokeObjectURL(a.href);
    }
    
    function exportDataToExcel(data, sheetName) {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
        XLSX.writeFile(wb, `${sheetName}.xlsx`);
    }

        applyStudentFilters();
    });
    
    initNavigation();
    const adminUser = getCurrentAdminSync();
    if (adminUser?.role === 'super-admin') { setTimeout(() => refreshNavigation(), 100); }
    loadData();
    setInterval(loadData, 60000);
</script>
</body>
</html>
