<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Academic Performance | Exam Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-glow: rgba(99, 102, 241, 0.3);
        }
        body { background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; }
        .btn-premium { background: var(--accent-gradient); transition: all 0.3s ease; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .modal-enter { animation: modalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .status-badge { padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .view-btn.active { background: #6366f1; color: white; }
        .score-input { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.25rem 0.5rem; width: 70px; text-align: center; color: white; }
        .score-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px var(--primary-glow); }
        .score-input.editable { background: #2d3748; border-color: #6366f1; }
        .loading-spinner { border: 3px solid rgba(99, 102, 241, 0.3); border-top-color: #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .settings-card { transition: all 0.3s ease; }
        .settings-card:hover { background: rgba(99, 102, 241, 0.1); transform: translateX(4px); }
        .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #78350f; }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #1e293b; }
        .rank-3 { background: linear-gradient(135deg, #fdba74, #f97316); color: #7c2d12; }
        .rank-badge-sm { padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-7xl mx-auto mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Exam Performance</h1>
            <p class="text-slate-400 mt-1">Detailed analytics and score management</p>
        </div>
        <div class="flex gap-3 bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700">
            <button onclick="switchView('qirat')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all active">By Qirat</button>
            <button onclick="switchView('department')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all text-slate-400">By Department</button>
            <button onclick="switchView('general')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all text-slate-400">General</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <section id="general-stats" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10"></section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="glass-card p-6"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-line text-indigo-400 mr-2"></i> Performance Trend</h3><canvas id="trendChart" height="200"></canvas></div>
            <div class="glass-card p-6"><h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-pie text-purple-400 mr-2"></i> Score Distribution</h3><canvas id="distChart" height="200"></canvas></div>
        </div>

        <div class="glass-card p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]"><label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Search</label><input type="text" id="searchInput" placeholder="Name / Phone / ID..." class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500"></div>
                <div class="flex-1 min-w-[140px]"><label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Gender</label><select id="genderFilter" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                <div class="flex-1 min-w-[140px]"><label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Department</label><select id="deptFilter" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500"><option value="">All</option></select></div>
                <div class="flex-1 min-w-[140px]"><label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Batch</label><select id="batchFilter" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500"><option value="">All</option></select></div>
                <div class="flex-1 min-w-[140px]"><label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Qirat</label><select id="qiratFilter" class="w-full bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500"><option value="">All</option></select></div>
                <button onclick="clearFilters()" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 transition-all text-sm"><i class="fas fa-eraser mr-1"></i> Clear</button>
                <button onclick="toggleEditMode()" id="editModeBtn" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 transition-all"><i class="fas fa-edit mr-1"></i> Edit Mode</button>
                <button onclick="openSettingsModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-purple-600/30 hover:bg-purple-600/50 transition-all"><i class="fas fa-cog mr-1"></i> Settings</button>
                <button onclick="exportMainData()" class="px-4 py-2 rounded-xl text-sm font-medium bg-emerald-600/30 hover:bg-emerald-600/50 transition-all"><i class="fas fa-download mr-1"></i> Export</button>
            </div>
        </div>

        <div class="glass-card overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h3 id="table-title" class="text-xl font-semibold">Student Rankings by Qirat</h3>
                <div class="flex gap-2">
                    <button onclick="exportMainToCSV()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-csv"></i> CSV</button>
                    <button onclick="exportMainToExcel()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-excel"></i> Excel</button>
                    <button onclick="exportMainToPDF()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="exportMainToWord()" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-word"></i> Word</button>
                </div>
            </div>
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left" id="dataTable">
                    <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase tracking-wider"><tr id="tableHeader"></tr></thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50"><tr><td colspan="10" class="text-center py-8"><div class="loading-spinner mx-auto"></div><p class="mt-4 text-slate-400">Loading data...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="studentModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-6xl max-h-[90vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold" id="modalTitle">Student Scorecard</h2>
                <div class="flex gap-2"><button onclick="saveStudentScores()" id="saveStudentBtn" class="hidden px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm"><i class="fas fa-save mr-1"></i> Save Changes</button><button onclick="closeModal('studentModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button></div>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <div id="qiratModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-7xl max-h-[90vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold" id="qiratModalTitle">Qirat Performance</h2>
                <div class="flex gap-2">
                    <button onclick="exportModalToCSV('qiratModalContent')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-csv"></i> CSV</button>
                    <button onclick="exportModalToExcel('qiratModalContent')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-excel"></i> Excel</button>
                    <button onclick="exportModalToPDF('qiratModalContent', 'qirat_report')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="exportModalToWord('qiratModalContent', 'qirat_report')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-word"></i> Word</button>
                    <button onclick="closeModal('qiratModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            <div id="qiratModalContent" class="p-6 overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <div id="departmentModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-7xl max-h-[90vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold" id="deptModalTitle">Department Performance</h2>
                <div class="flex gap-2">
                    <button onclick="exportModalToCSV('deptModalContent')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-csv"></i> CSV</button>
                    <button onclick="exportModalToExcel('deptModalContent')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-excel"></i> Excel</button>
                    <button onclick="exportModalToPDF('deptModalContent', 'dept_report')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="exportModalToWord('deptModalContent', 'dept_report')" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs"><i class="fas fa-file-word"></i> Word</button>
                    <button onclick="closeModal('departmentModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            <div id="deptModalContent" class="p-6 overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-2xl max-h-[85vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold"><i class="fas fa-cog mr-2"></i> Assessment Settings</h2>
                <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="settingsContent" class="p-6 overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <div id="toast" class="toast hidden bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 shadow-xl"></div>

    <script type="module">
        import { protectPage, initAuthUI, setupAutoLogout } from './auth.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        if (!protectPage('admin-login.html')) throw new Error('Redirecting');
        initAuthUI();
        setupAutoLogout(60);
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allStudents = [];
        let examScores = new Map();
        let currentView = 'qirat';
        let isEditMode = false;
        let currentFilters = { search: '', gender: '', department: '', batch: '', qirat: '' };
        let charts = {};
        let currentStudentId = null;
        
        let assessmentConfig = { assessments: [{ name: "Quiz 1", outOf: 30 }, { name: "Mid Exam", outOf: 50 }, { name: "Assignment", outOf: 20 }, { name: "Final Exam", outOf: 100 }] };
        
        function showToast(message, isError = false) {
            const toastEl = document.getElementById('toast');
            toastEl.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toastEl.classList.remove('hidden');
            setTimeout(() => toastEl.classList.add('hidden'), 3000);
        }
        
        async function loadAssessmentConfig() {
            try { const configDoc = await getDocs(collection(db, "settings")); configDoc.forEach(doc => { if (doc.id === 'assessmentConfig') assessmentConfig = doc.data(); }); } catch(e) { console.warn(e); }
        }
        async function saveAssessmentConfig() { await setDoc(doc(db, "settings", "assessmentConfig"), assessmentConfig); showToast('Assessment settings saved to Firebase!'); }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
        function getStudentExamScores(studentId, qiratName) { const studentScores = examScores.get(studentId) || {}; return studentScores[qiratName] || {}; }
        function calculatePercentage(score, outOf) { if (score === null || score === '' || !outOf) return null; return Math.round((parseFloat(score) / outOf) * 100); }
        function calculateTotalPoints(scores) { let total = 0; for (let i = 0; i < assessmentConfig.assessments.length; i++) { const score = scores[`assessment${i+1}`]; if (score !== null && score !== '' && !isNaN(score)) total += parseFloat(score); } return total; }
        function calculateTotalPossible() { return assessmentConfig.assessments.reduce((sum, a) => sum + a.outOf, 0); }
        function calculateAverage(scores) { let totalPercent = 0, count = 0; for (let i = 0; i < assessmentConfig.assessments.length; i++) { const score = scores[`assessment${i+1}`]; if (score !== null && score !== '' && !isNaN(score)) { const percent = calculatePercentage(parseFloat(score), assessmentConfig.assessments[i].outOf); if (percent !== null) { totalPercent += percent; count++; } } } return count > 0 ? Math.round(totalPercent / count) : null; }
        function calculateStudentOverallAvg(studentId) { let total = 0, count = 0; const student = allStudents.find(s => s.id === studentId); if (student) { getQiratNames(student).forEach(q => { const scores = getStudentExamScores(studentId, q); const avg = calculateAverage(scores); if (avg !== null) { total += avg; count++; } }); } return count > 0 ? Math.round(total / count) : null; }
        
        function calculateRankInDepartment(studentId) {
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return null;
            const deptStudents = allStudents.filter(s => s.department === student.department);
            const ranked = deptStudents.map(s => ({ id: s.id, avg: calculateStudentOverallAvg(s.id) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
            return ranked.findIndex(s => s.id === studentId) + 1;
        }
        
        function calculateQiratRankInDepartment(studentId, qiratName) {
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return null;
            const deptStudents = allStudents.filter(s => s.department === student.department && getQiratNames(s).includes(qiratName));
            const ranked = deptStudents.map(s => ({ id: s.id, avg: calculateAverage(getStudentExamScores(s.id, qiratName)) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
            return ranked.findIndex(s => s.id === studentId) + 1;
        }
        
        function calculateQiratGlobalRank(studentId, qiratName) {
            const studentsInQirat = allStudents.filter(s => getQiratNames(s).includes(qiratName));
            const ranked = studentsInQirat.map(s => ({ id: s.id, avg: calculateAverage(getStudentExamScores(s.id, qiratName)) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
            return ranked.findIndex(s => s.id === studentId) + 1;
        }
        
        async function saveExamScore(studentId, qiratName, assessmentKey, value) {
            const currentScores = examScores.get(studentId) || {};
            const qiratScores = currentScores[qiratName] || {};
            qiratScores[assessmentKey] = value ? parseFloat(value) : null;
            currentScores[qiratName] = qiratScores;
            examScores.set(studentId, currentScores);
            const examRef = doc(db, "examScores", studentId);
            await setDoc(examRef, { scores: Object.fromEntries(examScores) }, { merge: true });
        }
        
        async function loadExamScores() {
            try { const snapshot = await getDocs(collection(db, "examScores")); examScores.clear(); snapshot.forEach(docSnap => { const data = docSnap.data(); if (data.scores) { Object.entries(data.scores).forEach(([studentId, studentData]) => { examScores.set(studentId, studentData); }); } }); } catch(e) { console.warn(e); }
        }
        
        async function loadData() {
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                allStudents = [];
                querySnapshot.forEach(docSnap => { const data = docSnap.data(); allStudents.push({ id: docSnap.id, full_name: data.full_name || 'N/A', gender: data.gender || 'Not Specified', phone: data.phone || '', department: data.department || 'Other', batch: data.batch || 'General', schedules: data.schedules || [] }); });
                await loadAssessmentConfig(); await loadExamScores();
                populateFilters(); renderStats(); renderCharts(); await renderCurrentView();
            } catch(e) { console.error(e); showToast('Error loading data', true); }
        }
        
        function populateFilters() {
            const departments = [...new Set(allStudents.map(s => s.department))];
            const batches = [...new Set(allStudents.map(s => s.batch))];
            const qirats = [...new Set(allStudents.flatMap(s => getQiratNames(s)))];
            document.getElementById('deptFilter').innerHTML = '<option value="">All</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
            document.getElementById('batchFilter').innerHTML = '<option value="">All</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
            document.getElementById('qiratFilter').innerHTML = '<option value="">All</option>' + qirats.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');
        }
        
        function applyFilters(students) {
            let filtered = [...students];
            if (currentFilters.search) { const search = currentFilters.search.toLowerCase(); filtered = filtered.filter(s => s.full_name.toLowerCase().includes(search) || s.phone.includes(search)); }
            if (currentFilters.gender) filtered = filtered.filter(s => s.gender === currentFilters.gender);
            if (currentFilters.department) filtered = filtered.filter(s => s.department === currentFilters.department);
            if (currentFilters.batch) filtered = filtered.filter(s => s.batch === currentFilters.batch);
            if (currentFilters.qirat) filtered = filtered.filter(s => getQiratNames(s).includes(currentFilters.qirat));
            return filtered;
        }
        
        function clearFilters() {
            document.getElementById('searchInput').value = ''; document.getElementById('genderFilter').value = ''; document.getElementById('deptFilter').value = ''; document.getElementById('batchFilter').value = ''; document.getElementById('qiratFilter').value = '';
            currentFilters = { search: '', gender: '', department: '', batch: '', qirat: '' }; renderCurrentView();
        }
        
        function renderStats() {
            const totalStudents = allStudents.length;
            let totalScore = 0, scoreCount = 0;
            examScores.forEach(studentScores => { Object.values(studentScores).forEach(qScores => { const avg = calculateAverage(qScores); if (avg !== null) { totalScore += avg; scoreCount++; } }); });
            const avgScore = scoreCount > 0 ? Math.round(totalScore / scoreCount) : 0;
            const completedExams = scoreCount;
            const allQirats = new Set(); allStudents.forEach(s => getQiratNames(s).forEach(q => allQirats.add(q)));
            document.getElementById('general-stats').innerHTML = `

                    return matchSearch && matchGender && matchBatch;
                });
                const ranked = filtered.map(s => ({ student: s, avg: calculateStudentOverallAvg(s.id) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
                document.getElementById('modalDeptTableBody').innerHTML = ranked.map((item, idx) => `<tr><td class="py-3"><span class="px-3 py-1 rounded-full ${idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'bg-slate-700'} text-xs font-bold">#${idx+1}</span><td class="py-3 font-medium">${escapeHtml(item.student.full_name)}<td class="py-3">${escapeHtml(item.student.batch)}<td class="py-3">${escapeHtml(item.student.gender)}<td class="py-3 text-center"><span class="text-emerald-400 font-semibold">${item.avg !== null ? item.avg+'%' : '-'}</span><td class="py-3 text-right"><button class="px-3 py-1 rounded-lg bg-indigo-600/30 text-xs" onclick="closeModal('departmentModal'); openStudentModal('${item.student.id}')">View Details</button></tr>`).join('');
            }
        };
        
        window.clearDeptModalFilters = () => {
            if (document.getElementById('modalDeptSearchInput')) document.getElementById('modalDeptSearchInput').value = '';
            if (document.getElementById('modalDeptGenderFilter')) document.getElementById('modalDeptGenderFilter').value = '';
            if (document.getElementById('modalDeptBatchFilter')) document.getElementById('modalDeptBatchFilter').value = '';
            applyDeptModalFilters();
        };
        
        // Export Functions for Modals
        window.exportModalToCSV = (contentId) => {
            const table = document.querySelector(`#${contentId} table`);
            if (!table) { showToast('No table found to export', true); return; }
            const ws = XLSX.utils.table_to_sheet(table);
            const csv = XLSX.utils.sheet_to_csv(ws);
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `export_${Date.now()}.csv`; link.click();
            showToast('CSV exported');
        };
        
        window.exportModalToExcel = (contentId) => {
            const table = document.querySelector(`#${contentId} table`);
            if (!table) { showToast('No table found to export', true); return; }
            const ws = XLSX.utils.table_to_sheet(table);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, `export_${Date.now()}.xlsx`);
            showToast('Excel exported');
        };
        
        window.exportModalToPDF = async (contentId, filename) => {
            const table = document.querySelector(`#${contentId} table`);
            if (!table) { showToast('No table found to export', true); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            doc.setFontSize(16); doc.setTextColor(99, 102, 241);
            doc.text(`Exam Report - ${filename}`, 14, 20);
            doc.setFontSize(10); doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 30);
            doc.autoTable({ html: table, startY: 40, styles: { fontSize: 8, textColor: [255, 255, 255], cellPadding: 3 }, headStyles: { fillColor: [99, 102, 241] } });
            doc.save(`${filename}_${Date.now()}.pdf`);
            showToast('PDF exported');
        };
        
        window.exportModalToWord = (contentId, filename) => {
            const table = document.querySelector(`#${contentId} table`);
            if (!table) { showToast('No table found to export', true); return; }
            const htmlContent = `<html><head><meta charset="UTF-8"><title>${filename}</title><style>body{font-family:Arial;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #ddd;padding:8px;} th{background:#6366f1;color:white;}</style></head><body><h1>${filename}</h1><p>Generated: ${new Date().toLocaleString()}</p>${table.outerHTML}</body></html>`;
            const blob = new Blob([htmlContent], { type: 'application/msword' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${filename}_${Date.now()}.doc`; link.click();
            showToast('Word document exported');
        };
        
        window.exportMainToCSV = () => { const ws = XLSX.utils.table_to_sheet(document.getElementById('dataTable')); const csv = XLSX.utils.sheet_to_csv(ws); const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `exam_main_${currentView}_${Date.now()}.csv`; link.click(); showToast('CSV exported'); };
        window.exportMainToExcel = () => { const ws = XLSX.utils.table_to_sheet(document.getElementById('dataTable')); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ExamData'); XLSX.writeFile(wb, `exam_main_${currentView}_${Date.now()}.xlsx`); showToast('Excel exported'); };
        window.exportMainToPDF = async () => { const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape' }); doc.setFontSize(16); doc.setTextColor(99, 102, 241); doc.text(`Exam Report - ${currentView.toUpperCase()} View`, 14, 20); doc.setFontSize(10); doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 30); doc.autoTable({ html: '#dataTable', startY: 40, styles: { fontSize: 8, textColor: [255, 255, 255], cellPadding: 3 }, headStyles: { fillColor: [99, 102, 241] } }); doc.save(`exam_main_${currentView}_${Date.now()}.pdf`); showToast('PDF exported'); };
        window.exportMainToWord = () => { const htmlContent = `<html><head><meta charset="UTF-8"><title>Exam Report</title><style>body{font-family:Arial;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #ddd;padding:8px;} th{background:#6366f1;color:white;}</style></head><body><h1>Exam Report - ${currentView.toUpperCase()} View</h1><p>Generated: ${new Date().toLocaleString()}</p>${document.getElementById('dataTable').outerHTML}</body></html>`; const blob = new Blob([htmlContent], { type: 'application/msword' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `exam_main_${currentView}_${Date.now()}.doc`; link.click(); showToast('Word document exported'); };
        window.exportMainData = () => window.exportMainToExcel();
        
        window.openSettingsModal = () => {
            document.getElementById('settingsContent').innerHTML = `<div class="mb-6"><div id="assessmentsList" class="space-y-3">${assessmentConfig.assessments.map((ass, idx) => `<div class="settings-card flex gap-3 items-center p-3 bg-slate-800/30 rounded-xl"><input type="text" class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg text-sm" placeholder="Assessment Name" value="${escapeHtml(ass.name)}" data-idx="${idx}" data-field="name"><div class="flex items-center gap-2"><span class="text-slate-400 text-sm">/</span><input type="number" class="w-24 bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg text-sm" placeholder="Max Points" value="${ass.outOf}" data-idx="${idx}" data-field="outOf" min="1" max="500"></div><button onclick="removeAssessment(${idx})" class="px-3 py-2 rounded-lg bg-red-600/30 hover:bg-red-600/50 text-sm"><i class="fas fa-trash"></i></button></div>`).join('')}</div><button onclick="addAssessment()" class="mt-4 px-4 py-2 rounded-lg bg-indigo-600/30 hover:bg-indigo-600/50 text-sm"><i class="fas fa-plus mr-1"></i> Add Assessment</button></div><div class="flex gap-3 justify-end pt-4 border-t border-slate-700"><button onclick="closeModal('settingsModal')" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">Cancel</button><button onclick="saveSettings()" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm"><i class="fas fa-save mr-1"></i> Save Settings</button></div>`;
            document.getElementById('settingsModal').classList.remove('hidden');
        };
        
        window.addAssessment = () => { assessmentConfig.assessments.push({ name: `New Assessment ${assessmentConfig.assessments.length + 1}`, outOf: 100 }); openSettingsModal(); };
        window.removeAssessment = (idx) => { assessmentConfig.assessments.splice(idx, 1); openSettingsModal(); };
        window.saveSettings = async () => {
            const inputs = document.querySelectorAll('#assessmentsList input');
            const newAssessments = []; const tempMap = {};
            inputs.forEach(input => { const idx = parseInt(input.dataset.idx); const field = input.dataset.field; if (!tempMap[idx]) tempMap[idx] = {}; tempMap[idx][field] = field === 'outOf' ? parseInt(input.value) : input.value; });
            for (let i = 0; i < Object.keys(tempMap).length; i++) { if (tempMap[i].name && tempMap[i].outOf) newAssessments.push({ name: tempMap[i].name, outOf: tempMap[i].outOf }); }
            assessmentConfig.assessments = newAssessments;
            await saveAssessmentConfig();
            closeModal('settingsModal');
            await loadExamScores();
            renderStats(); renderCharts(); await renderCurrentView();
            showToast('Assessment settings updated and saved to Firebase!');
        };
        
        window.saveStudentScores = async () => {
            if (!currentStudentId) return;
            const inputs = document.querySelectorAll('#modalContent .score-input');
            for (const input of inputs) { const qirat = input.dataset.qirat; const assessment = `assessment${input.dataset.assessment}`; const value = input.value; await saveExamScore(currentStudentId, qirat, assessment, value); }
            await loadExamScores();
            showToast('Scores saved to Firebase successfully!');
            openStudentModal(currentStudentId);
            renderCurrentView(); renderStats(); renderCharts();
        };
        
        window.toggleEditMode = () => {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editModeBtn');
            if (isEditMode) { btn.innerHTML = '<i class="fas fa-save mr-1"></i> Save Mode'; btn.classList.remove('bg-slate-700'); btn.classList.add('bg-emerald-600'); showToast('Edit mode enabled'); }
            else { btn.innerHTML = '<i class="fas fa-edit mr-1"></i> Edit Mode'; btn.classList.remove('bg-emerald-600'); btn.classList.add('bg-slate-700'); }
        };
        
        window.switchView = (view) => {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => { btn.classList.remove('active', 'bg-indigo-600', 'text-white'); btn.classList.add('text-slate-400'); });
            event.target.classList.add('active', 'bg-indigo-600', 'text-white');
            renderCurrentView();
        };
        
        window.closeModal = (id) => { document.getElementById(id).classList.add('hidden'); currentStudentId = null; };
        
        document.getElementById('searchInput').addEventListener('input', (e) => { currentFilters.search = e.target.value; renderCurrentView(); });
        document.getElementById('genderFilter').addEventListener('change', (e) => { currentFilters.gender = e.target.value; renderCurrentView(); });
        document.getElementById('deptFilter').addEventListener('change', (e) => { currentFilters.department = e.target.value; renderCurrentView(); });
        document.getElementById('batchFilter').addEventListener('change', (e) => { currentFilters.batch = e.target.value; renderCurrentView(); });
        document.getElementById('qiratFilter').addEventListener('change', (e) => { currentFilters.qirat = e.target.value; renderCurrentView(); });
        
        window.openStudentModal = openStudentModal;
        window.openQiratModal = openQiratModal;
        window.openDepartmentModal = openDepartmentModal;
        
        loadData();
    </script>
</body>
</html>
