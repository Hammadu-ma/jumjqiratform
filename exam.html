<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Academic Performance | Exam Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-glow: rgba(99, 102, 241, 0.3);
        }

        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
        }

        .btn-premium {
            background: var(--accent-gradient);
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .modal-enter {
            animation: modalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.2);
        }

        .status-badge.danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .view-btn.active {
            background: #6366f1;
            color: white;
        }

        .score-input {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.25rem 0.5rem;
            width: 70px;
            text-align: center;
            color: white;
        }

        .score-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .loading-spinner {
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-7xl mx-auto mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Exam Performance</h1>
            <p class="text-slate-400 mt-1">Detailed analytics and score management</p>
        </div>
        
        <div class="flex gap-3 bg-slate-800/50 p-1.5 rounded-2xl border border-slate-700">
            <button onclick="switchView('qirat')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all active">By Qirat</button>
            <button onclick="switchView('department')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all text-slate-400">By Department</button>
            <button onclick="switchView('general')" class="view-btn px-6 py-2 rounded-xl text-sm font-medium transition-all text-slate-400">General</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        
        <section id="general-stats" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <!-- Stats will be populated dynamically -->
        </section>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="glass-card p-6">
                <h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-line text-indigo-400 mr-2"></i> Performance Trend</h3>
                <canvas id="trendChart" height="200"></canvas>
            </div>
            <div class="glass-card p-6">
                <h3 class="text-lg font-semibold mb-4"><i class="fas fa-chart-pie text-purple-400 mr-2"></i> Score Distribution</h3>
                <canvas id="distChart" height="200"></canvas>
            </div>
        </div>

        <!-- Main Table Section -->
        <div class="glass-card overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h3 id="table-title" class="text-xl font-semibold">Student Rankings by Qirat</h3>
                <div class="flex gap-3">
                    <input type="text" id="searchInput" placeholder="Search students..." class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-sm focus:outline-none focus:border-indigo-500 w-64">
                    <button onclick="toggleEditMode()" id="editModeBtn" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 transition-all">
                        <i class="fas fa-edit mr-1"></i> Edit Mode
                    </button>
                    <button onclick="exportData()" class="px-4 py-2 rounded-xl text-sm font-medium bg-emerald-600/30 hover:bg-emerald-600/50 transition-all">
                        <i class="fas fa-download mr-1"></i> Export
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left" id="dataTable">
                    <thead class="bg-slate-800/50 text-slate-400 text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Rank</th>
                            <th class="px-6 py-4">Student Name</th>
                            <th class="px-6 py-4">Department</th>
                            <th class="px-6 py-4">Batch</th>
                            <th class="px-6 py-4">Qirats</th>
                            <th class="px-6 py-4">Avg Score</th>
                            <th class="px-6 py-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50">
                        <tr><td colspan="7" class="text-center py-8"><div class="loading-spinner mx-auto"></div><p class="mt-4 text-slate-400">Loading data...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Student Detail Modal -->
    <div id="studentModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-5xl max-h-[90vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold" id="modalTitle">Student Scorecard</h2>
                <button onclick="closeModal('studentModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modalContent" class="p-6 overflow-y-auto custom-scrollbar">
                <!-- Dynamic modal content -->
            </div>
        </div>
    </div>

    <!-- Qirat Detail Modal -->
    <div id="qiratModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-6xl max-h-[90vh] overflow-hidden modal-enter flex flex-col bg-slate-900">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/30">
                <h2 class="text-2xl font-bold" id="qiratModalTitle">Qirat Performance</h2>
                <button onclick="closeModal('qiratModal')" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="qiratModalContent" class="p-6 overflow-y-auto custom-scrollbar"></div>
        </div>
    </div>

    <script type="module">
        import { protectPage, initAuthUI, setupAutoLogout } from './auth.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        if (!protectPage('admin-login.html')) throw new Error('Redirecting');
        initAuthUI();
        setupAutoLogout(60);
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allStudents = [];
        let examScores = new Map();
        let currentView = 'qirat';
        let isEditMode = false;
        let currentGroupData = [];
        let charts = {};
        
        const assessmentNames = ['Quiz 1', 'Mid Exam', 'Assignment', 'Final Exam'];
        const assessmentOutOf = [30, 50, 20, 100];
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
        
        function getStudentExamScores(studentId, qiratName) { 
            const studentScores = examScores.get(studentId) || {}; 
            return studentScores[qiratName] || {}; 
        }
        
        function calculatePercentage(score, outOf) { 
            if (score === null || score === '' || !outOf) return null; 
            return Math.round((parseFloat(score) / outOf) * 100); 
        }
        
        function calculateAverage(scores) {
            let totalPercent = 0, count = 0;
            for (let i = 0; i < assessmentNames.length; i++) {
                const score = scores[`assessment${i+1}`];
                if (score !== null && score !== '' && !isNaN(score)) {
                    const percent = calculatePercentage(parseFloat(score), assessmentOutOf[i]);
                    if (percent !== null) { totalPercent += percent; count++; }
                }
            }
            return count > 0 ? Math.round(totalPercent / count) : null;
        }
        
        function calculateStudentOverallAvg(studentId) {
            let total = 0, count = 0;
            const student = allStudents.find(s => s.id === studentId);
            if (student) {
                getQiratNames(student).forEach(q => {
                    const scores = getStudentExamScores(studentId, q);
                    const avg = calculateAverage(scores);
                    if (avg !== null) { total += avg; count++; }
                });
            }
            return count > 0 ? Math.round(total / count) : null;
        }
        
        async function saveExamScore(studentId, qiratName, assessmentKey, value) {
            const currentScores = examScores.get(studentId) || {};
            const qiratScores = currentScores[qiratName] || {};
            qiratScores[assessmentKey] = value ? parseFloat(value) : null;
            currentScores[qiratName] = qiratScores;
            examScores.set(studentId, currentScores);
            const examRef = doc(db, "examScores", studentId);
            await setDoc(examRef, { scores: Object.fromEntries(examScores) }, { merge: true });
        }
        
        async function loadExamScores() {
            try {
                const snapshot = await getDocs(collection(db, "examScores"));
                examScores.clear();
                snapshot.forEach(docSnap => { 
                    const data = docSnap.data();
                    if (data.scores) { 
                        Object.entries(data.scores).forEach(([studentId, studentData]) => {
                            examScores.set(studentId, studentData);
                        });
                    }
                });
            } catch(e) { console.warn(e); }
        }
        
        async function loadData() {
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                allStudents = [];
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    allStudents.push({
                        id: docSnap.id, 
                        full_name: data.full_name || 'N/A', 
                        gender: data.gender || 'Not Specified',
                        phone: data.phone || '', 
                        department: data.department || 'Other', 
                        batch: data.batch || 'General',
                        schedules: data.schedules || []
                    });
                });
                await loadExamScores();
                renderStats();
                renderCharts();
                await renderCurrentView();
            } catch(e) { console.error(e); }
        }
        
        function renderStats() {
            const totalStudents = allStudents.length;
            let totalScore = 0, scoreCount = 0;
            examScores.forEach(studentScores => { 
                Object.values(studentScores).forEach(qScores => {
                    const avg = calculateAverage(qScores);
                    if (avg !== null) { totalScore += avg; scoreCount++; }
                });
            });
            const avgScore = scoreCount > 0 ? Math.round(totalScore / scoreCount) : 0;
            const completedExams = scoreCount;
            const allQirats = new Set(); allStudents.forEach(s => getQiratNames(s).forEach(q => allQirats.add(q)));
            
            document.getElementById('general-stats').innerHTML = `
                <div class="glass-card p-6">
                    <div class="text-slate-400 text-sm mb-2"><i class="fas fa-users mr-1"></i> Total Students</div>
                    <div class="text-3xl font-bold">${totalStudents}</div>
                    <div class="text-emerald-400 text-xs mt-2"><i class="fas fa-check-circle"></i> Active enrolled</div>
                </div>
                <div class="glass-card p-6">
                    <div class="text-slate-400 text-sm mb-2"><i class="fas fa-chart-line mr-1"></i> Average Score</div>
                    <div class="text-3xl font-bold">${avgScore}%</div>
                    <div class="w-full bg-slate-700 h-1.5 rounded-full mt-4">
                        <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${avgScore}%"></div>
                    </div>
                </div>
                <div class="glass-card p-6">
                    <div class="text-slate-400 text-sm mb-2"><i class="fas fa-book-quran mr-1"></i> Active Qirats</div>
                    <div class="text-3xl font-bold">${allQirats.size}</div>
                    <p class="text-xs text-slate-500 mt-2">Across ${allStudents.length} students</p>
                </div>
                <div class="glass-card p-6 border-indigo-500/30">
                    <div class="text-slate-400 text-sm mb-2"><i class="fas fa-file-alt mr-1"></i> Exam Records</div>
                    <div class="flex items-center gap-2">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                        </span>
                        <span class="text-xl font-semibold">${completedExams}</span>
                    </div>
                    <p class="text-xs text-slate-500 mt-3">Total exam submissions</p>
                </div>
            `;
        }
        
        function renderCharts() {
            const scores = [];
            examScores.forEach(studentScores => {
                Object.values(studentScores).forEach(qScores => {
                    const avg = calculateAverage(qScores);
                    if (avg !== null) scores.push(avg);
                });
            });
            
            const ranges = { '0-20': 0, '21-40': 0, '41-60': 0, '61-80': 0, '81-100': 0 };
            scores.forEach(s => {
                if (s <= 20) ranges['0-20']++;
                else if (s <= 40) ranges['21-40']++;
                else if (s <= 60) ranges['41-60']++;
                else if (s <= 80) ranges['61-80']++;
                else ranges['81-100']++;
            });
            
            if (charts.trend) charts.trend.destroy();
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            charts.trend = new Chart(trendCtx, {
                type: 'line',
                data: { labels: assessmentNames, datasets: [{ label: 'Average Score %', data: [72, 78, 84, 79], borderColor: '#6366f1', tension: 0.3, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.1)' }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });
            
            if (charts.dist) charts.dist.destroy();
            const distCtx = document.getElementById('distChart').getContext('2d');
            charts.dist = new Chart(distCtx, {
                type: 'doughnut',
                data: { labels: Object.keys(ranges), datasets: [{ data: Object.values(ranges), backgroundColor: ['#ef4444', '#f59e0b', '#eab308', '#10b981', '#6366f1'] }] },
                options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });
        }
        
        async function renderCurrentView() {
            if (currentView === 'qirat') await renderQiratView();
            else if (currentView === 'department') await renderDepartmentView();
            else await renderGeneralView();
        }
        
        async function renderQiratView() {
            const qiratMap = new Map();
            allStudents.forEach(s => {
                getQiratNames(s).forEach(q => {
                    if (!qiratMap.has(q)) qiratMap.set(q, []);
                    const avg = calculateStudentOverallAvg(s.id);
                    qiratMap.get(q).push({ ...s, overallAvg: avg });
                });
            });
            
            const groups = Array.from(qiratMap.entries()).map(([name, students]) => {
                const avgScore = students.reduce((sum, s) => sum + (s.overallAvg || 0), 0) / (students.filter(s => s.overallAvg).length || 1);
                return { name, students, avgScore: Math.round(avgScore), count: students.length };
            }).sort((a,b) => b.count - a.count);
            
            document.getElementById('table-title').innerHTML = '<i class="fas fa-book-quran mr-2"></i> Qirat Performance Groups';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = groups.map((group, idx) => `
                <tr class="hover:bg-white/5 transition-colors cursor-pointer" onclick="openQiratModal('${escapeHtml(group.name)}')">
                    <td class="px-6 py-4 font-medium">#${idx + 1}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold">${group.name.charAt(0)}</div>
                            <div><div class="font-medium">${escapeHtml(group.name)}</div><div class="text-xs text-slate-500">Qirat</div></div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-slate-300">-</td>
                    <td class="px-6 py-4 text-slate-300">-</td>
                    <td class="px-6 py-4"><span class="status-badge">${group.count} students</span></td>
                    <td class="px-6 py-4"><span class="text-emerald-400 font-semibold">${group.avgScore}%</span></td>
                    <td class="px-6 py-4"><button class="btn-premium px-4 py-2 rounded-lg text-xs font-semibold" onclick="event.stopPropagation(); openQiratModal('${escapeHtml(group.name)}')">View Details</button></td>
                </tr>
            `).join('');
        }
        
        async function renderDepartmentView() {
            const deptMap = new Map();
            allStudents.forEach(s => {
                if (!deptMap.has(s.department)) deptMap.set(s.department, []);
                const avg = calculateStudentOverallAvg(s.id);
                deptMap.get(s.department).push({ ...s, overallAvg: avg });
            });
            
            const groups = Array.from(deptMap.entries()).map(([name, students]) => {
                const avgScore = students.reduce((sum, s) => sum + (s.overallAvg || 0), 0) / (students.filter(s => s.overallAvg).length || 1);
                return { name, students, avgScore: Math.round(avgScore), count: students.length };
            }).sort((a,b) => b.count - a.count);
            
            document.getElementById('table-title').innerHTML = '<i class="fas fa-building mr-2"></i> Department Performance';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = groups.map((group, idx) => `
                <tr class="hover:bg-white/5 transition-colors cursor-pointer" onclick="openDepartmentModal('${escapeHtml(group.name)}')">
                    <td class="px-6 py-4 font-medium">#${idx + 1}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400 font-bold">${group.name.charAt(0)}</div>
                            <div><div class="font-medium">${escapeHtml(group.name)}</div><div class="text-xs text-slate-500">Department</div></div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-slate-300">-</td>
                    <td class="px-6 py-4 text-slate-300">-</td>
                    <td class="px-6 py-4"><span class="status-badge">${group.count} students</span></td>
                    <td class="px-6 py-4"><span class="text-emerald-400 font-semibold">${group.avgScore}%</span></td>
                    <td class="px-6 py-4"><button class="btn-premium px-4 py-2 rounded-lg text-xs font-semibold" onclick="event.stopPropagation(); openDepartmentModal('${escapeHtml(group.name)}')">View Students</button></td>
                </tr>
            `).join('');
        }
        
        async function renderGeneralView() {
            const studentsWithScores = allStudents.map(s => ({
                ...s,
                overallAvg: calculateStudentOverallAvg(s.id)
            })).sort((a,b) => (b.overallAvg || 0) - (a.overallAvg || 0));
            
            document.getElementById('table-title').innerHTML = '<i class="fas fa-trophy mr-2"></i> Overall Student Rankings';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = studentsWithScores.map((student, idx) => {
                const rankClass = idx === 0 ? 'text-yellow-400' : idx === 1 ? 'text-slate-400' : idx === 2 ? 'text-amber-600' : '';
                const avgScore = student.overallAvg || '-';
                return `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="px-6 py-4 font-medium ${rankClass}">#${idx + 1}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="h-10 w-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold">${student.full_name.charAt(0)}</div>
                                <div><div class="font-medium">${escapeHtml(student.full_name)}</div><div class="text-xs text-slate-500">ID: ${student.id.slice(0,8)}</div></div>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-slate-300">${escapeHtml(student.department)}</td>
                        <td class="px-6 py-4 text-slate-300">${escapeHtml(student.batch)}</td>
                        <td class="px-6 py-4"><span class="status-badge">${getQiratNames(student).length} Qirats</span></td>
                        <td class="px-6 py-4"><span class="text-emerald-400 font-semibold">${avgScore !== '-' ? avgScore + '%' : '-'}</span></td>
                        <td class="px-6 py-4"><button class="btn-premium px-4 py-2 rounded-lg text-xs font-semibold" onclick="openStudentModal('${student.id}')">View Analytics</button></td>
                    </tr>
                `;
            }).join('');
        }
        
        window.openStudentModal = async (studentId) => {
            const student = allStudents.find(s => s.id === studentId);
            if (!student) return;
            const qirats = getQiratNames(student);
            const overallAvg = calculateStudentOverallAvg(studentId);
            
            let qiratDetails = '';
            for (const q of qirats) {
                const scores = getStudentExamScores(studentId, q);
                const avg = calculateAverage(scores);
                qiratDetails += `
                    <div class="bg-slate-800/30 rounded-xl p-4 mb-4">
                        <h4 class="font-semibold text-indigo-400 mb-3"><i class="fas fa-book-quran mr-2"></i> ${escapeHtml(q)}</h4>
                        <div class="grid grid-cols-4 gap-3">
                            ${assessmentNames.map((name, i) => {
                                const score = scores[`assessment${i+1}`];
                                const percent = calculatePercentage(score, assessmentOutOf[i]);
                                return `<div class="text-center"><div class="text-xs text-slate-400">${name}</div><div class="font-semibold">${score !== null ? score : '-'}<span class="text-xs text-slate-500">/${assessmentOutOf[i]}</span></div><div class="text-xs ${percent >= 70 ? 'text-emerald-400' : 'text-yellow-400'}">${percent ? percent+'%' : ''}</div></div>`;
                            }).join('')}
                            <div class="text-center"><div class="text-xs text-slate-400">Average</div><div class="font-bold text-indigo-400">${avg !== null ? avg+'%' : '-'}</div></div>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('modalTitle').innerHTML = `<i class="fas fa-user-graduate mr-2"></i> ${escapeHtml(student.full_name)}`;
            document.getElementById('modalContent').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-800/50 p-4 rounded-xl text-center"><p class="text-xs text-slate-400">Department</p><p class="font-semibold">${escapeHtml(student.department)}</p></div>
                    <div class="bg-slate-800/50 p-4 rounded-xl text-center"><p class="text-xs text-slate-400">Batch</p><p class="font-semibold">${escapeHtml(student.batch)}</p></div>
                    <div class="bg-slate-800/50 p-4 rounded-xl text-center"><p class="text-xs text-slate-400">Overall Average</p><p class="text-2xl font-bold text-indigo-400">${overallAvg !== null ? overallAvg+'%' : '-'}</p></div>
                </div>
                <h3 class="font-semibold mb-3">Qirat Performance</h3>
                ${qiratDetails || '<p class="text-slate-400">No exam records found</p>'}
                ${isEditMode ? `<div class="mt-4 text-center text-slate-400 text-sm"><i class="fas fa-info-circle mr-1"></i> Edit mode active - click scores to modify</div>` : ''}
            `;
            document.getElementById('studentModal').classList.remove('hidden');
        };
        
        window.openQiratModal = (qiratName) => {
            const studentsInQirat = allStudents.filter(s => getQiratNames(s).includes(qiratName));
            const ranked = studentsInQirat.map(s => ({ student: s, avg: calculateStudentOverallAvg(s.id) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
            
            document.getElementById('qiratModalTitle').innerHTML = `<i class="fas fa-book-quran mr-2"></i> ${escapeHtml(qiratName)} - Student Rankings`;
            document.getElementById('qiratModalContent').innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-slate-400 border-b border-slate-700">
                            <tr><th class="py-3 text-left">Rank</th><th class="py-3 text-left">Student</th><th class="py-3 text-left">Department</th><th class="py-3 text-center">Avg Score</th><th class="py-3 text-right">Actions</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${ranked.map((item, idx) => `
                                <tr><td class="py-3">#${idx+1}</td><td class="py-3 font-medium">${escapeHtml(item.student.full_name)}</td><td class="py-3">${escapeHtml(item.student.department)}</td><td class="py-3 text-center"><span class="text-emerald-400 font-semibold">${item.avg !== null ? item.avg+'%' : '-'}</span></td><td class="py-3 text-right"><button class="px-3 py-1 rounded-lg bg-indigo-600/30 text-xs" onclick="closeModal('qiratModal'); openStudentModal('${item.student.id}')">View</button></td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('qiratModal').classList.remove('hidden');
        };
        
        window.openDepartmentModal = (deptName) => {
            const students = allStudents.filter(s => s.department === deptName);
            const ranked = students.map(s => ({ student: s, avg: calculateStudentOverallAvg(s.id) })).sort((a,b) => (b.avg || 0) - (a.avg || 0));
            
            document.getElementById('qiratModalTitle').innerHTML = `<i class="fas fa-building mr-2"></i> ${escapeHtml(deptName)} - Students`;
            document.getElementById('qiratModalContent').innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-slate-400 border-b border-slate-700">
                            <tr><th class="py-3 text-left">Rank</th><th class="py-3 text-left">Student</th><th class="py-3 text-left">Batch</th><th class="py-3 text-center">Avg Score</th><th class="py-3 text-right">Actions</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800">
                            ${ranked.map((item, idx) => `
                                <tr><td class="py-3">#${idx+1}</td><td class="py-3 font-medium">${escapeHtml(item.student.full_name)}</td><td class="py-3">${escapeHtml(item.student.batch)}</span></td><td class="py-3 text-center"><span class="text-emerald-400 font-semibold">${item.avg !== null ? item.avg+'%' : '-'}</span></td><td class="py-3 text-right"><button class="px-3 py-1 rounded-lg bg-indigo-600/30 text-xs" onclick="closeModal('qiratModal'); openStudentModal('${item.student.id}')">View</button></td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('qiratModal').classList.remove('hidden');
        };
        
        window.toggleEditMode = () => {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editModeBtn');
            if (isEditMode) {
                btn.innerHTML = '<i class="fas fa-save mr-1"></i> Save Mode';
                btn.classList.remove('bg-slate-700');
                btn.classList.add('bg-emerald-600');
            } else {
                btn.innerHTML = '<i class="fas fa-edit mr-1"></i> Edit Mode';
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-slate-700');
            }
        };
        
        window.exportData = () => {
            const data = allStudents.map(s => ({
                Name: s.full_name,
                Department: s.department,
                Batch: s.batch,
                Qirats: getQiratNames(s).join(', '),
                OverallAvg: calculateStudentOverallAvg(s.id) || '-'
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'StudentPerformance');
            XLSX.writeFile(wb, `exam_report_${new Date().toISOString().slice(0,19)}.xlsx`);
        };
        
        window.switchView = (view) => {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-indigo-600', 'text-white');
                btn.classList.add('text-slate-400');
            });
            event.target.classList.add('active', 'bg-indigo-600', 'text-white');
            renderCurrentView();
        };
        
        window.closeModal = (id) => {
            document.getElementById(id).classList.add('hidden');
        };
        
        // Make functions global
        window.openStudentModal = openStudentModal;
        window.openQiratModal = openQiratModal;
        window.openDepartmentModal = openDepartmentModal;
        
        loadData();
    </script>
</body>
</html>
