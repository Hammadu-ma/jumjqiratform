<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Exam Marks Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .desktop-nav {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .nav-link {
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover { background: var(--primary-light); color: var(--primary-dark); }
        .nav-link.active { background: linear-gradient(135deg, #10b981, #059669); color: white; }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Group Mode Selector */
        .group-mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 12px 28px;
            border: none;
            background: var(--card-bg);
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        /* Groups Grid */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .group-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .group-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .group-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .group-stats {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.5s;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 28px;
            max-width: 1300px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--primary-light);
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .exam-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .exam-table th, .exam-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .exam-table th {
            background: #f8fafc;
            font-weight: 700;
            position: sticky;
            top: 0;
        }
        .score-input {
            width: 70px;
            padding: 6px 8px;
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            font-family: inherit;
        }
        .score-input:focus { outline: none; border-color: var(--primary); }
        .save-score-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .rank-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .rank-badge.top1 { background: #fbbf24; color: #78350f; }
        .rank-badge.top2 { background: #e5e7eb; color: #374151; }
        .rank-badge.top3 { background: #fdba74; color: #7c2d12; }

        /* Qirat Selector Modal */
        .qirat-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .qirat-btn {
            background: var(--border);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qirat-btn.active {
            background: var(--primary);
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            z-index: 200;
            display: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-muted);
        }
        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }

        @media (min-width: 768px) { body { padding-bottom: 0; } .bottom-nav { display: none; } }
        @media (max-width: 768px) { .desktop-nav { display: none; } .bottom-nav { display: flex; } .main-container { padding: 16px; padding-bottom: 80px; } .groups-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-graduation-cap"></i> Exam Marks Management</h1></div>
        <div class="desktop-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="groups.html" class="nav-link">Groups</a>
            <a href="tables.html" class="nav-link">Tables</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
            <a href="exam.html" class="nav-link active">Exam Marks</a>
            <a href="import.html" class="nav-link">Import</a>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="group-mode-selector">
        <button class="mode-btn active" data-mode="qirat"><i class="fas fa-book-quran"></i> By Qirat</button>
        <button class="mode-btn" data-mode="department"><i class="fas fa-building"></i> By Department</button>
        <button class="mode-btn" data-mode="overall"><i class="fas fa-chart-line"></i> Overall Ranking</button>
    </div>

    <div class="groups-grid" id="groupsGrid"></div>
</div>

<div id="examModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Exam Scores</div>
            <button class="close-modal" onclick="closeExamModal()">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="qiratSelectorModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="qiratModalTitle">Select Qirat</div>
            <button class="close-modal" onclick="closeQiratSelectorModal()">&times;</button>
        </div>
        <div id="qiratSelectorBody"></div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nav-item" onclick="window.location.href='groups.html'"><i class="fas fa-layer-group"></i><span>Groups</span></button>
    <button class="nav-item" onclick="window.location.href='tables.html'"><i class="fas fa-table"></i><span>Tables</span></button>
    <button class="nav-item" onclick="window.location.href='analytics.html'"><i class="fas fa-chart-line"></i><span>Analytics</span></button>
    <button class="nav-item active" onclick="window.location.href='exam.html'"><i class="fas fa-graduation-cap"></i><span>Exam</span></button>
    <button class="nav-item" onclick="window.location.href='import.html'"><i class="fas fa-upload"></i><span>Import</span></button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout, getCurrentAdminSync } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting');
    const admin = initAuthUI();
    setupAutoLogout(60);
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allStudents = [];
    let examScores = new Map(); // studentId -> { qiratName: { assessment1, assessment2, ... } }
    let currentGroupMode = 'qirat';
    let groups = [];
    let currentDepartmentData = null;
    let currentStudentQirats = [];
    
    const toast = document.getElementById('toast');
    
    function showToast(msg, isErr = false) {
        toast.textContent = msg;
        toast.style.background = isErr ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function getQiratNames(student) {
        return (student.schedules || []).map(s => s.qirat_name).filter(Boolean);
    }
    
    function getStudentExamScores(studentId, qiratName) {
        const studentScores = examScores.get(studentId) || {};
        return studentScores[qiratName] || { assessment1: null, assessment2: null, assessment3: null, assessment4: null, assessment5: null };
    }
    
    function calculateAverage(scores) {
        const values = Object.values(scores).filter(v => v !== null && v !== '' && !isNaN(v));
        if (values.length === 0) return null;
        const sum = values.reduce((a, b) => a + parseFloat(b), 0);
        return Math.round((sum / values.length) * 10) / 10;
    }
    
    async function saveExamScore(studentId, qiratName, assessmentKey, value) {
        const currentScores = examScores.get(studentId) || {};
        const qiratScores = currentScores[qiratName] || {};
        qiratScores[assessmentKey] = value ? parseFloat(value) : null;
        currentScores[qiratName] = qiratScores;
        examScores.set(studentId, currentScores);
        
        // Save to Firestore
        const examRef = doc(db, "examScores", studentId);
        await setDoc(examRef, { scores: Object.fromEntries(examScores) }, { merge: true });
        showToast('Score saved');
    }
    
    async function loadExamScores() {
        try {
            const snapshot = await getDocs(collection(db, "examScores"));
            examScores.clear();
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.scores) {
                    const scoresMap = new Map();
                    Object.entries(data.scores).forEach(([studentId, studentData]) => {
                        scoresMap.set(studentId, studentData);
                    });
                    scoresMap.forEach((v, k) => examScores.set(k, v));
                }
            });
        } catch (error) { console.error("Error loading exam scores:", error); }
    }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allStudents = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp?.toDate?.() || new Date(data.timestamp) || new Date();
                allStudents.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || '',
                    department: data.department || 'Other',
                    batch: data.batch || 'General',
                    schedules: data.schedules || [],
                    timestamp: timestamp
                });
            });
            await loadExamScores();
            buildGroups();
            renderStats();
        } catch (error) { showToast("Error: " + error.message, true); }
    }
    
    function renderStats() {
        const totalStudents = allStudents.length;
        const allQirats = new Set();
        allStudents.forEach(s => getQiratNames(s).forEach(q => allQirats.add(q)));
        const totalQirats = allQirats.size;
        let totalExams = 0;
        examScores.forEach(studentScores => {
            Object.values(studentScores).forEach(qiratScores => {
                if (Object.values(qiratScores).some(v => v !== null)) totalExams++;
            });
        });
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-value">${totalStudents}</div><div class="stat-label">Students</div></div>
            <div class="stat-card"><div class="stat-value">${totalQirats}</div><div class="stat-label">Active Qirats</div></div>
            <div class="stat-card"><div class="stat-value">${totalExams}</div><div class="stat-label">Exam Records</div></div>
            <div class="stat-card"><div class="stat-value">${Math.round((totalExams / (totalStudents * totalQirats || 1)) * 100)}%</div><div class="stat-label">Completion Rate</div></div>
        `;
    }
    
    function buildGroups() {
        if (currentGroupMode === 'qirat') {
            const qiratMap = new Map();
            allStudents.forEach(student => {
                getQiratNames(student).forEach(qirat => {
                    if (!qiratMap.has(qirat)) qiratMap.set(qirat, []);
                    qiratMap.get(qirat).push(student);
                });
            });
            groups = Array.from(qiratMap.entries()).map(([name, students]) => ({
                name, students, count: students.length,
                avgScore: calculateGroupAverageScore(name, students)
            })).sort((a, b) => b.count - a.count);
        } else if (currentGroupMode === 'department') {
            const deptMap = new Map();
            allStudents.forEach(student => {
                const dept = student.department;
                if (!deptMap.has(dept)) deptMap.set(dept, []);
                deptMap.get(dept).push(student);
            });
            groups = Array.from(deptMap.entries()).map(([name, students]) => ({
                name, students, count: students.length,
                avgScore: calculateDepartmentAverageScore(students)
            })).sort((a, b) => b.count - a.count);
        } else {
            // Overall ranking - all students
            const studentScores = allStudents.map(student => ({
                student,
                avgScore: calculateStudentOverallAverage(student.id)
            })).sort((a, b) => (b.avgScore || 0) - (a.avgScore || 0));
            groups = [{ name: "All Students", students: allStudents, rankings: studentScores, count: allStudents.length }];
        }
        renderGroups();
    }
    
    function calculateGroupAverageScore(qiratName, students) {
        let total = 0;
        let count = 0;
        students.forEach(student => {
            const scores = getStudentExamScores(student.id, qiratName);
            const avg = calculateAverage(scores);
            if (avg !== null) { total += avg; count++; }
        });
        return count > 0 ? Math.round(total / count) : 0;
    }
    
    function calculateDepartmentAverageScore(students) {
        let total = 0;
        let count = 0;
        students.forEach(student => {
            const qirats = getQiratNames(student);
            let studentTotal = 0;
            let studentCount = 0;
            qirats.forEach(qirat => {
                const scores = getStudentExamScores(student.id, qirat);
                const avg = calculateAverage(scores);
                if (avg !== null) { studentTotal += avg; studentCount++; }
            });
            if (studentCount > 0) { total += (studentTotal / studentCount); count++; }
        });
        return count > 0 ? Math.round(total / count) : 0;
    }
    
    function calculateStudentOverallAverage(studentId) {
        let total = 0;
        let count = 0;
        const student = allStudents.find(s => s.id === studentId);
        if (student) {
            const qirats = getQiratNames(student);
            qirats.forEach(qirat => {
                const scores = getStudentExamScores(studentId, qirat);
                const avg = calculateAverage(scores);
                if (avg !== null) { total += avg; count++; }
            });
        }
        return count > 0 ? Math.round(total / count) : null;
    }
    
    function renderGroups() {
        const container = document.getElementById('groupsGrid');
        if (groups.length === 0) { container.innerHTML = '<div class="empty-state">No data available</div>'; return; }
        
        const maxCount = Math.max(...groups.map(g => g.count), 1);
        container.innerHTML = groups.map((group, idx) => `
            <div class="group-card" onclick="openGroupModal('${escapeHtml(group.name)}', ${idx})">
                <div class="group-header">
                    <span class="group-name"><i class="fas ${currentGroupMode === 'qirat' ? 'fa-book-quran' : (currentGroupMode === 'department' ? 'fa-building' : 'fa-trophy')}"></i> ${escapeHtml(group.name)}</span>
                    <span class="rank-badge ${idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : ''}">${group.avgScore || 0}% Avg</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${(group.count / maxCount) * 100}%;"></div></div>
                <div class="group-stats">
                    <span><i class="fas fa-users"></i> ${group.count} students</span>
                    <span><i class="fas fa-chart-line"></i> Avg: ${group.avgScore || 0}%</span>
                </div>
                <div style="margin-top: 12px; font-size:0.7rem; color:var(--text-muted);">Click to manage exam scores</div>
            </div>
        `).join('');
    }
    
    window.openGroupModal = async (groupName, idx) => {
        const group = groups[idx];
        if (!group) return;
        
        if (currentGroupMode === 'qirat') {
            await openQiratModal(group.name, group.students);
        } else if (currentGroupMode === 'department') {
            currentDepartmentData = { name: group.name, students: group.students };
            await openDepartmentModal(group.name, group.students);
        } else {
            await openOverallModal(group.rankings);
        }
    };
    
    async function openQiratModal(qiratName, students) {
        const assessmentColumns = ['assessment1', 'assessment2', 'assessment3', 'assessment4', 'assessment5'];
        const columnNames = ['Exam 1', 'Exam 2', 'Exam 3', 'Exam 4', 'Exam 5'];
        
        let studentRows = '';
        for (const student of students) {
            const scores = getStudentExamScores(student.id, qiratName);
            const avg = calculateAverage(scores);
            studentRows += `
                <tr data-student="${student.id}" data-qirat="${qiratName}">
                    <td><strong>${escapeHtml(student.full_name)}</strong></td>
                    <td>${escapeHtml(student.department)}</td>
                    <td>${escapeHtml(student.batch)}</td>
                    ${assessmentColumns.map((col, idx) => `
                        <td><input type="number" class="score-input" data-assessment="${col}" value="${scores[col] !== null ? scores[col] : ''}" step="0.5" min="0" max="100" style="width:70px;"></td>
                    `).join('')}
                    <td id="avg-${student.id}-${qiratName.replace(/[^a-z0-9]/gi, '_')}">${avg !== null ? avg : '-'}</td>
                </tr>
            `;
        }
        
        const html = `
            <div style="margin-bottom: 16px; padding: 12px; background: #f0fdf4; border-radius: 16px;">
                <strong>📊 Group Statistics:</strong> Total Students: ${students.length} | Average Score: ${calculateGroupAverageScore(qiratName, students)}%
            </div>
            <div style="overflow-x: auto;">
                <table class="exam-table">
                    <thead>
                        <tr><th>Student</th><th>Department</th><th>Batch</th>${columnNames.map(n => `<th>${n}</th>`).join('')}<th>Average</th>
                    </thead>
                    <tbody>${studentRows}</tbody>
                </table>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <button class="save-score-btn" onclick="saveAllScoresInModal('${qiratName}')" style="padding: 10px 24px;">Save All Changes</button>
            </div>
        `;
        
        document.getElementById('modalTitle').innerHTML = `📖 ${escapeHtml(qiratName)} - Exam Scores`;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('examModal').classList.add('active');
        
        // Attach auto-save to individual inputs
        document.querySelectorAll('.score-input').forEach(input => {
            input.addEventListener('change', (e) => {
                const row = input.closest('tr');
                const studentId = row.dataset.student;
                const qirat = row.dataset.qirat;
                const assessment = input.dataset.assessment;
                const value = input.value;
                saveExamScore(studentId, qirat, assessment, value);
                updateAverageDisplay(studentId, qirat);
            });
        });
    }
    
    window.saveAllScoresInModal = async (qiratName) => {
        const inputs = document.querySelectorAll('.score-input');
        for (const input of inputs) {
            const row = input.closest('tr');
            const studentId = row.dataset.student;
            const qirat = row.dataset.qirat;
            const assessment = input.dataset.assessment;
            const value = input.value;
            await saveExamScore(studentId, qirat, assessment, value);
        }
        showToast('All scores saved');
        await loadExamScores();
        buildGroups();
        renderStats();
        // Refresh modal
        const group = groups.find(g => g.name === qiratName);
        if (group) await openQiratModal(qiratName, group.students);
    };
    
    function updateAverageDisplay(studentId, qiratName) {
        const scores = getStudentExamScores(studentId, qiratName);
        const avg = calculateAverage(scores);
        const avgId = `avg-${studentId}-${qiratName.replace(/[^a-z0-9]/gi, '_')}`;
        const avgCell = document.getElementById(avgId);
        if (avgCell) avgCell.textContent = avg !== null ? avg : '-';
    }
    
    async function openDepartmentModal(deptName, students) {
        // Get all unique Qirats across department
        const allQirats = new Set();
        students.forEach(s => getQiratNames(s).forEach(q => allQirats.add(q)));
        const qiratList = Array.from(allQirats).sort();
        
        const html = `
            <div style="margin-bottom: 20px;">
                <div class="qirat-selector" id="deptQiratSelector">
                    ${qiratList.map(q => `<button class="qirat-btn" data-qirat="${escapeHtml(q)}">📖 ${escapeHtml(q)}</button>`).join('')}
                </div>
                <div id="deptExamTable"></div>
            </div>
        `;
        document.getElementById('qiratModalTitle').innerHTML = `🏛️ ${escapeHtml(deptName)} - Select Qirat`;
        document.getElementById('qiratSelectorBody').innerHTML = html;
        document.getElementById('qiratSelectorModal').classList.add('active');
        
        document.querySelectorAll('#deptQiratSelector .qirat-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('#deptQiratSelector .qirat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const selectedQirat = btn.dataset.qirat;
                await renderDepartmentQiratTable(students, selectedQirat, deptName);
            });
        });
        if (qiratList[0]) await renderDepartmentQiratTable(students, qiratList[0], deptName);
    }
    
    async function renderDepartmentQiratTable(students, qiratName, deptName) {
        const assessmentColumns = ['assessment1', 'assessment2', 'assessment3', 'assessment4', 'assessment5'];
        const columnNames = ['Exam 1', 'Exam 2', 'Exam 3', 'Exam 4', 'Exam 5'];
        
        // Filter students who take this Qirat
        const qiratStudents = students.filter(s => getQiratNames(s).includes(qiratName));
        
        let studentRows = '';
        for (const student of qiratStudents) {
            const scores = getStudentExamScores(student.id, qiratName);
            const avg = calculateAverage(scores);
            studentRows += `
                <tr data-student="${student.id}" data-qirat="${qiratName}">
                    <td><strong>${escapeHtml(student.full_name)}</strong></td>
                    <td>${escapeHtml(student.department)}</td>
                    <td>${escapeHtml(student.batch)}</td>
                    ${assessmentColumns.map((col, idx) => `
                        <td><input type="number" class="score-input-dept" data-assessment="${col}" value="${scores[col] !== null ? scores[col] : ''}" step="0.5" min="0" max="100" style="width:70px;"></td>
                    `).join('')}
                    <td id="dept-avg-${student.id}-${qiratName.replace(/[^a-z0-9]/gi, '_')}">${avg !== null ? avg : '-'}</td>
                </tr>
            `;
        }
        
        const container = document.getElementById('deptExamTable');
        container.innerHTML = `
            <div style="margin-bottom: 16px; padding: 12px; background: #f0fdf4; border-radius: 16px;">
                <strong>📊 ${escapeHtml(qiratName)} Statistics:</strong> Students: ${qiratStudents.length} | Average: ${calculateGroupAverageScore(qiratName, qiratStudents)}%
            </div>
            <div style="overflow-x: auto;">
                <table class="exam-table">
                    <thead><tr><th>Student</th><th>Department</th><th>Batch</th>${columnNames.map(n => `<th>${n}</th>`).join('')}<th>Average</th></tr></thead>
                    <tbody>${studentRows}</tbody>
                </table>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <button class="save-score-btn" onclick="saveAllDeptScores('${qiratName}')" style="padding: 10px 24px;">Save All Changes</button>
            </div>
        `;
        
        document.querySelectorAll('.score-input-dept').forEach(input => {
            input.addEventListener('change', async (e) => {
                const row = input.closest('tr');
                const studentId = row.dataset.student;
                const qirat = row.dataset.qirat;
                const assessment = input.dataset.assessment;
                const value = input.value;
                await saveExamScore(studentId, qirat, assessment, value);
                updateDeptAverageDisplay(studentId, qirat);
            });
        });
    }
    
    window.saveAllDeptScores = async (qiratName) => {
        const inputs = document.querySelectorAll('.score-input-dept');
        for (const input of inputs) {
            const row = input.closest('tr');
            const studentId = row.dataset.student;
            const qirat = row.dataset.qirat;
            const assessment = input.dataset.assessment;
            const value = input.value;
            await saveExamScore(studentId, qirat, assessment, value);
        }
        showToast('All scores saved');
        await loadExamScores();
        buildGroups();
    };
    
    function updateDeptAverageDisplay(studentId, qiratName) {
        const scores = getStudentExamScores(studentId, qiratName);
        const avg = calculateAverage(scores);
        const avgId = `dept-avg-${studentId}-${qiratName.replace(/[^a-z0-9]/gi, '_')}`;
        const avgCell = document.getElementById(avgId);
        if (avgCell) avgCell.textContent = avg !== null ? avg : '-';
    }
    
    async function openOverallModal(rankings) {
        const assessmentColumns = ['assessment1', 'assessment2', 'assessment3', 'assessment4', 'assessment5'];
        const columnNames = ['Exam 1', 'Exam 2', 'Exam 3', 'Exam 4', 'Exam 5'];
        
        let studentRows = '';
        rankings.forEach((item, idx) => {
            const student = item.student;
            const overallAvg = item.avgScore;
            studentRows += `
                <tr>
                    <td><span class="rank-badge ${idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : ''}">${idx + 1}</span></td>
                    <td><strong>${escapeHtml(student.full_name)}</strong></td>
                    <td>${escapeHtml(student.department)}</td>
                    <td>${escapeHtml(student.batch)}</span></td>
                    <td><span class="rank-badge">${overallAvg !== null ? overallAvg + '%' : '-'}</span></td>
                    <td><button class="save-score-btn" onclick="viewStudentQirats('${student.id}', '${escapeHtml(student.full_name)}')">View Qirats <i class="fas fa-external-link-alt"></i></button></td>
                </tr>
            `;
        });
        
        const html = `
            <div style="overflow-x: auto;">
                <table class="exam-table">
                    <thead>
                        <tr><th>Rank</th><th>Student</th><th>Department</th><th>Batch</th><th>Overall Avg</th><th>Actions</th>
                    </thead>
                    <tbody>${studentRows}</tbody>
                </table>
            </div>
        `;
        document.getElementById('modalTitle').innerHTML = `🏆 Overall Student Rankings`;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('examModal').classList.add('active');
    }
    
    window.viewStudentQirats = async (studentId, studentName) => {
        const student = allStudents.find(s => s.id === studentId);
        if (!student) return;
        const qirats = getQiratNames(student);
        
        const assessmentColumns = ['assessment1', 'assessment2', 'assessment3', 'assessment4', 'assessment5'];
        const columnNames = ['Exam 1', 'Exam 2', 'Exam 3', 'Exam 4', 'Exam 5'];
        
        let qiratRows = '';
        for (const qirat of qirats) {
            const scores = getStudentExamScores(studentId, qirat);
            const avg = calculateAverage(scores);
            qiratRows += `
                <tr data-student="${studentId}" data-qirat="${qirat}">
                    <td><strong>📖 ${escapeHtml(qirat)}</strong></td>
                    ${assessmentColumns.map((col, idx) => `
                        <td><input type="number" class="score-input-student" data-assessment="${col}" data-qirat="${qirat}" value="${scores[col] !== null ? scores[col] : ''}" step="0.5" min="0" max="100" style="width:70px;"></td>
                    `).join('')}
                    <td id="student-avg-${studentId}-${qirat.replace(/[^a-z0-9]/gi, '_')}">${avg !== null ? avg : '-'}</td>
                </tr>
            `;
        }
        
        const html = `
            <div style="margin-bottom: 16px;">
                <h4>${escapeHtml(studentName)}</h4>
                <p>Department: ${escapeHtml(student.department)} | Batch: ${escapeHtml(student.batch)}</p>
            </div>
            <div style="overflow-x: auto;">
                <table class="exam-table">
                    <thead>
                        <td><th>Qirat</th>${columnNames.map(n => `<th>${n}</th>`).join('')}<th>Average</th>
                    </thead>
                    <tbody>${qiratRows}</tbody>
                </table>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <button class="save-score-btn" onclick="saveAllStudentScores('${studentId}')" style="padding: 10px 24px;">Save All Changes</button>
            </div>
        `;
        
        document.getElementById('modalTitle').innerHTML = `👤 ${escapeHtml(studentName)} - Qirat Exams`;
        document.getElementById('modalBody').innerHTML = html;
        
        document.querySelectorAll('.score-input-student').forEach(input => {
            input.addEventListener('change', async (e) => {
                const qirat = input.dataset.qirat;
                const assessment = input.dataset.assessment;
                const value = input.value;
                await saveExamScore(studentId, qirat, assessment, value);
                updateStudentAverageDisplay(studentId, qirat);
            });
        });
    };
    
    window.saveAllStudentScores = async (studentId) => {
        const inputs = document.querySelectorAll('.score-input-student');
        for (const input of inputs) {
            const qirat = input.dataset.qirat;
            const assessment = input.dataset.assessment;
            const value = input.value;
            await saveExamScore(studentId, qirat, assessment, value);
        }
        showToast('All scores saved');
        await loadExamScores();
        buildGroups();
    };
    
    function updateStudentAverageDisplay(studentId, qiratName) {
        const scores = getStudentExamScores(studentId, qiratName);
        const avg = calculateAverage(scores);
        const avgId = `student-avg-${studentId}-${qiratName.replace(/[^a-z0-9]/gi, '_')}`;
        const avgCell = document.getElementById(avgId);
        if (avgCell) avgCell.textContent = avg !== null ? avg : '-';
    }
    
    window.closeExamModal = () => document.getElementById('examModal').classList.remove('active');
    window.closeQiratSelectorModal = () => document.getElementById('qiratSelectorModal').classList.remove('active');
    
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGroupMode = btn.dataset.mode;
            buildGroups();
            renderStats();
        });
    });
    
    initNavigation();
    const adminUser = getCurrentAdminSync();
    if (adminUser?.role === 'super-admin') setTimeout(() => refreshNavigation(), 100);
    
    loadData();
</script>
