<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Qirat Registration | نور التلاوة - Islamic Qirat Circle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #c9a03d;
            --primary-gold-dark: #b88d2e;
            --primary-emerald: #1a5f4b;
            --primary-emerald-dark: #0e4435;
            --dark-bg: rgba(10, 25, 20, 0.85);
            --card-bg: rgba(255, 248, 225, 0.95);
            --text-primary: #2c2418;
            --text-secondary: #5a4a2e;
            --border-color: rgba(201, 160, 61, 0.3);
            --input-bg: rgba(255, 255, 245, 0.95);
            --primary: #b88d2e;
            --primary-dark: #9b6e1f;
            --primary-light: #e1b56a;
            --accent: #2d6a4f;
            --accent-dark: #1b4d3e;
            --danger: #c47e5a;
            --warning: #e6b422;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark {
            --card-bg: rgba(20, 30, 25, 0.92);
            --text-primary: #f5e6d3;
            --text-secondary: #d4c4a8;
            --border-color: rgba(201, 160, 61, 0.4);
            --input-bg: rgba(35, 45, 40, 0.9);
        }

        body {
            font-family: 'Amiri', 'Times New Roman', 'Segoe UI', 'Georgia', serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            background: #0a2a1f;
            color: var(--text-primary);
        }

        /* Islamic Pattern Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" opacity="0.12"><path fill="none" stroke="%23c9a03d" stroke-width="1.5" d="M400 50 L450 150 L550 150 L500 250 L550 350 L450 350 L400 450 L350 350 L250 350 L300 250 L250 150 L350 150 L400 50z M400 250 L425 300 L400 350 L375 300 L400 250z"/><circle cx="400" cy="400" r="80" stroke="%23c9a03d" fill="none" stroke-width="1.2"/><circle cx="400" cy="400" r="120" stroke="%23c9a03d" fill="none" stroke-width="1"/><path d="M400 200 L400 600 M200 400 L600 400" stroke="%23c9a03d" stroke-width="0.8" stroke-dasharray="5 5"/><path d="M300 300 L500 500 M500 300 L300 500" stroke="%23c9a03d" stroke-width="0.8"/></svg>');
            background-repeat: repeat;
            background-size: 80px;
            pointer-events: none;
            z-index: 0;
        }

        /* Mosque Silhouette Background */
        body::after {
            content: "";
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.3)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" preserveAspectRatio="none"><path fill="%232d5a3e" fill-opacity="0.15" d="M0,200 L1200,200 L1200,120 L1000,120 L900,50 L800,120 L700,40 L600,120 L500,30 L400,120 L300,40 L200,120 L100,50 L0,120 L0,200 Z"/><path fill="%23c9a03d" fill-opacity="0.08" d="M0,180 L1200,180 L1200,140 L1050,140 L950,90 L850,140 L750,70 L650,140 L550,60 L450,140 L350,70 L250,140 L150,90 L50,140 L0,140 Z"/></svg>') repeat-x bottom;
            background-size: 300px auto;
            pointer-events: none;
            z-index: 0;
        }

        .form-container {
            max-width: 950px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: var(--shadow-lg), 0 0 0 2px rgba(201, 160, 61, 0.2);
            padding: 2rem;
            transition: var(--transition);
            border: 1px solid rgba(201, 160, 61, 0.4);
        }

        /* Islamic Geometric Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px double var(--primary-gold);
            position: relative;
        }

        .header::before {
            content: "۞";
            font-size: 2rem;
            color: var(--primary-gold);
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            padding: 0 1rem;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .arabic-title {
            font-size: 1.4rem;
            color: var(--accent);
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(201, 160, 61, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid var(--primary-gold);
            border-radius: 3rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            color: var(--primary-gold);
            z-index: 100;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background: var(--primary-gold);
            color: #1a2a20;
            transform: translateY(-2px);
        }

        .subhead {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-style: italic;
        }

        .subhead i {
            color: var(--primary-gold);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
            font-size: 1rem;
        }

        label i {
            color: var(--primary-gold);
            width: 1.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 1rem;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--input-bg);
            color: var(--text-primary);
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(201, 160, 61, 0.2);
        }

        /* Schedule Cards with Islamic Border */
        .schedule-group {
            background: linear-gradient(135deg, rgba(201, 160, 61, 0.05), rgba(45, 106, 79, 0.05));
            border: 2px solid var(--border-color);
            border-radius: 1.8rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
            position: relative;
        }

        .schedule-group:hover {
            border-color: var(--primary-gold);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .schedule-badge {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: #1a2a20;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-remove {
            background: rgba(196, 126, 90, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: var(--transition);
            width: auto;
            margin: 0;
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.02);
        }

        /* Days Selector - Islamic Pattern Style */
        .days-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .days-selector label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            margin: 0;
            font-size: 0.85rem;
        }

        .days-selector label:hover {
            border-color: var(--primary-gold);
            transform: translateY(-1px);
        }

        .days-selector input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            margin: 0;
        }

        .days-selector input:checked + span {
            color: var(--primary-gold);
            font-weight: 700;
        }

        /* Two Column Layout */
        .schedule-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 640px) {
            .schedule-row {
                grid-template-columns: 1fr;
            }
            .form-container {
                padding: 1.2rem;
            }
            h2 {
                font-size: 1.6rem;
            }
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            color: #1e2a1f;
            border: none;
            padding: 1rem;
            border-radius: 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 0.7rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: var(--primary-gold);
            color: #1e2a1f;
            transform: translateY(-1px);
        }

        /* Status */
        #status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 500;
            text-align: center;
            transition: var(--transition);
        }

        .success {
            background: rgba(45, 106, 79, 0.2);
            color: var(--accent);
            border-left: 4px solid var(--accent);
            border-right: 4px solid var(--accent);
        }

        .error {
            background: rgba(196, 126, 90, 0.2);
            color: var(--danger);
            border-left: 4px solid var(--danger);
            border-right: 4px solid var(--danger);
        }

        /* Islamic Calligraphy Quote */
        .islamic-quote {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .islamic-quote i {
            color: var(--primary-gold);
            margin: 0 0.3rem;
        }

        /* Required Field */
        .required::after {
            content: " *";
            color: var(--danger);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .schedule-group {
            animation: fadeInUp 0.4s ease-out;
        }

        /* Character Counter */
        .char-counter {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i> الوضع المظلم
    </button>

    <div class="form-container">
        <div class="header">
            <h2>
                <i class="fas fa-star-and-crescent"></i>
                تسجيل القراءة
                <i class="fas fa-star-and-crescent"></i>
            </h2>
            <div class="arabic-title">بسم الله الرحمن الرحيم</div>
            <div class="subhead">
                <i class="fas fa-quran"></i>
                Qirat Registration – Brothers | نور التلاوة
                <i class="fas fa-mosque"></i>
            </div>
        </div>

        <form id="qiratForm">
            <div class="form-group">
                <label class="required">
                    <i class="fas fa-user-circle"></i>
                    Full Name / الاسم الكامل
                </label>
                <input type="text" id="full_name" placeholder="Enter your full name" required>
                <div class="char-counter"><span id="nameCount">0</span>/50 characters</div>
            </div>

            <div class="form-group">
                <label class="required">
                    <i class="fas fa-phone-alt"></i>
                    Phone Number / رقم الهاتف
                </label>
                <input type="text" id="phone" placeholder="+1234567890" required>
            </div>

            <div class="form-group">
                <label class="required">
                    <i class="fab fa-telegram"></i>
                    Telegram Username / معرف تيليجرام
                </label>
                <input type="text" id="telegram" placeholder="@username" required>
            </div>

            <div style="margin: 1.5rem 0 1rem;">
                <h3 style="display: flex; align-items: center; gap: 0.6rem; color: var(--primary-gold); font-size: 1.3rem;">
                    <i class="fas fa-calendar-alt"></i>
                    Qirat Schedules | جدول التلاوة
                </h3>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem;">
                    <i class="fas fa-hand-peace"></i> Select your available days, Qirat name & preferred time
                </p>
            </div>

            <div id="schedules">
                <div class="schedule-group" data-id="0">
                    <div class="schedule-header">
                        <span class="schedule-badge">
                            <i class="fas fa-star-of-life"></i> Schedule 1 | الجدول الأول
                        </span>
                        <button type="button" class="btn-remove" onclick="removeSchedule(this)">
                            <i class="fas fa-trash-alt"></i> Remove
                        </button>
                    </div>
                    <div class="days-selector">
                        <label><input type="checkbox" class="day-check" value="Monday"><span>Mon</span></label>
                        <label><input type="checkbox" class="day-check" value="Tuesday"><span>Tue</span></label>
                        <label><input type="checkbox" class="day-check" value="Wednesday"><span>Wed</span></label>
                        <label><input type="checkbox" class="day-check" value="Thursday"><span>Thu</span></label>
                        <label><input type="checkbox" class="day-check" value="Friday"><span>Fri</span></label>
                        <label><input type="checkbox" class="day-check" value="Saturday"><span>Sat</span></label>
                        <label><input type="checkbox" class="day-check" value="Sunday"><span>Sun</span></label>
                    </div>
                    <div class="schedule-row">
                        <div>
                            <label class="required">
                                <i class="fas fa-music"></i> Qirat Name / اسم القراءة
                            </label>
                            <input type="text" class="qirat_name" placeholder="e.g., Surah Al-Fatiha, Tajweed, Shuja" required>
                        </div>
                        <div>
                            <label class="required">
                                <i class="fas fa-clock"></i> When? / متى؟
                            </label>
                            <input type="text" class="time_preference" placeholder="Maghrib - Isha, after Subhi, 7:30 PM" required>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" id="add-schedule" class="btn-secondary">
                <i class="fas fa-plus-circle"></i> Add Another Schedule | إضافة جدول
            </button>

            <button type="submit" class="btn-primary" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Submit Registration | تسجيل
            </button>
        </form>

        <div id="status"></div>
        
        <div class="islamic-quote">
            <i class="fas fa-quote-right"></i> 
            "And recite the Qur'an with measured recitation." — Surah Al-Muzzammil (73:4)
            <i class="fas fa-quote-left"></i>
        </div>
    </div>

    <script>
        // ========== CONFIGURATION ==========
        const BOT_TOKEN = '8471368946:AAHXFpFGC5ob5ptDivokYDVpEVBqM0c5iKQ';
        const ADMIN_IDS = ['6672312554', '7897840965'];

        // ========== THEME MANAGEMENT ==========
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            body.classList.add('dark');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i> الوضع المضيء';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i> الوضع المضيء' : '<i class="fas fa-moon"></i> الوضع المظلم';
        });

        // ========== CHARACTER COUNTER ==========
        const nameInput = document.getElementById('full_name');
        const nameCount = document.getElementById('nameCount');
        nameInput.addEventListener('input', () => {
            nameCount.textContent = nameInput.value.length;
            if (nameInput.value.length > 50) {
                nameInput.value = nameInput.value.slice(0, 50);
                nameCount.textContent = 50;
            }
        });

        // ========== SCHEDULE MANAGEMENT ==========
        let scheduleCounter = 1;

        window.removeSchedule = function(btn) {
            const group = btn.closest('.schedule-group');
            if (document.querySelectorAll('.schedule-group').length > 1) {
                group.remove();
                updateScheduleBadges();
            } else {
                showStatus('At least one schedule is required! | مطلوب جدول واحد على الأقل', 'error');
            }
        };

        function updateScheduleBadges() {
            const groups = document.querySelectorAll('.schedule-group');
            groups.forEach((group, idx) => {
                const badge = group.querySelector('.schedule-badge');
                if (badge) {
                    badge.innerHTML = `<i class="fas fa-star-of-life"></i> Schedule ${idx + 1} | الجدول ${idx + 1}`;
                }
            });
        }

        document.getElementById('add-schedule').addEventListener('click', () => {
            const container = document.getElementById('schedules');
            const newId = scheduleCounter++;
            const newGroup = document.createElement('div');
            newGroup.className = 'schedule-group';
            newGroup.setAttribute('data-id', newId);
            newGroup.innerHTML = `
                <div class="schedule-header">
                    <span class="schedule-badge"><i class="fas fa-star-of-life"></i> Schedule ${document.querySelectorAll('.schedule-group').length + 1} | الجدول الجديد</span>
                    <button type="button" class="btn-remove" onclick="removeSchedule(this)"><i class="fas fa-trash-alt"></i> Remove</button>
                </div>
                <div class="days-selector">
                    <label><input type="checkbox" class="day-check" value="Monday"><span>Mon</span></label>
                    <label><input type="checkbox" class="day-check" value="Tuesday"><span>Tue</span></label>
                    <label><input type="checkbox" class="day-check" value="Wednesday"><span>Wed</span></label>
                    <label><input type="checkbox" class="day-check" value="Thursday"><span>Thu</span></label>
                    <label><input type="checkbox" class="day-check" value="Friday"><span>Fri</span></label>
                    <label><input type="checkbox" class="day-check" value="Saturday"><span>Sat</span></label>
                    <label><input type="checkbox" class="day-check" value="Sunday"><span>Sun</span></label>
                </div>
                <div class="schedule-row">
                    <div>
                        <label class="required"><i class="fas fa-music"></i> Qirat Name / اسم القراءة</label>
                        <input type="text" class="qirat_name" placeholder="e.g., Surah Al-Fatiha, Tajweed" required>
                    </div>
                    <div>
                        <label class="required"><i class="fas fa-clock"></i> When? / متى؟</label>
                        <input type="text" class="time_preference" placeholder="Maghrib - Isha, after Subhi, 7:30 PM" required>
                    </div>
                </div>
            `;
            container.appendChild(newGroup);
            updateScheduleBadges();
            
            newGroup.style.animation = 'none';
            setTimeout(() => {
                newGroup.style.animation = 'fadeInUp 0.4s ease-out';
            }, 10);
        });

        // ========== TELEGRAM SEND ==========
        async function sendToTelegram(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const payload = { chat_id: chatId, text, parse_mode: 'HTML', disable_web_page_preview: true };
            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return await resp.json();
            } catch (err) {
                return { ok: false, error: err.message };
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = type;
            setTimeout(() => {
                if (statusDiv.className === type) {
                    statusDiv.className = '';
                }
            }, 5000);
        }

        // ========== FORM SUBMISSION ==========
        document.getElementById('qiratForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending... جاري الإرسال';
            submitBtn.disabled = true;

            const full_name = document.getElementById('full_name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            let telegram = document.getElementById('telegram').value.trim().replace(/^@/, '');
            
            if (!full_name || !phone || !telegram) {
                showStatus('Please fill all required fields! الرجاء تعبئة جميع الحقول', 'error');
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                return;
            }

            const groups = document.querySelectorAll('.schedule-group');
            const schedules = [];
            
            for (let group of groups) {
                const checkedDays = Array.from(group.querySelectorAll('.day-check:checked')).map(c => c.value);
                const qirat = group.querySelector('.qirat_name').value.trim();
                const timePref = group.querySelector('.time_preference').value.trim();
                
                if (checkedDays.length === 0) {
                    showStatus('Please select at least one day for each schedule', 'error');
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }
                if (!qirat) {
                    showStatus('Please enter Qirat name for all schedules', 'error');
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }
                if (!timePref) {
                    showStatus('Please enter preferred time (When?) for all schedules', 'error');
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }
                
                schedules.push({ days: checkedDays, qirat, time: timePref });
            }
            
            if (schedules.length === 0) {
                showStatus('Please add at least one schedule', 'error');
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                return;
            }
            
            // Build beautiful Islamic message
            const scheduleLines = schedules.map((s, i) => {
                const daysArabic = s.days.join(' • ');
                return `📖 <b>الجدول ${i+1}</b>\n   🗓️ <b>${daysArabic}</b>\n   🎙️ ${s.qirat}\n   ⏰ ${s.time}`;
            }).join('\n\n');
            
            const message = `
🕌 <b>QIRAT REGISTRATION | تسجيل قراءة جديد</b> 🕌

<b>الاسم الكامل:</b> ${full_name}
<b>📞 Phone:</b> ${phone}
<b>💬 Telegram:</b> @${telegram}

<b>📖 QIRAT SCHEDULES | جداول التلاوة:</b>
${scheduleLines}

──────────────────
<i>⏰ Submitted: ${new Date().toLocaleString('en-US', { hour12: true })}</i>
<i>🕋 "And recite the Qur'an with measured recitation"</i>
            `.trim();
            
            const results = await Promise.all(ADMIN_IDS.map(id => sendToTelegram(id, message)));
            const allOk = results.every(r => r && r.ok === true);
            
            if (allOk) {
                showStatus('✅ Registration Successful! تم التسجيل بنجاح. JazakAllah Khair! جزاك الله خيرًا ✨', 'success');
                document.getElementById('qiratForm').reset();
                nameCount.textContent = '0';
                document.getElementById('schedules').innerHTML = `
                    <div class="schedule-group" data-id="0">
                        <div class="schedule-header">
                            <span class="schedule-badge"><i class="fas fa-star-of-life"></i> Schedule 1 | الجدول الأول</span>
                            <button type="button" class="btn-remove" onclick="removeSchedule(this)"><i class="fas fa-trash-alt"></i> Remove</button>
                        </div>
                        <div class="days-selector">
                            <label><input type="checkbox" class="day-check" value="Monday"><span>Mon</span></label>
                            <label><input type="checkbox" class="day-check" value="Tuesday"><span>Tue</span></label>
                            <label><input type="checkbox" class="day-check" value="Wednesday"><span>Wed</span></label>
                            <label><input type="checkbox" class="day-check" value="Thursday"><span>Thu</span></label>
                            <label><input type="checkbox" class="day-check" value="Friday"><span>Fri</span></label>
                            <label><input type="checkbox" class="day-check" value="Saturday"><span>Sat</span></label>
                            <label><input type="checkbox" class="day-check" value="Sunday"><span>Sun</span></label>
                        </div>
                        <div class="schedule-row">
                            <div>
                                <label class="required"><i class="fas fa-music"></i> Qirat Name / اسم القراءة</label>
                                <input type="text" class="qirat_name" placeholder="e.g., Surah Al-Fatiha, Tajweed" required>
                            </div>
                            <div>
                                <label class="required"><i class="fas fa-clock"></i> When? / متى؟</label>
                                <input type="text" class="time_preference" placeholder="Maghrib - Isha, after Subhi, 7:30 PM" required>
                            </div>
                        </div>
                    </div>
                `;
                scheduleCounter = 1;
                updateScheduleBadges();
            } else {
                showStatus('❌ Error submitting registration. Please try again.', 'error');
                console.error('Telegram errors:', results);
            }
            
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
        });
        
        updateScheduleBadges();
    </script>
</body>
</html>
