<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Student Portal | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Full screen container */
        .full-screen-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        /* Animated background shapes */
        .bg-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .bg-shape-1 { width: 300px; height: 300px; top: -150px; right: -150px; animation-delay: 0s; }
        .bg-shape-2 { width: 500px; height: 500px; bottom: -250px; left: -250px; animation-delay: -5s; }
        .bg-shape-3 { width: 200px; height: 200px; top: 50%; right: 10%; animation-delay: -10s; }
        .bg-shape-4 { width: 150px; height: 150px; bottom: 20%; left: 15%; animation-delay: -15s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
        
        /* Glass card */
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            margin: 20px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            left: 30px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            background: #1f2937;
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.9rem;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            background: rgba(31, 41, 55, 0.95);
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Floating animation for logo */
        .logo-icon {
            animation: floatIcon 3s ease-in-out infinite;
        }
        
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Pulse animation for decoration */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: pulse 3s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        @media (max-width: 640px) {
            .glass-card {
                margin: 16px;
                max-width: calc(100% - 32px);
            }
            
            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                font-size: 0.8rem;
                padding: 10px 16px;
            }
        }
        
        /* Custom checkbox and remember me */
        .checkbox-custom {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .checkbox-custom:checked {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
        }
        
        /* Social buttons */
        .social-btn {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .social-btn:hover {
            transform: translateY(-2px);
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <!-- Full screen container -->
    <div class="full-screen-container">
        <!-- Animated background shapes -->
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>
        <div class="bg-shape bg-shape-4"></div>
        
        <!-- Pulse rings -->
        <div class="pulse-ring" style="width: 600px; height: 600px; top: -200px; right: -200px;"></div>
        <div class="pulse-ring" style="width: 400px; height: 400px; bottom: -100px; left: -100px; animation-delay: 1s;"></div>
        
        <!-- Login Card -->
        <div class="glass-card">
            <div class="p-8 md:p-10">
                <!-- Logo and Title -->
                <div class="text-center mb-8">
                    <div class="logo-icon inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl shadow-lg mb-4">
                        <i class="fas fa-graduation-cap text-4xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800">Student Portal</h1>
                    <p class="text-gray-500 mt-2">Access your academic dashboard</p>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" onsubmit="event.preventDefault(); login();">
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-user mr-2 text-indigo-500"></i>First Name
                        </label>
                        <input type="text" id="firstName" placeholder="Enter your first name" 
                               class="input-field w-full px-4 py-3 rounded-xl text-gray-700 focus:outline-none"
                               autocomplete="off">
                        <p class="text-xs text-gray-400 mt-1">Use the name you registered with</p>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">
                            <i class="fas fa-lock mr-2 text-indigo-500"></i>Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" 
                               class="input-field w-full px-4 py-3 rounded-xl text-gray-700 focus:outline-none">
                        <p class="text-xs text-gray-400 mt-1">Password provided by your administrator</p>
                    </div>
                    
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="rememberMe" class="checkbox-custom mr-2">
                            <span class="text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-indigo-600 hover:text-indigo-800 transition">Forgot password?</a>
                    </div>
                    
                    <button type="submit" id="loginBtn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-lg relative overflow-hidden">
                        <span class="relative z-10"><i class="fas fa-sign-in-alt mr-2"></i>Login</span>
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-400">or</span>
                    </div>
                </div>
                
                <!-- Demo Credentials Info -->
                <div class="bg-indigo-50 rounded-xl p-4 mb-6">
                    <div class="flex items-start gap-3">
                        <i class="fas fa-info-circle text-indigo-500 mt-0.5"></i>
                        <div class="text-sm text-gray-600">
                            <p class="font-semibold text-indigo-700 mb-1">Demo Credentials</p>
                            <p>Contact your academic administrator for login credentials</p>
                        </div>
                    </div>
                </div>
                
                <!-- Footer Links -->
                <div class="text-center text-sm text-gray-500">
                    <p>© 2024 Academic Performance System</p>
                    <p class="mt-1">All rights reserved</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let loginAttempts = 0;
        let lastAttemptTime = 0;
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }
        
        function setLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            const btnText = btn.querySelector('span');
            if (isLoading) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="loading-spinner mr-2"></span> Verifying...';
            } else {
                btn.disabled = false;
                btnText.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
            }
        }
        
        function checkRateLimit() {
            const now = Date.now();
            if (loginAttempts >= 5) {
                if (now - lastAttemptTime < 300000) {
                    const remaining = Math.ceil((300000 - (now - lastAttemptTime)) / 60000);
                    showToast(`Too many attempts. Please wait ${remaining} minute(s).`, true);
                    return false;
                } else {
                    loginAttempts = 0;
                }
            }
            return true;
        }
        
        async function findStudentByName(firstName) {
            try {
                // First try studentCredentials collection
                const credentialsQuery = query(collection(db, "studentCredentials"), where("firstName", "==", firstName));
                const credSnapshot = await getDocs(credentialsQuery);
                
                if (!credSnapshot.empty) {
                    const credDoc = credSnapshot.docs[0];
                    const credData = credDoc.data();
                    return {
                        found: true,
                        studentId: credDoc.id,
                        studentData: credData,
                        source: 'credentials'
                    };
                }
                
                // Then try registrations
                const registrationsSnapshot = await getDocs(collection(db, "registrations"));
                let matchedStudent = null;
                let matchedId = null;
                
                registrationsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const fullName = (data.full_name || '').toLowerCase();
                    const firstNameLower = firstName.toLowerCase();
                    
                    if (fullName.startsWith(firstNameLower) || fullName.split(' ')[0] === firstNameLower) {
                        matchedStudent = data;
                        matchedId = doc.id;
                    }
                });
                
                if (matchedStudent) {
                    return {
                        found: true,
                        studentId: matchedId,
                        studentData: matchedStudent,
                        source: 'registration'
                    };
                }
                
                return { found: false };
            } catch (error) {
                console.error("Search error:", error);
                return { found: false, error: true };
            }
        }
        
        async function verifyPassword(studentId, enteredPassword) {
            try {
                const credDoc = await getDoc(doc(db, "studentCredentials", studentId));
                if (credDoc.exists()) {
                    const storedPassword = credDoc.data().password;
                    return storedPassword === enteredPassword;
                }
                return false;
            } catch (error) {
                console.error("Password verification error:", error);
                return false;
            }
        }
        
        window.login = async () => {
            const firstName = document.getElementById('firstName').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            
            if (!firstName || !password) {
                showToast('Please enter both first name and password', true);
                return;
            }
            
            if (!checkRateLimit()) return;
            
            setLoading(true);
            loginAttempts++;
            lastAttemptTime = Date.now();
            
            try {
                const result = await findStudentByName(firstName);
                
                if (!result.found) {
                    setLoading(false);
                    showToast('Invalid first name. Please check with your administrator.', true);
                    return;
                }
                
                if (result.error) {
                    setLoading(false);
                    showToast('Login service error. Please try again.', true);
                    return;
                }
                
                const isValid = await verifyPassword(result.studentId, password);
                
                if (!isValid) {
                    setLoading(false);
                    showToast('Invalid password. Please try again.', true);
                    return;
                }
                
                // Login successful
                const studentInfo = {
                    id: result.studentId,
                    firstName: firstName,
                    fullName: result.studentData.full_name || result.studentData.fullName || firstName,
                    department: result.studentData.department || 'Not Specified',
                    batch: result.studentData.batch || 'General',
                    email: result.studentData.email || '',
                    phone: result.studentData.phone || '',
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('studentLoggedIn', 'true');
                localStorage.setItem('studentId', studentInfo.id);
                localStorage.setItem('studentFirstName', studentInfo.firstName);
                localStorage.setItem('studentFullName', studentInfo.fullName);
                localStorage.setItem('studentDepartment', studentInfo.department);
                localStorage.setItem('studentBatch', studentInfo.batch);
                localStorage.setItem('studentEmail', studentInfo.email);
                localStorage.setItem('studentPhone', studentInfo.phone);
                localStorage.setItem('studentLoginTime', studentInfo.loginTime);
                
                if (rememberMe) {
                    localStorage.setItem('rememberedFirstName', firstName);
                } else {
                    localStorage.removeItem('rememberedFirstName');
                }
                
                showToast(`Welcome back, ${studentInfo.fullName}! Redirecting...`);
                
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error("Login error:", error);
                setLoading(false);
                showToast('Login failed. Please try again later.', true);
            }
        };
        
        // Check if already logged in
        if (localStorage.getItem('studentLoggedIn') === 'true') {
            const loginTime = localStorage.getItem('studentLoginTime');
            if (loginTime) {
                const hoursSinceLogin = (Date.now() - new Date(loginTime)) / (1000 * 60 * 60);
                if (hoursSinceLogin < 24) {
                    window.location.href = 'student-dashboard.html';
                } else {
                    localStorage.clear();
                }
            } else {
                localStorage.clear();
            }
        }
        
        // Load remembered first name
        const rememberedName = localStorage.getItem('rememberedFirstName');
        if (rememberedName) {
            document.getElementById('firstName').value = rememberedName;
            document.getElementById('rememberMe').checked = true;
        }
        
        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        document.getElementById('firstName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });
        
        // Add floating label effect
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('label')?.classList.add('text-indigo-600');
            });
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.querySelector('label')?.classList.remove('text-indigo-600');
                }
            });
        });
    </script>
</body>
</html>
