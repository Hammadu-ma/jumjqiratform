<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Student Portal | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            background: #1f2937;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-align: center;
            font-size: 0.85rem;
            max-width: 400px;
            margin: 0 auto;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (min-width: 768px) {
            .toast {
                right: 20px;
                left: auto;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="bg-white/20 inline-flex p-4 rounded-full mb-4">
                <i class="fas fa-graduation-cap text-5xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">Student Portal</h1>
            <p class="text-white/80 mt-2">Access your academic performance dashboard</p>
        </div>
        
        <!-- Login Card -->
        <div class="glass-card p-8">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    <i class="fas fa-user mr-2 text-emerald-600"></i>First Name
                </label>
                <input type="text" id="firstName" placeholder="Enter your first name as registered" 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-700">
                <p class="text-xs text-gray-500 mt-1">Use the name you registered with (e.g., "Aisha")</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    <i class="fas fa-lock mr-2 text-emerald-600"></i>Password
                </label>
                <input type="password" id="password" placeholder="Enter your password" 
                       class="input-field w-full px-4 py-3 rounded-xl text-gray-700">
                <p class="text-xs text-gray-500 mt-1">Password provided by your administrator</p>
            </div>
            
            <button onclick="login()" id="loginBtn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
            
            <div class="mt-6 text-center text-sm text-gray-500">
                <p>Having trouble logging in? Contact your academic administrator.</p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-6 text-white/60 text-xs">
            <p>© 2024 Academic Performance System. All rights reserved.</p>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
            authDomain: "jujm-qirat.firebaseapp.com",
            projectId: "jujm-qirat",
            storageBucket: "jujm-qirat.firebasestorage.app",
            messagingSenderId: "253413984903",
            appId: "1:253413984903:web:c1577e0fdef1711f960622"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let loginAttempts = 0;
        let lastAttemptTime = 0;
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }
        
        function setLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            if (isLoading) {
                btn.innerHTML = '<span class="loading-spinner mr-2"></span> Verifying...';
                btn.disabled = true;
            } else {
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
                btn.disabled = false;
            }
        }
        
        // Rate limiting
        function checkRateLimit() {
            const now = Date.now();
            if (loginAttempts >= 5) {
                if (now - lastAttemptTime < 300000) { // 5 minutes
                    const remaining = Math.ceil((300000 - (now - lastAttemptTime)) / 60000);
                    showToast(`Too many attempts. Please wait ${remaining} minute(s).`, true);
                    return false;
                } else {
                    loginAttempts = 0;
                }
            }
            return true;
        }
        
        async function findStudentByName(firstName) {
            try {
                // First, try to find by first_name field
                const credentialsQuery = query(collection(db, "studentCredentials"), where("firstName", "==", firstName));
                const credSnapshot = await getDocs(credentialsQuery);
                
                if (!credSnapshot.empty) {
                    const credDoc = credSnapshot.docs[0];
                    const credData = credDoc.data();
                    return {
                        found: true,
                        studentId: credDoc.id,
                        studentData: credData,
                        source: 'credentials'
                    };
                }
                
                // If not found, try to find in registrations by full_name or first name match
                const registrationsSnapshot = await getDocs(collection(db, "registrations"));
                let matchedStudent = null;
                let matchedId = null;
                
                registrationsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const fullName = (data.full_name || '').toLowerCase();
                    const firstNameLower = firstName.toLowerCase();
                    
                    // Check if full name starts with the first name
                    if (fullName.startsWith(firstNameLower) || fullName.split(' ')[0] === firstNameLower) {
                        matchedStudent = data;
                        matchedId = doc.id;
                    }
                });
                
                if (matchedStudent) {
                    return {
                        found: true,
                        studentId: matchedId,
                        studentData: matchedStudent,
                        source: 'registration'
                    };
                }
                
                return { found: false };
            } catch (error) {
                console.error("Search error:", error);
                return { found: false, error: true };
            }
        }
        
        async function verifyPassword(studentId, enteredPassword) {
            try {
                const credDoc = await getDoc(doc(db, "studentCredentials", studentId));
                if (credDoc.exists()) {
                    const storedPassword = credDoc.data().password;
                    return storedPassword === enteredPassword;
                }
                return false;
            } catch (error) {
                console.error("Password verification error:", error);
                return false;
            }
        }
        
        window.login = async () => {
            const firstName = document.getElementById('firstName').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!firstName || !password) {
                showToast('Please enter both first name and password', true);
                return;
            }
            
            if (!checkRateLimit()) return;
            
            setLoading(true);
            loginAttempts++;
            lastAttemptTime = Date.now();
            
            try {
                // Find student by first name
                const result = await findStudentByName(firstName);
                
                if (!result.found) {
                    setLoading(false);
                    showToast('Invalid first name. Please check with your administrator.', true);
                    return;
                }
                
                if (result.error) {
                    setLoading(false);
                    showToast('Login service error. Please try again.', true);
                    return;
                }
                
                // Verify password
                const isValid = await verifyPassword(result.studentId, password);
                
                if (!isValid) {
                    setLoading(false);
                    showToast('Invalid password. Please try again.', true);
                    return;
                }
                
                // Login successful - store session
                const studentInfo = {
                    id: result.studentId,
                    firstName: firstName,
                    fullName: result.studentData.full_name || result.studentData.fullName || firstName,
                    department: result.studentData.department || 'Not Specified',
                    batch: result.studentData.batch || 'General',
                    email: result.studentData.email || '',
                    phone: result.studentData.phone || '',
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('studentLoggedIn', 'true');
                localStorage.setItem('studentId', studentInfo.id);
                localStorage.setItem('studentFirstName', studentInfo.firstName);
                localStorage.setItem('studentFullName', studentInfo.fullName);
                localStorage.setItem('studentDepartment', studentInfo.department);
                localStorage.setItem('studentBatch', studentInfo.batch);
                localStorage.setItem('studentEmail', studentInfo.email);
                localStorage.setItem('studentPhone', studentInfo.phone);
                localStorage.setItem('studentLoginTime', studentInfo.loginTime);
                
                showToast(`Welcome back, ${studentInfo.fullName}! Redirecting...`);
                
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error("Login error:", error);
                setLoading(false);
                showToast('Login failed. Please try again later.', true);
            }
        };
        
        // Check if already logged in
        if (localStorage.getItem('studentLoggedIn') === 'true') {
            const loginTime = localStorage.getItem('studentLoginTime');
            if (loginTime) {
                const hoursSinceLogin = (Date.now() - new Date(loginTime)) / (1000 * 60 * 60);
                if (hoursSinceLogin < 24) {
                    window.location.href = 'student-dashboard.html';
                } else {
                    // Session expired
                    localStorage.clear();
                }
            } else {
                localStorage.clear();
            }
        }
        
        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
        document.getElementById('firstName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
