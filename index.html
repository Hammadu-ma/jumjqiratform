<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnConnect - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --primary-color: #4361ee;
            --primary-dark: #3a56d4;
            --secondary-color: #7209b7;
            --accent-color: #f72585;
            --success-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
            --light-gray: #e9ecef;
            --border-radius: 12px;
            --box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --box-shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7ff 0%, #f0f4ff 100%);
            color: var(--dark-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            font-size: 16px;
            color: var(--gray-color);
            font-weight: 500;
        }

        .signup-card {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 40px 35px;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        .signup-card:hover {
            box-shadow: var(--box-shadow-hover);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 5px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--gray-color);
            margin-bottom: 30px;
        }

        .role-selection {
            margin-bottom: 30px;
        }

        .role-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--dark-color);
        }

        .role-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .role-option {
            flex: 1;
            min-width: 180px;
        }

        .role-btn {
            width: 100%;
            padding: 20px 15px;
            border: 2px solid var(--light-gray);
            border-radius: var(--border-radius);
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .role-btn:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.1);
        }

        .role-btn.selected {
            border-color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
        }

        .role-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .student-icon {
            color: var(--primary-color);
        }

        .mentor-icon {
            color: var(--secondary-color);
        }

        .role-name {
            font-size: 18px;
            font-weight: 600;
        }

        .role-desc {
            font-size: 14px;
            color: var(--gray-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        .input-container {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-color);
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 2px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-family: inherit;
            transition: var(--transition);
            background-color: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-color);
            cursor: pointer;
            font-size: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            font-family: inherit;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: var(--gray-color);
            font-size: 16px;
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .error-icon {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }

        .success-icon {
            background-color: rgba(25, 135, 84, 0.1);
            color: #198754;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }

        .modal-message {
            font-size: 16px;
            color: var(--dark-color);
            margin-bottom: 25px;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-btn:hover {
            background-color: var(--primary-dark);
        }

        /* Loading State */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            body {
                padding: 15px;
            }
            
            .signup-card {
                padding: 30px 25px;
            }
            
            .logo-text {
                font-size: 28px;
            }
            
            .page-title {
                font-size: 24px;
            }
            
            .role-option {
                min-width: 100%;
            }
            
            .role-btn {
                padding: 18px 15px;
            }
        }

        @media (max-width: 400px) {
            .signup-card {
                padding: 25px 20px;
            }
            
            .logo {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="logo-text">LearnConnect</div>
            </div>
            <div class="tagline">Unified Student Growth Platform</div>
        </div>

        <!-- Signup Card -->
        <div class="signup-card">
            <h1 class="page-title">Create Your Account</h1>
            <p class="page-subtitle">Join as a student or mentor to begin your journey</p>
            
            <!-- Role Selection -->
            <div class="role-selection">
                <h3 class="role-title">Select Your Role</h3>
                <div class="role-options">
                    <div class="role-option">
                        <button class="role-btn" id="studentBtn">
                            <i class="fas fa-user-graduate role-icon student-icon"></i>
                            <div class="role-name">Student</div>
                            <div class="role-desc">Get help, guidance & support</div>
                        </button>
                    </div>
                    <div class="role-option">
                        <button class="role-btn" id="mentorBtn">
                            <i class="fas fa-chalkboard-teacher role-icon mentor-icon"></i>
                            <div class="role-name">Mentor</div>
                            <div class="role-desc">Share knowledge & guide others</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Signup Form -->
            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <div class="input-container">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="fullName" class="form-input" placeholder="Enter your full name" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-container">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-container">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="Create a strong password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">Create Account</span>
                </button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="#" id="loginLink">Log In</a>
            </div>
        </div>
    </div>

    <!-- Modal for Error/Success Messages -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-icon error-icon" id="modalIcon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2 class="modal-title" id="modalTitle">Error</h2>
            </div>
            <p class="modal-message" id="modalMessage">An error occurred during signup. Please try again.</p>
            <button class="modal-btn" id="modalBtn">Okay</button>
        </div>
    </div>

    <script>
        // Firebase Configuration (Replace with your actual config)
        const firebaseConfig = {
    apiKey: "AIzaSyCWquYbzfwt1oEqvXEuQOMUyhIoSS-V4FE",
    authDomain: "schoolhub-ada40.firebaseapp.com",
    projectId: "schoolhub-ada40",
    storageBucket: "schoolhub-ada40.firebasestorage.app",
    messagingSenderId: "1004768478486",
    appId: "1:1004768478486:web:910f3d3ed06885d68dfc37"
  };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM Elements
        const studentBtn = document.getElementById('studentBtn');
        const mentorBtn = document.getElementById('mentorBtn');
        const signupForm = document.getElementById('signupForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loginLink = document.getElementById('loginLink');
        
        // Modal Elements
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        // State Variables
        let selectedRole = 'student'; // Default role
        let isSubmitting = false;

        // Initialize UI
        function initUI() {
            // Set student as selected by default
            studentBtn.classList.add('selected');
            
            // Role Selection Handlers
            studentBtn.addEventListener('click', () => selectRole('student'));
            mentorBtn.addEventListener('click', () => selectRole('mentor'));
            
            // Password Toggle
            togglePassword.addEventListener('click', togglePasswordVisibility);
            
            // Form Submission
            signupForm.addEventListener('submit', handleSignup);
            
            // Login Link
            loginLink.addEventListener('click', (e) => {
                e.preventDefault();
                showModal('info', 'Login', 'Redirecting to login page...', () => {
                    // In a real app, this would redirect to login page
                    window.location.href = 'login.html';
                });
            });
            
            // Modal Button
            modalBtn.addEventListener('click', () => {
                modalOverlay.classList.remove('active');
            });
            
            // Close modal when clicking outside
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });
        }

        // Role Selection Function
        function selectRole(role) {
            selectedRole = role;
            
            // Update UI
            if (role === 'student') {
                studentBtn.classList.add('selected');
                mentorBtn.classList.remove('selected');
            } else {
                mentorBtn.classList.remove('selected');
                studentBtn.classList.add('selected');
                // In the actual implementation, mentorBtn should be selected
                // Fixing the logic:
                mentorBtn.classList.add('selected');
                studentBtn.classList.remove('selected');
            }
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        }

        // Show Modal Function
        function showModal(type, title, message, callback = null) {
            // Set modal content based on type
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            // Set icon and color based on type
            modalIcon.className = 'modal-icon';
            let iconClass = 'fas fa-exclamation-triangle';
            
            if (type === 'error') {
                modalIcon.classList.add('error-icon');
                iconClass = 'fas fa-exclamation-triangle';
            } else if (type === 'success') {
                modalIcon.classList.add('success-icon');
                iconClass = 'fas fa-check-circle';
            } else if (type === 'info') {
                modalIcon.classList.add('error-icon'); // Using same style as error for info
                iconClass = 'fas fa-info-circle';
            }
            
            modalIcon.innerHTML = `<i class="${iconClass}"></i>`;
            
            // Show modal
            modalOverlay.classList.add('active');
            
            // Set callback for modal button if provided
            if (callback) {
                const handler = () => {
                    modalBtn.removeEventListener('click', handler);
                    callback();
                };
                modalBtn.addEventListener('click', handler);
            }
        }

        // Validate Form
        function validateForm() {
            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Basic validation
            if (!name) {
                showModal('error', 'Validation Error', 'Please enter your full name.');
                return false;
            }
            
            if (!email) {
                showModal('error', 'Validation Error', 'Please enter your email address.');
                return false;
            }
            
            // Simple email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showModal('error', 'Validation Error', 'Please enter a valid email address.');
                return false;
            }
            
            if (!password) {
                showModal('error', 'Validation Error', 'Please create a password.');
                return false;
            }
            
            if (password.length < 6) {
                showModal('error', 'Validation Error', 'Password must be at least 6 characters long.');
                return false;
            }
            
            return true;
        }

        // Handle Signup Submission
        async function handleSignup(e) {
            e.preventDefault();
            
            // Prevent multiple submissions
            if (isSubmitting) return;
            
            // Validate form
            if (!validateForm()) return;
            
            // Get form values
            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            // Set submitting state
            isSubmitting = true;
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Creating Account...';
            
            try {
                // Create user with Firebase Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    fullName: name,
                    email: email,
                    role: selectedRole,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isVerified: selectedRole === 'student', // Students are auto-verified
                    verificationStatus: selectedRole === 'mentor' ? 'pending' : 'approved',
                    profileCompleted: false
                });
                
                // Create role-specific document
                if (selectedRole === 'student') {
                    await db.collection('students').doc(user.uid).set({
                        uid: user.uid,
                        grade: null,
                        subjects: [],
                        goals: [],
                        futureDepartment: null,
                        joinedCommunities: []
                    });
                } else if (selectedRole === 'mentor') {
                    await db.collection('mentors').doc(user.uid).set({
                        uid: user.uid,
                        university: null,
                        department: null,
                        yearOfStudy: null,
                        subjectsOffered: [],
                        verificationDocuments: [],
                        verificationStatus: 'pending',
                        isApproved: false,
                        rating: 0,
                        totalSessions: 0
                    });
                }
                
                // Send email verification
                await user.sendEmailVerification();
                
                // Show success message
                showModal('success', 'Account Created!', 
                    `Your ${selectedRole} account has been created successfully! Please check your email to verify your account.`, 
                    () => {
                        // Redirect to appropriate onboarding page
                        if (selectedRole === 'student') {
                            window.location.href = 'student-onboarding.html';
                        } else {
                            window.location.href = 'mentor-onboarding.html';
                        }
                    });
                    
            } catch (error) {
                // Handle Firebase errors
                let errorMessage = 'An error occurred during signup. Please try again.';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'This email is already registered. Please use a different email or try logging in.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Please enter a valid email address.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak. Please use a stronger password.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Network error. Please check your internet connection.';
                        break;
                    default:
                        console.error('Signup error:', error);
                }
                
                showModal('error', 'Signup Failed', errorMessage);
                
                // Reset submitting state
                isSubmitting = false;
                submitBtn.disabled = false;
                btnText.textContent = 'Create Account';
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
