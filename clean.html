<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Duplicate Data Cleaner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: var(--primary-light);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--primary); color: white; }

        .main-container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 32px;
            padding: 40px 32px;
            margin-bottom: 32px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .hero-section::before {
            content: "🧹";
            position: absolute;
            bottom: -20px;
            right: 20px;
            font-size: 120px;
            opacity: 0.1;
            pointer-events: none;
        }
        .hero-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .hero-subtitle { opacity: 0.9; margin-bottom: 20px; }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Detection Controls */
        .detection-controls {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
        }
        .detection-methods {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .method-btn {
            padding: 12px 24px;
            border: 2px solid var(--border);
            border-radius: 60px;
            background: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .method-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .method-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }
        .detection-actions { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary:hover, .btn-danger:hover, .btn-warning:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        /* Duplicate Groups */
        .duplicate-group {
            background: var(--card-bg);
            border-radius: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }
        .duplicate-group:hover { box-shadow: var(--shadow-md); }
        .group-header {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 16px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .group-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .group-name {
            font-weight: 800;
            font-size: 1rem;
            color: #92400e;
        }
        .group-count {
            background: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #92400e;
        }
        .group-actions {
            display: flex;
            gap: 8px;
        }
        .keep-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .delete-group-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .group-content {
            display: none;
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .group-content.show { display: block; }
        .duplicate-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .duplicate-table th, .duplicate-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .duplicate-table th {
            background: #f8fafc;
            font-weight: 700;
        }
        .radio-select {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            z-index: 200;
            display: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-muted);
        }
        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }

        @media (min-width: 768px) { body { padding-bottom: 0; } .bottom-nav { display: none; } }
        @media (max-width: 768px) { .desktop-nav { display: none; } .bottom-nav { display: flex; } .main-container { padding: 16px; padding-bottom: 80px; } }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-broom"></i> Duplicate Data Cleaner</h1></div>
        <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
    </div>
</div>

<div class="main-container">
    <div class="hero-section">
        <div class="hero-title"><i class="fas fa-exclamation-triangle"></i> Duplicate Detection & Cleaner</div>
        <div class="hero-subtitle">Find, review, and remove duplicate student records from your database</div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-value" id="totalStudents">0</div><div class="stat-label">Total Students</div></div>
        <div class="stat-card"><div class="stat-value" id="duplicateGroups">0</div><div class="stat-label">Duplicate Groups</div></div>
        <div class="stat-card"><div class="stat-value" id="duplicateCount">0</div><div class="stat-label">Duplicate Records</div></div>
        <div class="stat-card"><div class="stat-value" id="uniqueStudents">0</div><div class="stat-label">Unique Students</div></div>
    </div>

    <div class="detection-controls">
        <h3 style="margin-bottom: 16px;"><i class="fas fa-sliders-h"></i> Detection Settings</h3>
        <div class="detection-methods">
            <button class="method-btn active" data-method="exact"><i class="fas fa-font"></i> Exact Name Match</button>
            <button class="method-btn" data-method="fuzzy"><i class="fas fa-language"></i> Fuzzy Name Match</button>
            <button class="method-btn" data-method="email"><i class="fas fa-envelope"></i> Email Match</button>
            <button class="method-btn" data-method="phone"><i class="fas fa-phone"></i> Phone Match</button>
            <button class="method-btn" data-method="name+phone"><i class="fas fa-link"></i> Name + Phone</button>
        </div>
        <div class="detection-actions">
            <button class="btn-primary" id="detectBtn"><i class="fas fa-search"></i> Detect Duplicates</button>
            <button class="btn-danger" id="deleteAllDupBtn" style="display:none;"><i class="fas fa-trash-alt"></i> Delete All Selected</button>
            <button class="btn-secondary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh Data</button>
        </div>
    </div>

    <div id="resultsContainer">
        <div class="empty-state"><i class="fas fa-search"></i> Click "Detect Duplicates" to find duplicate records</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nav-item" onclick="window.location.href='groups.html'"><i class="fas fa-layer-group"></i><span>Groups</span></button>
    <button class="nav-item" onclick="window.location.href='tables.html'"><i class="fas fa-table"></i><span>Tables</span></button>
    <button class="nav-item" onclick="window.location.href='analytics.html'"><i class="fas fa-chart-line"></i><span>Analytics</span></button>
    <button class="nav-item active" onclick="window.location.href='duplicate-cleaner.html'"><i class="fas fa-broom"></i><span>Cleaner</span></button>
    <button class="nav-item" onclick="window.location.href='import.html'"><i class="fas fa-upload"></i><span>Import</span></button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { protectPage, initAuthUI, setupAutoLogout, getCurrentAdminSync } from './auth.js';
    import { initNavigation, refreshNavigation } from './nav.js';
    
    if (!protectPage('admin-login.html')) throw new Error('Redirecting to login');
    const admin = initAuthUI();
    setupAutoLogout(60);
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allStudents = [];
    let duplicateGroups = [];
    let currentMethod = 'exact';
    let selectedKeepIds = new Map(); // groupKey -> selected student id to keep
    
    const toast = document.getElementById('toast');
    
    function showToast(msg, isErr = false) {
        toast.textContent = msg;
        toast.style.background = isErr ? '#ef4444' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function getQiratNames(student) {
        return (student.schedules || []).map(s => s.qirat_name).filter(Boolean);
    }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allStudents = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp?.toDate?.() || new Date(data.timestamp) || new Date();
                allStudents.push({
                    id: docSnap.id,
                    full_name: data.full_name || 'N/A',
                    gender: data.gender || 'Not Specified',
                    phone: data.phone || '',
                    telegram: data.telegram || '',
                    department: data.department || 'Other',
                    batch: data.batch || 'General',
                    schedules: data.schedules || [],
                    timestamp: timestamp
                });
            });
            updateStats();
            showToast(`Loaded ${allStudents.length} students`);
        } catch (error) {
            showToast("Error loading data: " + error.message, true);
        }
    }
    
    function updateStats() {
        document.getElementById('totalStudents').textContent = allStudents.length;
    }
    
    function normalizeName(name) {
        return name.toLowerCase().trim().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ');
    }
    
    function levenshteinDistance(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                const cost = a[j-1] === b[i-1] ? 0 : 1;
                matrix[i][j] = Math.min(
                    matrix[i-1][j] + 1,
                    matrix[i][j-1] + 1,
                    matrix[i-1][j-1] + cost
                );
            }
        }
        return matrix[b.length][a.length];
    }
    
    function detectDuplicates() {
        const groups = new Map();
        
        if (currentMethod === 'exact') {
            allStudents.forEach(student => {
                const key = normalizeName(student.full_name);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(student);
            });
        } 
        else if (currentMethod === 'fuzzy') {
            const processed = new Set();
            for (let i = 0; i < allStudents.length; i++) {
                if (processed.has(allStudents[i].id)) continue;
                const group = [allStudents[i]];
                const name1 = normalizeName(allStudents[i].full_name);
                for (let j = i + 1; j < allStudents.length; j++) {
                    if (processed.has(allStudents[j].id)) continue;
                    const name2 = normalizeName(allStudents[j].full_name);
                    const distance = levenshteinDistance(name1, name2);
                    const maxLen = Math.max(name1.length, name2.length);
                    const similarity = 1 - (distance / maxLen);
                    if (similarity > 0.85) {
                        group.push(allStudents[j]);
                        processed.add(allStudents[j].id);
                    }
                }
                if (group.length > 1) {
                    groups.set(name1, group);
                    processed.add(allStudents[i].id);
                }
            }
        }
        else if (currentMethod === 'email') {
            allStudents.forEach(student => {
                if (student.telegram && student.telegram.trim()) {
                    const key = student.telegram.toLowerCase().trim();
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(student);
                }
            });
        }
        else if (currentMethod === 'phone') {
            allStudents.forEach(student => {
                if (student.phone && student.phone.trim()) {
                    const key = student.phone.replace(/\D/g, '');
                    if (key.length > 0) {
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(student);
                    }
                }
            });
        }
        else if (currentMethod === 'name+phone') {
            allStudents.forEach(student => {
                const nameKey = normalizeName(student.full_name);
                const phoneKey = student.phone ? student.phone.replace(/\D/g, '') : '';
                if (phoneKey) {
                    const key = `${nameKey}|${phoneKey}`;
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(student);
                }
            });
        }
        
        duplicateGroups = Array.from(groups.entries())
            .filter(([_, students]) => students.length > 1)
            .map(([key, students]) => ({ key, students, count: students.length }));
        
        selectedKeepIds.clear();
        duplicateGroups.forEach(group => {
            const newest = group.students.reduce((a, b) => a.timestamp > b.timestamp ? a : b);
            selectedKeepIds.set(group.key, newest.id);
        });
        
        document.getElementById('duplicateGroups').textContent = duplicateGroups.length;
        const totalDupRecords = duplicateGroups.reduce((sum, g) => sum + g.count, 0);
        document.getElementById('duplicateCount').textContent = totalDupRecords;
        document.getElementById('uniqueStudents').textContent = allStudents.length - totalDupRecords + duplicateGroups.length;
        
        renderResults();
    }
    
    function renderResults() {
        const container = document.getElementById('resultsContainer');
        if (duplicateGroups.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle" style="color:#10b981; font-size:3rem;"></i><p style="margin-top:16px;">No duplicates found! Your data is clean.</p></div>`;
            document.getElementById('deleteAllDupBtn').style.display = 'none';
            return;
        }
        
        document.getElementById('deleteAllDupBtn').style.display = 'flex';
        
        container.innerHTML = duplicateGroups.map((group, idx) => `
            <div class="duplicate-group">
                <div class="group-header" onclick="toggleGroup(${idx})">
                    <div class="group-title">
                        <i class="fas fa-copy"></i>
                        <span class="group-name">${escapeHtml(group.key)}</span>
                        <span class="group-count">${group.count} records</span>
                    </div>
                    <div class="group-actions" onclick="event.stopPropagation()">
                        <button class="keep-btn" onclick="keepSelected('${group.key}')">Keep Selected</button>
                        <button class="delete-group-btn" onclick="deleteGroup('${group.key}')">Delete All</button>
                    </div>
                </div>
                <div class="group-content" id="groupContent-${idx}">
                    <table class="duplicate-table">
                        <thead>
                            <tr><th>Select</th><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Registered</th>
                        </thead>
                        <tbody>
                            ${group.students.map(s => `
                                <tr>
                                    <td><input type="radio" name="keep_${group.key}" value="${s.id}" class="radio-select" ${selectedKeepIds.get(group.key) === s.id ? 'checked' : ''} onchange="window.updateSelected('${group.key}', '${s.id}')"></td>
                                    <td><strong>${escapeHtml(s.full_name)}</strong></td>
                                    <td><span class="badge ${s.gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(s.gender)}</span></td>
                                    <td>${escapeHtml(s.phone)}</td>
                                    <td>${escapeHtml(s.department)}</td>
                                    <td>${escapeHtml(s.batch)}</td>
                                    <td>${escapeHtml(getQiratNames(s).join(', ') || '-')}</td>
                                    <td>${s.timestamp.toLocaleDateString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `).join('');
    }
    
    window.toggleGroup = (idx) => {
        const content = document.getElementById(`groupContent-${idx}`);
        if (content) content.classList.toggle('show');
    };
    
    window.updateSelected = (groupKey, studentId) => {
        selectedKeepIds.set(groupKey, studentId);
    };
    
    window.keepSelected = async (groupKey) => {
        const selectedId = selectedKeepIds.get(groupKey);
        const group = duplicateGroups.find(g => g.key === groupKey);
        if (!group) return;
        
        const toDelete = group.students.filter(s => s.id !== selectedId);
        if (toDelete.length === 0) {
            showToast('Nothing to delete', true);
            return;
        }
        
        if (confirm(`Keep "${groupKey}" and delete ${toDelete.length} duplicate(s)?`)) {
            showToast(`Deleting ${toDelete.length} duplicate(s)...`);
            const batch = writeBatch(db);
            toDelete.forEach(s => batch.delete(doc(db, "registrations", s.id)));
            await batch.commit();
            showToast(`Deleted ${toDelete.length} duplicate(s)`);
            await loadData();
            detectDuplicates();
        }
    };
    
    window.deleteGroup = async (groupKey) => {
        const group = duplicateGroups.find(g => g.key === groupKey);
        if (!group) return;
        
        if (confirm(`⚠️ Delete ALL ${group.count} records for "${groupKey}"? This cannot be undone!`)) {
            showToast(`Deleting ${group.count} records...`);
            const batch = writeBatch(db);
            group.students.forEach(s => batch.delete(doc(db, "registrations", s.id)));
            await batch.commit();
            showToast(`Deleted ${group.count} records`);
            await loadData();
            detectDuplicates();
        }
    };
    
    document.getElementById('deleteAllDupBtn').addEventListener('click', async () => {
        if (duplicateGroups.length === 0) { showToast('No duplicates to delete', true); return; }
        const totalToDelete = duplicateGroups.reduce((sum, g) => sum + (g.count - 1), 0);
        if (confirm(`⚠️ DELETE ALL ${totalToDelete} duplicate records? This will keep 1 record per duplicate group. This cannot be undone!`)) {
            showToast(`Deleting ${totalToDelete} duplicates...`);
            const batch = writeBatch(db);
            duplicateGroups.forEach(group => {
                const keepId = selectedKeepIds.get(group.key);
                group.students.forEach(s => {
                    if (s.id !== keepId) batch.delete(doc(db, "registrations", s.id));
                });
            });
            await batch.commit();
            showToast(`Deleted ${totalToDelete} duplicates`);
            await loadData();
            detectDuplicates();
        }
    });
    
    document.querySelectorAll('.method-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMethod = btn.dataset.method;
        });
    });
    
    document.getElementById('detectBtn').addEventListener('click', detectDuplicates);
    document.getElementById('refreshBtn').addEventListener('click', async () => {
        await loadData();
        detectDuplicates();
    });
    
    initNavigation();
    const adminUser = getCurrentAdminSync();
    if (adminUser?.role === 'super-admin') { setTimeout(() => refreshNavigation(), 100); }
    
    loadData();
</script>
</body>
</html>
