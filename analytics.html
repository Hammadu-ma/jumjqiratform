<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JUMJ Irshad | Advanced Analytics Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7f0 100%);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .desktop-nav {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .nav-link {
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover { background: var(--primary-light); color: var(--primary-dark); }
        .nav-link.active { background: linear-gradient(135deg, #10b981, #059669); color: white; }

        .back-btn {
            background: var(--primary-light);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--primary); color: white; }

        .main-container { max-width: 1600px; margin: 0 auto; padding: 24px; }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .kpi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        .kpi-title { font-size: 0.7rem; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
        .kpi-value { font-size: 2rem; font-weight: 800; color: var(--text-primary); }
        .kpi-trend { font-size: 0.7rem; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
        .trend-up { color: #10b981; }
        .trend-down { color: #ef4444; }

        /* Charts Row */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .chart-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .chart-title { font-weight: 700; margin-bottom: 16px; border-left: 4px solid var(--primary); padding-left: 12px; }
        canvas { max-height: 220px; width: 100%; }

        /* Filters Bar */
        .filters-bar {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            border: 1px solid var(--border);
        }
        .filter-group { flex: 1; min-width: 140px; }
        .filter-group label { font-size: 0.7rem; font-weight: 700; color: var(--primary); display: block; margin-bottom: 6px; }
        .filter-group input, .filter-group select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 16px; font-family: inherit; background: white; }
        .btn-clear { background: #64748b; color: white; border: none; padding: 10px 24px; border-radius: 16px; font-weight: 600; cursor: pointer; }

        /* Qirat Performance Grid */
        .section-title { font-size: 1.2rem; font-weight: 700; margin: 32px 0 20px 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
        .qirat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .qirat-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            position: relative;
        }
        .qirat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        .qirat-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .qirat-name { font-weight: 800; font-size: 1rem; color: var(--primary-dark); }
        .rank-badge { padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
        .rank-gold { background: #fef3c7; color: #92400e; }
        .rank-rising { background: #d1fae5; color: #065f46; }
        .rank-low { background: #fee2e2; color: #991b1b; }
        .qirat-actions { display: flex; gap: 6px; }
        .qirat-action-btn { background: none; border: none; padding: 6px 10px; border-radius: 20px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
        .qirat-action-btn:hover { background: var(--primary-light); color: var(--primary); }
        .qirat-action-btn.delete-qirat:hover { background: #fee2e2; color: var(--danger); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 10px; }
        .qirat-stats { font-size: 0.75rem; margin: 12px 0; display: flex; flex-direction: column; gap: 6px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; }
        .stat-tag { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .gender-mixed { background: #e0e7ff; color: #3730a3; }
        .gender-male { background: #dbeafe; color: #1e40af; }
        .gender-female { background: #fce7f3; color: #be185d; }
        .drill-btn { background: var(--border); border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; transition: all 0.2s; }
        .drill-btn:hover { background: var(--primary); color: white; }

        /* Smart Insights */
        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .insight-card {
            background: linear-gradient(135deg, #fef9e3, #fef3c7);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 5px solid #f59e0b;
            transition: transform 0.2s;
        }
        .insight-card:hover { transform: translateX(4px); }
        .insight-icon { font-size: 2rem; }
        .insight-content { flex: 1; }
        .insight-title { font-weight: 800; font-size: 0.9rem; color: #92400e; }
        .insight-desc { font-size: 0.75rem; color: #b45309; margin-top: 4px; }
        .insight-btn { background: white; border: none; padding: 6px 14px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .insight-btn:hover { background: var(--primary); color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 28px;
            max-width: 1300px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .modal-filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding: 16px; background: #f8fafc; border-radius: 20px; }
        .modal-filter-group { display: flex; align-items: center; gap: 8px; }
        .modal-filter-group input, .modal-filter-group select { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
        .export-buttons { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .export-btn { background: #e2e8f0; border: none; padding: 8px 18px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .export-btn:hover { background: var(--primary); color: white; }
        .drill-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .drill-table th, .drill-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .drill-table th { background: #f8fafc; position: sticky; top: 0; }
        .badge { padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-male { background: #dbeafe; color: #1e40af; }
        .badge-female { background: #fce7f3; color: #be185d; }
        .delete-qirat-btn { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px 8px; border-radius: 20px; }
        .delete-qirat-btn:hover { background: #fee2e2; }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            z-index: 200;
            display: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            color: var(--text-muted);
        }
        .nav-item i { font-size: 1.4rem; }
        .nav-item span { font-size: 0.7rem; font-weight: 500; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }

        @media (min-width: 768px) { body { padding-bottom: 0; } .bottom-nav { display: none; } }
        @media (max-width: 768px) { 
            .desktop-nav { display: none; } 
            .bottom-nav { display: flex; } 
            .main-container { padding: 16px; padding-bottom: 80px; } 
            .charts-row { grid-template-columns: 1fr; }
            .filters-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="header-content">
        <div class="logo"><h1><i class="fas fa-chart-line"></i> Analytics Studio</h1></div>
        <div class="desktop-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="groups.html" class="nav-link">Groups</a>
            <a href="tables.html" class="nav-link">Tables</a>
            <a href="analytics.html" class="nav-link active">Analytics</a>
            <a href="import.html" class="nav-link">Import</a>
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
</div>

<div class="main-container">
    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Charts -->
    <div class="charts-row">
        <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-line"></i> 30-Day Registration Trend</div><canvas id="trendChart"></canvas></div>
        <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-bar"></i> Top Qirats by Students</div><canvas id="barChart"></canvas></div>
        <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-pie"></i> Gender Distribution</div><canvas id="pieChart"></canvas></div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="filter-group"><label><i class="fas fa-search"></i> Search</label><input type="text" id="searchInput" placeholder="Name/Phone"></div>
        <div class="filter-group"><label><i class="fas fa-venus-mars"></i> Gender</label><select id="genderFilter"><option value="">All</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
        <div class="filter-group"><label><i class="fas fa-building"></i> Department</label><select id="deptFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-calendar"></i> Batch</label><select id="batchFilter"><option value="">All</option></select></div>
        <div class="filter-group"><label><i class="fas fa-book-quran"></i> Qirat</label><select id="qiratFilter"><option value="">All Qirats</option></select></div>
        <button class="btn-clear" id="clearFiltersBtn"><i class="fas fa-eraser"></i> Clear Filters</button>
    </div>

    <!-- Smart Insights -->
    <div class="section-title"><i class="fas fa-lightbulb"></i> Smart Insights <span style="font-size:0.8rem;">(Click to analyze with filters)</span></div>
    <div class="insights-grid" id="insightsContainer"></div>

    <!-- Qirat Performance -->
    <div class="section-title">
        <span><i class="fas fa-chart-simple"></i> Qirat Performance Analytics</span>
        <button class="btn-clear" id="deleteAllQiratsBtn" style="background:#ef4444; padding:8px 16px;"><i class="fas fa-trash"></i> Delete All Qirats</button>
    </div>
    <div class="qirat-grid" id="qiratGrid"></div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <button class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>Home</span></button>
    <button class="nav-item" onclick="window.location.href='groups.html'"><i class="fas fa-layer-group"></i><span>Groups</span></button>
    <button class="nav-item" onclick="window.location.href='tables.html'"><i class="fas fa-table"></i><span>Tables</span></button>
    <button class="nav-item active" onclick="window.location.href='analytics.html'"><i class="fas fa-chart-line"></i><span>Analytics</span></button>
    <button class="nav-item" onclick="window.location.href='import.html'"><i class="fas fa-upload"></i><span>Import</span></button>
</div>

<!-- Drill Modal -->
<div id="drillModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="drillTitle">Student Details</h3>
            <button id="closeModal" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="modal-filters" id="modalFilters">
            <div class="modal-filter-group"><i class="fas fa-search"></i><input type="text" id="modalSearch" placeholder="Search..."></div>
            <div class="modal-filter-group"><i class="fas fa-venus-mars"></i><select id="modalGender"><option value="">All Genders</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
            <div class="modal-filter-group"><i class="fas fa-building"></i><select id="modalDept"><option value="">All Depts</option></select></div>
            <div class="modal-filter-group"><i class="fas fa-calendar"></i><select id="modalBatch"><option value="">All Batches</option></select></div>
            <button class="btn-clear" id="clearModalFilters" style="padding:6px 16px;">Clear</button>
        </div>
        <div class="export-buttons">
            <button id="modalExportCSV" class="export-btn"><i class="fas fa-file-csv"></i> CSV</button>
            <button id="modalExportExcel" class="export-btn"><i class="fas fa-file-excel"></i> Excel</button>
            <button id="modalExportPDF" class="export-btn"><i class="fas fa-file-pdf"></i> PDF Report</button>
            <button id="modalExportWord" class="export-btn"><i class="fas fa-file-word"></i> Word</button>
        </div>
        <div style="overflow-x: auto;">
            <table class="drill-table">
                <thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Reg Date</th><th>Actions</th></tr></thead>
                <tbody id="drillTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAR_g5y04YAGCrTvZCowrE7hw8h7k1du08",
        authDomain: "jujm-qirat.firebaseapp.com",
        projectId: "jujm-qirat",
        storageBucket: "jujm-qirat.firebasestorage.app",
        messagingSenderId: "253413984903",
        appId: "1:253413984903:web:c1577e0fdef1711f960622"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allStudents = [];
    let filteredStudents = [];
    let charts = {};
    let currentDrillData = { originalData: [], filteredData: [], title: "", insightType: null, kpi: null };
    let currentQiratToDelete = null;
    
    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const genderFilter = document.getElementById('genderFilter');
    const deptFilter = document.getElementById('deptFilter');
    const batchFilter = document.getElementById('batchFilter');
    const qiratFilter = document.getElementById('qiratFilter');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const kpiGrid = document.getElementById('kpiGrid');
    const insightsContainer = document.getElementById('insightsContainer');
    const qiratGrid = document.getElementById('qiratGrid');
    const drillModal = document.getElementById('drillModal');
    const drillTitle = document.getElementById('drillTitle');
    const drillTableBody = document.getElementById('drillTableBody');
    const closeModal = document.getElementById('closeModal');
    const toast = document.getElementById('toast');
    const modalSearch = document.getElementById('modalSearch');
    const modalGender = document.getElementById('modalGender');
    const modalDept = document.getElementById('modalDept');
    const modalBatch = document.getElementById('modalBatch');
    const clearModalFilters = document.getElementById('clearModalFilters');
    const deleteAllQiratsBtn = document.getElementById('deleteAllQiratsBtn');
    
    function showToast(msg, isErr = false) { toast.textContent = msg; toast.style.background = isErr ? '#ef4444' : '#10b981'; toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 3000); }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getQiratNames(student) { return (student.schedules || []).map(s => s.qirat_name).filter(Boolean); }
    function formatStudent(s) { return { Name: s.full_name, Gender: s.gender, Phone: s.phone, Department: s.department, Batch: s.batch, Qirats: getQiratNames(s).join(', ') || '-', RegistrationDate: s.timestamp.toLocaleDateString(), id: s.id, schedules: s.schedules }; }
    
    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "registrations"));
            allStudents = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                let timestamp = data.timestamp?.toDate?.() || new Date(data.timestamp) || new Date();
                allStudents.push({
                    id: docSnap.id, full_name: data.full_name || 'N/A', gender: data.gender || 'Not Specified',
                    phone: data.phone || '', telegram: data.telegram || '', department: data.department || 'Other',
                    batch: data.batch || 'General', schedules: data.schedules || [], timestamp: timestamp
                });
            });
            populateFilters();
            applyFilters();
        } catch (error) { showToast("Error: " + error.message, true); }
    }
    
    function populateFilters() {
        const departments = [...new Set(allStudents.map(s => s.department))];
        const batches = [...new Set(allStudents.map(s => s.batch))];
        const allQirats = [...new Set(allStudents.flatMap(s => getQiratNames(s)))];
        deptFilter.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        batchFilter.innerHTML = '<option value="">All Batches</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
        qiratFilter.innerHTML = '<option value="">All Qirats</option>' + allQirats.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');
    }
    
    function applyFilters() {
        const search = searchInput.value.toLowerCase();
        const gender = genderFilter.value;
        const department = deptFilter.value;
        const batch = batchFilter.value;
        const qirat = qiratFilter.value;
        
        filteredStudents = allStudents.filter(s => {
            const matchSearch = s.full_name.toLowerCase().includes(search) || s.phone.includes(search);
            const matchGender = !gender || s.gender === gender;
            const matchDept = !department || s.department === department;
            const matchBatch = !batch || s.batch === batch;
            const matchQirat = !qirat || getQiratNames(s).includes(qirat);
            return matchSearch && matchGender && matchDept && matchBatch && matchQirat;
        });
        
        renderKPIs();
        renderCharts();
        renderQiratPerformance();
        renderInsights();
    }
    
    function getKPIs(data = filteredStudents) {
        const total = data.length;
        const allQirats = new Set(); data.forEach(s => getQiratNames(s).forEach(q => allQirats.add(q)));
        const activeQirats = allQirats.size;
        const male = data.filter(s => s.gender === 'Male').length;
        const female = data.filter(s => s.gender === 'Female').length;
        const multi = data.filter(s => getQiratNames(s).length > 1).length;
        const now = new Date(); const weekStart = new Date(now); weekStart.setDate(now.getDate() - 7);
        const lastWeek = data.filter(s => s.timestamp >= weekStart).length;
        const prevWeek = data.filter(s => s.timestamp >= new Date(weekStart.getTime() - 7*86400000) && s.timestamp < weekStart).length;
        const growth = prevWeek === 0 ? (lastWeek > 0 ? 100 : 0) : Math.round(((lastWeek - prevWeek) / prevWeek) * 100);
        return { total, activeQirats, male, female, multi, growth, lastWeek };
    }
    
    function renderKPIs() { const kpi = getKPIs(); kpiGrid.innerHTML = `<div class="kpi-card"><div class="kpi-title">Total Students</div><div class="kpi-value">${kpi.total}</div><div class="kpi-trend ${kpi.growth >= 0 ? 'trend-up' : 'trend-down'}"><i class="fas fa-arrow-${kpi.growth >= 0 ? 'up' : 'down'}"></i> ${Math.abs(kpi.growth)}% vs last week</div></div><div class="kpi-card"><div class="kpi-title">Active Qirats</div><div class="kpi-value">${kpi.activeQirats}</div></div><div class="kpi-card"><div class="kpi-title">Gender Split</div><div class="kpi-value">♂ ${kpi.male} | ♀ ${kpi.female}</div></div><div class="kpi-card"><div class="kpi-title">Multi-Enrolled</div><div class="kpi-value">${kpi.multi}</div></div>`; }
    
    function getDailyTrend() { const today = new Date(); const days = []; for (let i = 29; i >= 0; i--) { const d = new Date(); d.setDate(today.getDate() - i); d.setHours(0,0,0,0); days.push(d); } const map = new Map(); filteredStudents.forEach(s => { const key = s.timestamp.toISOString().slice(0,10); map.set(key, (map.get(key)||0)+1); }); return { labels: days.map(d => d.toISOString().slice(5,10)), counts: days.map(d => map.get(d.toISOString().slice(0,10)) || 0) }; }
    function getTopQirats() { const qCount = new Map(); filteredStudents.forEach(s => getQiratNames(s).forEach(q => qCount.set(q, (qCount.get(q)||0)+1))); return Array.from(qCount.entries()).map(([n,c]) => ({ name: n, count: c })).sort((a,b)=>b.count-a.count).slice(0,6); }
    
    function renderCharts() {
        const trend = getDailyTrend(); if (charts.trend) charts.trend.destroy(); charts.trend = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: trend.labels, datasets: [{ label: 'Registrations', data: trend.counts, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.3 }] }, options: { responsive: true, maintainAspectRatio: false } });
        const top = getTopQirats(); if (charts.bar) charts.bar.destroy(); charts.bar = new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels: top.map(t=>t.name), datasets: [{ label: 'Students', data: top.map(t=>t.count), backgroundColor: '#10b981', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'none' } } } });
        const kpi = getKPIs(); if (charts.pie) charts.pie.destroy(); charts.pie = new Chart(document.getElementById('pieChart'), { type: 'pie', data: { labels: ['Male', 'Female'], datasets: [{ data: [kpi.male, kpi.female], backgroundColor: ['#3b82f6', '#ec489a'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
    }
    
    function getQiratPerformance() {
        const qMap = new Map();
        filteredStudents.forEach(s => { getQiratNames(s).forEach(q => { if (!qMap.has(q)) qMap.set(q, { students: [], male: 0, female: 0, depts: new Set(), batches: new Set() }); const p = qMap.get(q); p.students.push(s); if (s.gender === 'Male') p.male++; else if (s.gender === 'Female') p.female++; p.depts.add(s.department); p.batches.add(s.batch); }); });
        return Array.from(qMap.entries()).map(([name, d]) => ({ name, total: d.students.length, male: d.male, female: d.female, deptCount: d.depts.size, batchCount: d.batches.size, engagement: filteredStudents.length ? Math.round((d.students.length / filteredStudents.length) * 100) : 0, students: d.students })).sort((a,b) => b.total - a.total);
    }
    
    async function deleteQiratFromAllStudents(qiratName) {
        if (!confirm(`⚠️ Remove "${qiratName}" from ALL students? This action cannot be undone.`)) return;
        showLoading("Removing Qirat...");
        let updatedCount = 0;
        for (const student of allStudents) {
            const currentQirats = student.schedules || [];
            const hasQirat = currentQirats.some(s => s.qirat_name === qiratName);
            if (hasQirat) {
                const newSchedules = currentQirats.filter(s => s.qirat_name !== qiratName);
                const studentRef = doc(db, "registrations", student.id);
                await updateDoc(studentRef, { schedules: newSchedules });
                updatedCount++;
            }
        }
        hideLoading();
        showToast(`✅ Removed "${qiratName}" from ${updatedCount} student(s)`);
        await loadData();
    }
    
    async function deleteAllQirats() {
        if (!confirm("⚠️ DELETE ALL QIRATS from ALL students? This will remove every Qirat from every student. This cannot be undone!")) return;
        showLoading("Removing all Qirats...");
        let updatedCount = 0;
        for (const student of allStudents) {
            if (student.schedules && student.schedules.length > 0) {
                const studentRef = doc(db, "registrations", student.id);
                await updateDoc(studentRef, { schedules: [] });
                updatedCount++;
            }
        }
        hideLoading();
        showToast(`✅ Removed all Qirats from ${updatedCount} student(s)`);
        await loadData();
    }
    
    function renderQiratPerformance() {
        const perf = getQiratPerformance();
        if (perf.length === 0) { qiratGrid.innerHTML = '<div class="empty-state">No Qirats found</div>'; return; }
        qiratGrid.innerHTML = perf.map((q, idx) => {
            let rankBadge = ''; let genderTag = '';
            if (idx === 0) rankBadge = '<span class="rank-badge rank-gold"><i class="fas fa-crown"></i> Top</span>';
            else if (q.engagement > 70) rankBadge = '<span class="rank-badge rank-rising"><i class="fas fa-chart-line"></i> Rising</span>';
            else if (q.total <= 2) rankBadge = '<span class="rank-badge rank-low"><i class="fas fa-exclamation-triangle"></i> Low</span>';
            if (q.male > 0 && q.female > 0) genderTag = `<span class="stat-tag gender-mixed"><i class="fas fa-venus-mars"></i> ${q.male}♂ | ${q.female}♀</span>`;
            else if (q.male > 0) genderTag = `<span class="stat-tag gender-male"><i class="fas fa-mars"></i> ${q.male} Male</span>`;
            else if (q.female > 0) genderTag = `<span class="stat-tag gender-female"><i class="fas fa-venus"></i> ${q.female} Female</span>`;
            return `<div class="qirat-card"><div class="qirat-header"><span class="qirat-name">📖 ${escapeHtml(q.name)}</span><div class="qirat-actions"><button class="qirat-action-btn delete-qirat" data-qirat="${escapeHtml(q.name)}" title="Delete this Qirat from all students"><i class="fas fa-trash-alt"></i></button></div>${rankBadge}</div><div class="progress-bar"><div class="progress-fill" style="width: ${q.engagement}%;"></div></div><div class="qirat-stats"><div class="stat-row"><span>${genderTag}</span><span class="stat-tag"><i class="fas fa-building"></i> ${q.deptCount} depts</span><span class="stat-tag"><i class="fas fa-graduation-cap"></i> ${q.batchCount} batches</span></div><div class="stat-row"><span>Engagement: ${q.engagement}%</span><span class="stat-tag">${q.total} students</span></div></div><button class="drill-btn" onclick="window.openDrillModal(${JSON.stringify(q.students.map(formatStudent)).replace(/"/g, '&quot;')}, '${escapeHtml(q.name)} (${q.total} students)', 'qirat')">View Students <i class="fas fa-external-link-alt"></i></button></div>`;
        }).join('');
        document.querySelectorAll('.delete-qirat').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); deleteQiratFromAllStudents(btn.dataset.qirat); }));
    }
    
    function generateInsights() {
        const perf = getQiratPerformance(); const kpi = getKPIs(); const insights = [];
        if (perf[0]) insights.push({ icon: '🏆', title: 'Most Popular Qirat', desc: `${perf[0].name} leads with ${perf[0].total} students`, data: perf[0].students.map(formatStudent), type: 'popular' });
        insights.push({ icon: kpi.growth >= 0 ? '📈' : '📉', title: kpi.growth >= 0 ? 'Weekly Growth Increasing' : 'Registrations Dropped', desc: `${kpi.lastWeek} new this week (${Math.abs(kpi.growth)}% ${kpi.growth >= 0 ? 'increase' : 'decrease'})`, data: filteredStudents.filter(s => { const w = new Date(); w.setDate(w.getDate() - 7); return s.timestamp >= w; }).map(formatStudent), type: 'growth' });
        const low = perf.filter(q => q.total <= 2); if (low.length) insights.push({ icon: '⚠️', title: 'Low Engagement Warning', desc: `${low.map(q=>q.name).join(', ')} have very few students`, data: low.flatMap(q => q.students.map(formatStudent)), type: 'warning' });
        const diverse = [...perf].sort((a,b) => (b.deptCount + b.batchCount) - (a.deptCount + a.batchCount))[0]; if (diverse) insights.push({ icon: '🌐', title: 'Highest Diversity', desc: `${diverse.name} spans ${diverse.deptCount} departments & ${diverse.batchCount} batches`, data: diverse.students.map(formatStudent), type: 'diversity' });
        const cross = filteredStudents.filter(s => getQiratNames(s).length > 1); if (cross.length) insights.push({ icon: '🔄', title: 'Cross-Enrollment', desc: `${cross.length} students in multiple Qirats`, data: cross.map(formatStudent), type: 'cross' });
        return insights;
    }
    
    function renderInsights() {
        const insights = generateInsights();
        insightsContainer.innerHTML = insights.map(ins => `<div class="insight-card"><div class="insight-icon">${ins.icon}</div><div class="insight-content"><div class="insight-title">${ins.title}</div><div class="insight-desc">${ins.desc}</div></div><button class="insight-btn" onclick="window.openDrillModal(${JSON.stringify(ins.data).replace(/"/g, '&quot;')}, '${ins.title}', '${ins.type}')">Analyze <i class="fas fa-arrow-right"></i></button></div>`).join('');
    }
    
    window.openDrillModal = (data, title, type) => {
        currentDrillData = { originalData: data, filteredData: data, title: title, insightType: type, kpi: getKPIs(data.map(d => ({ ...d, full_name: d.Name, gender: d.Gender, timestamp: new Date() }))) };
        drillTitle.textContent = title;
        populateModalFilters(data);
        renderModalTable();
        drillModal.classList.add('active');
    };
    
    function populateModalFilters(data) {
        const departments = [...new Set(data.map(s => s.Department))];
        const batches = [...new Set(data.map(s => s.Batch))];
        modalDept.innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        modalBatch.innerHTML = '<option value="">All Batches</option>' + batches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
        modalSearch.value = ''; modalGender.value = ''; modalDept.value = ''; modalBatch.value = '';
        applyModalFilters();
    }
    
    function applyModalFilters() {
        const search = modalSearch.value.toLowerCase();
        const gender = modalGender.value;
        const dept = modalDept.value;
        const batch = modalBatch.value;
        currentDrillData.filteredData = currentDrillData.originalData.filter(s => {
            const matchSearch = s.Name.toLowerCase().includes(search) || (s.Phone && s.Phone.includes(search));
            const matchGender = !gender || s.Gender === gender;
            const matchDept = !dept || s.Department === dept;
            const matchBatch = !batch || s.Batch === batch;
            return matchSearch && matchGender && matchDept && matchBatch;
        });
        renderModalTable();
    }
    
    function renderModalTable() {
        if (!currentDrillData.filteredData.length) { drillTableBody.innerHTML = `<tr><td colspan="8" class="empty-state">No students found</td></tr>`; return; }
        drillTableBody.innerHTML = currentDrillData.filteredData.map(s => `
            <tr>
                <td><strong>${escapeHtml(s.Name)}</strong></td>
                <td><span class="badge ${s.Gender === 'Male' ? 'badge-male' : 'badge-female'}">${escapeHtml(s.Gender)}</span></td>
                <td>${escapeHtml(s.Phone)}</td>
                <td>${escapeHtml(s.Department)}</td>
                <td>${escapeHtml(s.Batch)}</td>
                <td>${escapeHtml(s.Qirats)}</td>
                <td>${escapeHtml(s.RegistrationDate)}</td>
                <td><button class="delete-qirat-btn" onclick="window.deleteStudentFromModal('${s.id}')" title="Delete Student"><i class="fas fa-trash"></i></button></td>
            </tr>
        `).join('');
    }
    
    window.deleteStudentFromModal = async (id) => {
        if (confirm('Delete this student?')) {
            await deleteDoc(doc(db, "registrations", id));
            showToast('Student deleted');
            await loadData();
            const newData = currentDrillData.originalData.filter(s => s.id !== id);
            currentDrillData.originalData = newData;
            applyModalFilters();
        }
    };
    
    function getModalExportData() { return currentDrillData.filteredData.map(s => ({ Name: s.Name, Gender: s.Gender, Phone: s.Phone, Department: s.Department, Batch: s.Batch, Qirats: s.Qirats, RegistrationDate: s.RegistrationDate })); }
    
    function modalExportCSV() { const data = getModalExportData(); if (!data.length) return alert('No data'); const headers = ['Name','Gender','Phone','Department','Batch','Qirats','RegistrationDate']; const rows = data.map(r => headers.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(',')); const blob = new Blob(["\uFEFF" + [headers.join(','), ...rows].join('\n')], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${currentDrillData.title.replace(/[^a-z0-9]/gi,'_')}.csv`; a.click(); URL.revokeObjectURL(a.href); showToast('CSV exported'); }
    function modalExportExcel() { const data = getModalExportData(); if (!data.length) return alert('No data'); const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data'); XLSX.writeFile(wb, `${currentDrillData.title.replace(/[^a-z0-9]/gi,'_')}.xlsx`); showToast('Excel exported'); }
    async function modalExportPDF() { const data = getModalExportData(); if (!data.length) return alert('No data'); const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape' }); const kpi = currentDrillData.kpi || getKPIs(); doc.setFontSize(18); doc.setTextColor(16,185,129); doc.text("JUMJ Irshad - Insight Report", 14, 20); doc.setFontSize(12); doc.text(currentDrillData.title, 14, 32); doc.setFontSize(9); doc.text(`Generated: ${new Date().toLocaleString()} | Total: ${data.length} students`, 14, 40); if(currentDrillData.insightType) { doc.setFontSize(10); doc.setTextColor(245,158,11); doc.text(`Context: ${currentDrillData.insightType}`, 14, 48); } let y = 56; doc.setFontSize(10); doc.text("Summary KPIs", 14, y); y+=6; doc.setFontSize(9); doc.text(`Total Students: ${kpi.total}`, 14, y); y+=5; doc.text(`Active Qirats: ${kpi.activeQirats}`, 14, y); y+=5; doc.text(`Gender: ♂ ${kpi.male} | ♀ ${kpi.female}`, 14, y); y+=5; doc.text(`Multi-Enrolled: ${kpi.multi}`, 14, y); y+=8; doc.autoTable({ head: [['Name','Gender','Phone','Department','Batch','Qirats','Date']], body: data.map(r => [r.Name, r.Gender, r.Phone, r.Department, r.Batch, r.Qirats, r.RegistrationDate]), startY: y+2, headStyles: { fillColor: [16,185,129] }, styles: { fontSize: 8 } }); doc.save(`${currentDrillData.title.replace(/[^a-z0-9]/gi,'_')}_report.pdf`); showToast('PDF exported'); }
    function modalExportWord() { const data = getModalExportData(); if (!data.length) return alert('No data'); let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${currentDrillData.title}</title><style>body{font-family:Arial;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #ddd;padding:8px;} th{background:#10b981;color:white;}</style></head><body><h1>JUMJ Irshad Report</h1><h2>${currentDrillData.title}</h2><p>Generated: ${new Date().toLocaleString()} | Total: ${data.length}</p>${currentDrillData.insightType ? `<p><strong>Insight:</strong> ${currentDrillData.insightType}</p>` : ''}<h3>Student List</h3><table><thead><tr><th>Name</th><th>Gender</th><th>Phone</th><th>Department</th><th>Batch</th><th>Qirats</th><th>Date</th></tr></thead><tbody>${data.map(r => `<tr><td>${escapeHtml(r.Name)}</td><td>${escapeHtml(r.Gender)}</td><td>${escapeHtml(r.Phone)}</td><td>${escapeHtml(r.Department)}</td><td>${escapeHtml(r.Batch)}</td><td>${escapeHtml(r.Qirats)}</td><td>${escapeHtml(r.RegistrationDate)}</td>`).join('')}</tbody></table></body></html>`;
        const blob = new Blob([html], { type: 'application/msword' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${currentDrillData.title.replace(/[^a-z0-9]/gi,'_')}.doc`; a.click(); URL.revokeObjectURL(a.href); showToast('Word exported'); }
    
    function showLoading(msg) { const overlay = document.createElement('div'); overlay.id = 'customLoading'; overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:2000;'; overlay.innerHTML = `<div style="background:white;padding:30px;border-radius:30px;text-align:center;"><div class="loading-spinner" style="width:50px;height:50px;border:4px solid #d1fae5;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div><p>${msg}</p></div>`; document.body.appendChild(overlay); }
    function hideLoading() { const el = document.getElementById('customLoading'); if (el) el.remove(); }
    
    searchInput.addEventListener('input', applyFilters);
    genderFilter.addEventListener('change', applyFilters);
    deptFilter.addEventListener('change', applyFilters);
    batchFilter.addEventListener('change', applyFilters);
    qiratFilter.addEventListener('change', applyFilters);
    clearFiltersBtn.addEventListener('click', () => { searchInput.value = ''; genderFilter.value = ''; deptFilter.value = ''; batchFilter.value = ''; qiratFilter.value = ''; applyFilters(); });
    deleteAllQiratsBtn.addEventListener('click', deleteAllQirats);
    modalSearch.addEventListener('input', applyModalFilters);
    modalGender.addEventListener('change', applyModalFilters);
    modalDept.addEventListener('change', applyModalFilters);
    modalBatch.addEventListener('change', applyModalFilters);
    clearModalFilters.addEventListener('click', () => { modalSearch.value = ''; modalGender.value = ''; modalDept.value = ''; modalBatch.value = ''; applyModalFilters(); });
    closeModal.addEventListener('click', () => drillModal.classList.remove('active'));
    window.addEventListener('click', (e) => { if (e.target === drillModal) drillModal.classList.remove('active'); });
    document.getElementById('modalExportCSV').addEventListener('click', modalExportCSV);
    document.getElementById('modalExportExcel').addEventListener('click', modalExportExcel);
    document.getElementById('modalExportPDF').addEventListener('click', modalExportPDF);
    document.getElementById('modalExportWord').addEventListener('click', modalExportWord);
    
    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
